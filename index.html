function initials(name) {
    const w = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!w.length) return "?";
    return ((w[0][0] || "") + (w.length > 1 ? w[w.length - 1][0] : (w[0][1] || ""))).toUpperCase();
}

// =====================================================================
// SCHEDULING ENGINE (no DOM - pure function of the roster + ratings)
// =====================================================================
function buildLineup(st, ratings, seed) {
    const warnings = [];
    const seedPos = seed && seed.handover !== undefined ? seed.handover : seed;
    const deferredFromAM = new Set((seed && seed.deferBreaks) || []);   // AM trainers whose break waits until their training ends
    const deferBreaks = [];
    const OPEN = toMin(STORE_HOURS.open), CLOSE = toMin(STORE_HOURS.close), SPLIT = toMin(DAYPART_SPLIT);
    const isAM = st.daypart === "AM";
    // AM: open until the 2:00 handover (one extra 15-minute step shows who takes over at 2).
    // PM: 2:00 until close.
    const dayStart = isAM ? OPEN : Math.max(OPEN, SPLIT);
    const dayEnd = isAM ? Math.min(CLOSE, SPLIT + STEP) : CLOSE;
    const calledOff = (st.roster || []).filter(r => r.name && r.calledOff).map(r => r.name);
    const everyone = (st.roster || [])
        .filter(r => r.name && !r.calledOff && toMin(r.start) !== null && toMin(r.end) !== null)
        .map(r => {
            const s = round15(toMin(r.start));
            let e = round15(toMin(r.end));
            if (e <= s) e += 1440;
            // shiftStart/shiftEnd = their real shift; start/end = the part this lineup covers
            return { name: r.name, shiftStart: s, shiftEnd: e, start: Math.max(s, dayStart), end: Math.min(e, dayEnd), floater: !!r.floater };
        });
    everyone.filter(p => p.end <= p.start).forEach(p => warnings.push(`${p.name}'s shift is outside ${isAM ? "the AM lineup (open – 2:00)" : "the PM lineup (2:00 – close)"}, so they aren't in it.`));
    const traineeNames = new Set((st.trainings || []).filter(x => x.trainee).map(x => x.trainee.trim().toLowerCase()));
    everyone.filter(p => traineeNames.has(p.name.toLowerCase())).forEach(p => warnings.push(`${p.name} is a trainee, so they aren't counted as a body — take them off the roster if that's a mistake.`));
    const people = everyone.filter(p => p.end > p.start && !traineeNames.has(p.name.toLowerCase()));
    if (!people.length) return null;

    const W0 = Math.min(...people.map(p => p.start));
    const W1 = Math.max(...people.map(p => p.end));
    const slots = [];
    for (let t = W0; t < W1; t += STEP) slots.push(t);
    // Tasks have to be done before the handover in the AM
    const TW1 = isAM ? Math.min(W1, SPLIT) : W1;

    // A typed clock time placed inside this lineup's window (handles past midnight)
    const norm = v => { let m = toMin(v); if (m === null) return null; m = round15(m); if (m < W0 - 360) m += 1440; return m; };
    const onShift = (p, t) => p.start <= t && t < p.end;
    const headAt = t => people.filter(p => onShift(p, t)).length;
    const peak = Math.max(...slots.map(headAt));
    const runnerSetting = String(st.runners || "auto");
    const maxConc = runnerSetting === "auto" ? (peak >= 14 ? 2 : 1) : Math.max(1, +runnerSetting);
    const inLunch = (s, e) => [0, 1440].some(off => s < LUNCH_BLOCK[1] + off && e > LUNCH_BLOCK[0] + off);
    const rotEvery = Math.max(0, +st.rotation || 0);

    // "Keep what already happened": everything before lock.until is copied from the earlier lineup
    const lock = st.lock && st.lock.until ? st.lock : null;
    const lockUntil = lock ? lock.until : -Infinity;
    const lockAt = (pos, t) => { const seg = ((lock && lock.positions && lock.positions[pos]) || []).find(x => x.from <= t && t < x.to); return seg ? seg.name : null; };
    const lockedTask = key => lock ? (lock.tasks || []).find(k => k.key === key && k.start < lock.until) || null : null;

    const tasks = [];
    const busyIntervals = [];
    const concAt = t => busyIntervals.filter(([a, b]) => a <= t && t < b).length;
    const leaders = new Set(st.leaders || []);
    const overlaps = (a0, a1, b0, b1) => a0 < b1 && b0 < a1;
    const fixedBusy = {};      // name -> [[start, end]] someone can't be on break during (catering, covering a trainer)
    const addFixed = (n, a, b) => { (fixedBusy[n] = fixedBusy[n] || []).push([a, b]); };
    const ownBusy = (n, a, b) => (fixedBusy[n] || []).some(([x, y]) => overlaps(a, b, x, y));

    const cateringPrep = [];   // split caterings: the supplies part gets a time later, once breaks are set
    // Catering — pickup: out of position for the prep time before it's due.
    //            delivery: prep before they leave, then gone for the delivery time (rounded up to the next 15 minutes).
    (st.caterings || []).forEach((c, i) => {
        const due = norm(c.due);
        if (!c.name || due === null) return;
        const delivery = c.type === "delivery";
        // Split prep: supplies (boxes, paper goods) any time earlier + food right before. Otherwise one prep time.
        const prepMins = c.split ? (+c.food || 0) : (+c.mins || (delivery ? 0 : 30));
        const prep = delivery || c.split ? Math.max(0, Math.ceil(prepMins / STEP) * STEP) : Math.max(STEP, Math.ceil(prepMins / STEP) * STEP);
        const gone = delivery ? Math.max(STEP, Math.ceil((+c.gone || 40) / STEP) * STEP) : 0;
        const what = delivery ? `delivery leaving ${fmtClock(due)}` : `catering due ${fmtClock(due)}`;
        // Someone who only comes in for the catering: not a body, no spot, no break, nobody covers them
        if (c.offRoster && !people.some(x => x.name === c.name)) {
            const all = c.split ? (+c.supplies || 0) + (+c.food || 0) : prepMins;
            const pre = Math.max(delivery ? 0 : STEP, Math.ceil(all / STEP) * STEP);
            const a0 = due - pre, b0 = due + gone;
            if (b0 <= a0) return;
            tasks.push({ type: delivery ? "delivery" : "catering", label: delivery ? "Delivery" : "Catering", key: `catering#${i}`, start: a0, end: b0,
                deadline: due, leaves: delivery ? due : null, back: delivery ? due + (+c.gone || 40) : null, forced: c.name, offRoster: true, pinned: true, food: null });
            return;
        }
        const p = people.find(x => x.name === c.name);
        if (!p) { warnings.push(`${c.name} has a ${what} but isn't working this lineup.`); return; }
        let a = due - prep, b = due + gone;
        if (a < p.start || b > p.end) {
            warnings.push(`${c.name} isn't here for all of the ${what} (needs ${fmtClock(due - prep)} – ${fmtClock(due + gone)}).`);
            a = Math.max(a, p.start); b = Math.min(b, p.end);
            if (b <= a) return;
        }
        if (b <= a && !c.split) return;
        if (b > a) tasks.push({ type: delivery ? "delivery" : "catering", label: delivery ? "Delivery" : "Catering", key: `catering#${i}`, start: a, end: b,
            deadline: due, leaves: delivery ? due : null, back: delivery ? due + (+c.gone || 40) : null, forced: c.name, pinned: true,
            food: c.split ? (+c.food || 0) : null });
        if (c.split && (+c.supplies || 0) > 0) cateringPrep.push({ i, name: c.name, before: a, mins: +c.supplies, due, delivery });
        if (b > a) { busyIntervals.push([a, b]); addFixed(c.name, a, b); }
    });

    // Training: the trainer is the body and is put in the training spot for the session, no matter its priority
    const sessions = [];
    (st.trainings || []).forEach((tr, i) => {
        if (!tr.trainee || !tr.trainer || !POS_INFO[tr.pos]) return;
        let a = norm(tr.start), b = norm(tr.end);
        if (a === null || b === null) return;
        if (b <= a) b += 1440;
        const T = people.find(x => x.name === tr.trainer);
        if (!T) { warnings.push(`${tr.trainer} is training ${tr.trainee} but isn't on the roster for this lineup — add them so the training can be planned.`); return; }
        leaders.add(tr.trainer);
        const s2 = Math.max(a, T.start), e2 = Math.min(b, T.end);
        if (a < T.shiftStart || b > T.shiftEnd) warnings.push(`${tr.trainer}'s shift doesn't cover all of ${tr.trainee}'s training (${fmtClock(a)} – ${fmtClock(b)}).`);
        if (e2 <= s2) return;
        const clash = sessions.find(x => overlaps(s2, e2, x.start, x.end) && (x.trainer === tr.trainer || x.pos === tr.pos));
        if (clash) { warnings.push(`${tr.trainee}'s training overlaps ${clash.trainee}'s (${clash.trainer === tr.trainer ? `same trainer, ${tr.trainer}` : `same spot, ${tr.pos}`}), so it was skipped.`); return; }
        (fixedBusy[tr.trainer] || []).forEach(([x, y]) => { if (overlaps(s2, e2, x, y)) warnings.push(`${tr.trainer} has a catering during ${tr.trainee}'s training.`); });
        sessions.push({ i, trainee: tr.trainee.trim(), trainer: tr.trainer, pos: tr.pos, start: s2, end: e2, fullStart: a, fullEnd: b });
    });
    const sessionOf = (n, t) => sessions.find(x => x.trainer === n && x.start <= t && t < x.end) || null;
    // Does the trainee get a break, and when could it be? (same 5-hour / 2-hours-in rules, decided by the session's real times)
    sessions.forEach(x => {
        x.tb = null;
        if (x.fullEnd - x.fullStart <= BREAK_MIN_SHIFT) return;
        let ideal = x.fullStart + BREAK_AFTER;
        if (isAM && ideal + BREAK_LEN > SPLIT) return;
        if (!isAM && x.fullStart < SPLIT) { if (ideal + BREAK_LEN <= SPLIT) return; ideal = Math.max(ideal, SPLIT); }
        ideal = Math.max(ideal, x.start);
        const last = x.end - BREAK_LEN;
        if (ideal > last) return;
        x.tb = { ideal, latest: Math.max(ideal, Math.min(x.fullEnd - 90, last)), last };
    });

    // Breaks: soonest at 2 hours into their real shift, never 12-1, spread so they don't stack up
    const breaks = [];
    const isTrainer = n => sessions.some(x => x.trainer === n);
    people.filter(p => p.shiftEnd - p.shiftStart > BREAK_MIN_SHIFT)
        .sort((a, b) => (isTrainer(b.name) - isTrainer(a.name)) || a.shiftStart - b.shiftStart || a.name.localeCompare(b.name))
        .forEach(p => {
            let ideal = p.shiftStart + BREAK_AFTER;
            if (isAM && ideal + BREAK_LEN > SPLIT) return;                 // belongs to the PM lineup
            if (!isAM && p.shiftStart < SPLIT) {
                if (ideal + BREAK_LEN <= SPLIT && !deferredFromAM.has(p.name)) return;   // already taken in the AM
                ideal = Math.max(ideal, SPLIT);
            }
            ideal = Math.max(ideal, p.start);
            const breakEnd = isAM ? Math.min(p.end, SPLIT) : p.end;
            if (ideal + BREAK_LEN > breakEnd) { warnings.push(`${p.name}'s break would fall after close.`); return; }
            const latest = Math.max(ideal, Math.min(p.shiftEnd - 90, breakEnd - BREAK_LEN));
            let chosen = null, override = false;
            const lb = lock && (lock.breaks || []).find(b => b.name === p.name && b.start < lock.until);
            if (lb) { chosen = lb.start; override = true; }
            const ov = st.breakOverrides && st.breakOverrides[p.name];
            if (chosen === null && ov) {
                const s = norm(ov);
                if (s !== null && s >= p.start && s + BREAK_LEN <= p.end) { chosen = s; override = true; }
            }
            const breaksAt = t => breaks.filter(b => b.start <= t && t < b.end).length;
            const underCap = s0 => { for (let t = s0; t < s0 + BREAK_LEN; t += STEP) if (breaksAt(t) >= MAX_BREAKS_AT_ONCE) return false; return true; };
            const lastPossible = Math.max(ideal, breakEnd - BREAK_LEN);
            const blocked = s0 => ownBusy(p.name, s0, s0 + BREAK_LEN);

            // ---- Trainers: their break has to keep the training going ----
            if (isTrainer(p.name)) {
                const mine = sessions.filter(x => x.trainer === p.name);
                const leaderFree = (s0) => people.find(L => L.name !== p.name && leaders.has(L.name) && L.start <= s0 && s0 + BREAK_LEN <= L.end
                    && !sessions.some(x => x.trainer === L.name && overlaps(s0, s0 + BREAK_LEN, x.start, x.end))
                    && !ownBusy(L.name, s0, s0 + BREAK_LEN)
                    && !breaks.some(b => b.name === L.name && overlaps(s0, s0 + BREAK_LEN, b.start, b.end)));
                const otherSession = (s0, ses) => sessions.find(x => x !== ses && x.trainer !== p.name && x.start <= s0 && s0 + BREAK_LEN <= x.end
                    && !breaks.some(b => b.name === x.trainer && overlaps(s0, s0 + BREAK_LEN, b.start, b.end)));
                // How a break at s0 would work: free (no trainee then), joint (trainee breaks too), leader cover, or merge
                const howAt = s0 => {
                    const ses = mine.find(x => overlaps(s0, s0 + BREAK_LEN, x.start, x.end));
                    if (!ses) return { kind: "free", cost: 0 };
                    if (ses.tb && s0 >= ses.tb.ideal && s0 <= ses.tb.last && s0 + BREAK_LEN <= ses.end) return { kind: "joint", cost: 0.5, ses };
                    const L = leaderFree(s0);
                    if (L) return { kind: "leader", cost: 4, ses, leader: L.name };
                    const o = otherSession(s0, ses);
                    if (o) return { kind: "merge", cost: 6, ses, mergeWith: o.trainer };
                    return null;
                };
                let pick = null;
                const forcedAt = lb ? lb.start : (ov ? chosen : null);
                if (forcedAt !== null) {
                    pick = Object.assign({ s0: forcedAt }, howAt(forcedAt) || { kind: "forced", ses: mine.find(x => overlaps(forcedAt, forcedAt + BREAK_LEN, x.start, x.end)) });
                } else {
                    for (let s0 = ideal; s0 <= lastPossible; s0 += STEP) {
                        if (inLunch(s0, s0 + BREAK_LEN) || !underCap(s0) || blocked(s0)) continue;
                        const how = howAt(s0);
                        if (!how) continue;
                        const cost = how.cost + (s0 - ideal) / STEP + (concAt(s0) >= maxConc ? 1 : 0);
                        if (!pick || cost < pick.cost) pick = Object.assign({ s0, cost }, how);
                    }
                }
                if ((!pick || pick.kind === "forced") && forcedAt === null && isAM && p.shiftEnd > SPLIT + BREAK_LEN
                    && mine.some(x => x.end >= SPLIT || overlaps(ideal, lastPossible + BREAK_LEN, x.start, x.end))) {
                    deferBreaks.push(p.name);
                    warnings.push(`${p.name}'s break waits until the training is over — it's on the PM lineup at ${fmtClock(SPLIT)}, since no other leader can break them.`);
                    return;
                }
                if (!pick) {
                    let s0 = ideal;
                    for (let x = ideal; x <= lastPossible; x += STEP) if (!inLunch(x, x + BREAK_LEN) && !blocked(x)) { s0 = x; break; }
                    pick = { s0, kind: "forced", ses: mine.find(x => overlaps(s0, s0 + BREAK_LEN, x.start, x.end)) };
                }
                if (pick.kind === "forced" && pick.ses) warnings.push(`No other leader or training session is free to break ${p.name} without stopping ${pick.ses.trainee}'s training — at ${fmtClock(pick.s0)} someone covers ${pick.ses.pos} and ${pick.ses.trainee} waits.`);
                if (pick.kind === "leader") addFixed(pick.leader, pick.s0, pick.s0 + BREAK_LEN);
                if (pick.kind === "merge") addFixed(pick.mergeWith, pick.s0, pick.s0 + BREAK_LEN);
                if (forcedAt === null && pick.s0 - ideal >= 60) warnings.push(`${p.name}'s break was pushed to ${fmtClock(pick.s0)} (ideal was ${fmtClock(ideal)}) to keep the training going.`);
                breaks.push({ name: p.name, start: pick.s0, end: pick.s0 + BREAK_LEN, ideal, override: forcedAt !== null, pos: null, cover: null,
                    kind: pick.kind, trainee: pick.ses ? pick.ses.trainee : null, trainingPos: pick.ses ? pick.ses.pos : null,
                    leaderCover: pick.leader || null, mergeWith: pick.mergeWith || null });
                busyIntervals.push([pick.s0, pick.s0 + BREAK_LEN]);
                if (pick.kind === "joint") pick.ses.jointAt = pick.s0;
                return;
            }
            // 1) ideal window, not stacked on other breaks/tasks
            if (chosen === null) {
                for (let s = ideal; s <= latest; s += STEP) {
                    if (inLunch(s, s + BREAK_LEN) || !underCap(s) || blocked(s)) continue;
                    let ok = true;
                    for (let t = s; t < s + BREAK_LEN; t += STEP) if (concAt(t) >= maxConc) ok = false;
                    if (ok) { chosen = s; break; }
                }
            }
            // 2) ideal window, sharing with a task or one other break (still never more than 2 breaks)
            if (chosen === null) {
                for (let s = ideal; s <= latest; s += STEP) if (!inLunch(s, s + BREAK_LEN) && underCap(s) && !blocked(s)) { chosen = s; break; }
                if (chosen !== null) warnings.push(`${p.name}'s break at ${fmtClock(chosen)} overlaps another break or task, so a position closes for it.`);
            }
            // 3) later in their shift, still never more than 2 breaks
            if (chosen === null) {
                for (let s = latest + STEP; s <= lastPossible; s += STEP) if (!inLunch(s, s + BREAK_LEN) && underCap(s) && !blocked(s)) { chosen = s; break; }
            }
            if (chosen === null) {
                for (let s = ideal; s <= lastPossible; s += STEP) if (!inLunch(s, s + BREAK_LEN) && !blocked(s)) { chosen = s; break; }
                if (chosen === null) { chosen = ideal; warnings.push(`${p.name}'s break could not be kept out of 12–1.`); }
                else warnings.push(`${p.name}'s break at ${fmtClock(chosen)} makes more than ${MAX_BREAKS_AT_ONCE} breaks at once — there was no other time in their shift.`);
            } else if (override && !underCap(chosen) && breaks.some(b => b.start < chosen + BREAK_LEN && chosen < b.end)) {
                warnings.push(`${p.name}'s break at ${fmtClock(chosen)} makes more than ${MAX_BREAKS_AT_ONCE} breaks at once.`);
            }
            if (!override && chosen - ideal >= 60) warnings.push(`${p.name}'s break was pushed to ${fmtClock(chosen)} (ideal was ${fmtClock(ideal)}).`);
            breaks.push({ name: p.name, start: chosen, end: chosen + BREAK_LEN, ideal, override, pos: null, cover: null });
            busyIntervals.push([chosen, chosen + BREAK_LEN]);
        });

    const traineeBreaks = [];
    sessions.forEach(x => {
        if (!x.tb) return;
        let s0 = null, override = false;
        const ov = st.breakOverrides && st.breakOverrides[x.trainee];
        if (ov) { const m = norm(ov); if (m !== null && m >= x.start && m + BREAK_LEN <= x.end) { s0 = m; override = true; } }
        if (s0 === null && x.jointAt !== undefined) s0 = x.jointAt;
        const trainerOff = a => breaks.some(b => b.name === x.trainer && overlaps(a, a + BREAK_LEN, b.start, b.end));
        if (s0 === null) for (let a = x.tb.ideal; a <= x.tb.last; a += STEP) if (!inLunch(a, a + BREAK_LEN) && !trainerOff(a)) { s0 = a; break; }
        if (s0 === null) { warnings.push(`Couldn't fit ${x.trainee}'s break into their training.`); return; }
        const joint = trainerOff(s0);
        traineeBreaks.push({ name: x.trainee, trainee: true, start: s0, end: s0 + BREAK_LEN, ideal: x.tb.ideal, override,
            kind: joint ? "joint" : "trainerRuns", trainer: x.trainer, pos: x.pos, cover: null });
    });

    // ---- Tasks go in the quietest open times, around the breaks ----
    const rush = RUSH_PERIODS.map(([a, b]) => [toMin(a), toMin(b)]);
    const inRush = (s, e) => rush.some(([a, b]) => [0, 1440].some(off => s < b + off && e > a + off));
    const quietCost = (s, len) => {
        let sc = 0;
        for (let t = s; t < s + len; t += STEP) {
            sc += concAt(t) * 10;
            const n = headAt(t);
            if (n === 0) sc += 1000; else if (n < 3) sc += 40; else if (n < 6) sc += 8;
        }
        if (inLunch(s, s + len)) sc += 30;
        if (inRush(s, s + len)) sc += 15;
        return sc;
    };
    const bestSlot = (lo, hi, cost) => {
        let best = lo, bestScore = Infinity;
        for (let s = lo; s <= hi; s += STEP) {
            const sc = cost(s);
            if (sc < bestScore) { bestScore = sc; best = s; }
        }
        return best;
    };
    const pinned = key => {
        const lt = lockedTask(key);
        if (lt) return lt.start;
        const v = st.taskOverrides && st.taskOverrides[key];
        const m = v ? norm(v) : null;
        return (m !== null && m >= W0 && m < TW1) ? m : null;
    };
    const addTask = k => {
        const lt = lockedTask(k.key);
        k.pinned = pinned(k.key) !== null;
        k.lockedName = lt ? lt.name : null;
        tasks.push(k);
        busyIntervals.push([k.start, k.end]);
    };

    // Catering supplies (split prep): the same person, any time before the food part — at the quietest open time
    cateringPrep.forEach(cp => {
        const p = people.find(x => x.name === cp.name);
        if (!p) return;
        const len = Math.max(STEP, Math.ceil(cp.mins / STEP) * STEP);
        const key = `catprep#${cp.i}`;
        const hi = Math.min(cp.before - len, TW1 - len);
        const lo = Math.max(p.start, W0);
        const mine = (a0, a1) => breaks.some(b => b.name === cp.name && overlaps(a0, a1, b.start, b.end)) || ownBusy(cp.name, a0, a1)
            || tasks.some(k => k.forced === cp.name && overlaps(a0, a1, k.start, k.end));
        let s0 = pinned(key);
        if (s0 !== null && (s0 + len > cp.before || mine(s0, s0 + len))) s0 = null;
        if (s0 === null) {
            if (hi < lo) { warnings.push(`There isn't time before ${cp.name}'s ${cp.delivery ? "delivery" : "catering"} (${fmtClock(cp.due)}) to prep the supplies separately — they're done right before the food.`); s0 = Math.max(lo, cp.before - len); }
            else {
                let best = null, bestScore = Infinity;
                for (let x = lo; x <= hi; x += STEP) {
                    if (mine(x, x + len)) continue;
                    const sc = quietCost(x, len) + (x - lo) / STEP * 0.05;
                    if (sc < bestScore) { bestScore = sc; best = x; }
                }
                if (best === null) { warnings.push(`${cp.name} has no open time for the catering supplies before ${fmtClock(cp.due)}.`); return; }
                s0 = best;
            }
        }
        // Landed right before the food part anyway? Make it one block using the real total time (no double rounding)
        const foodTask = tasks.find(k => k.key === `catering#${cp.i}`);
        if (pinned(key) === null && s0 + len >= cp.before) {
            const total = Math.ceil((cp.mins + (foodTask ? foodTask.food || 0 : 0)) / STEP) * STEP;
            const newStart = cp.due - total;
            if (foodTask) {
                if (newStart < foodTask.start) { busyIntervals.push([newStart, foodTask.start]); addFixed(cp.name, newStart, foodTask.start); foodTask.start = newStart; }
                foodTask.merged = true;
            } else {
                tasks.push({ type: cp.delivery ? "delivery" : "catering", label: cp.delivery ? "Delivery" : "Catering", key: `catering#${cp.i}`, start: newStart, end: cp.due, deadline: cp.due, forced: cp.name, pinned: true, food: 0, merged: true });
                busyIntervals.push([newStart, cp.due]); addFixed(cp.name, newStart, cp.due);
            }
            return;
        }
        addTask({ type: "catprep", label: "Catering supplies", key, start: s0, end: s0 + len, forced: cp.name, deadline: cp.due, mins: cp.mins });
        addFixed(cp.name, s0, s0 + len);
    });

    // Lemonade: 1 hour, done by the time entered, in the quietest hour before that (fresher wins ties)
    (st.lemonade || []).map(norm).filter(v => v !== null).sort((a, b) => a - b).forEach((deadline, idx) => {
        const key = `lemonade#${idx}`;
        let hi = Math.min(deadline - 60, TW1 - 60);
        let lo = Math.max(W0, deadline - 180);
        if (hi < W0) {
            hi = lo = W0;
            warnings.push(`Lemonade needed by ${fmtClock(deadline)} can't be done in time — it starts at ${fmtClock(W0)}.`);
        } else if (lo > hi) lo = hi;
        let s = pinned(key);
        if (s === null) s = bestSlot(lo, hi, x => quietCost(x, 60) + (hi - x) / STEP);
        addTask({ type: "lemonade", label: "Lemonade", key, start: s, end: s + 60, deadline });
    });

    // Parking lot sweeps: never more than 4 hours apart (from opening / first person in), as few as possible
    if (st.sweep && st.sweep.on) {
        let prevSweep = W0, idx = 0;
        while (TW1 - prevSweep > SWEEP_EVERY && idx < 8) {
            const key = `sweep#${idx}`;
            const hi = Math.min(prevSweep + SWEEP_EVERY, TW1 - 30);
            const lo = Math.min(Math.max(W0, prevSweep + SWEEP_EVERY / 2), hi);
            let s = pinned(key);
            if (s === null) s = bestSlot(lo, hi, x => quietCost(x, 30) + (hi - x) / STEP * 1.5);
            addTask({ type: "sweep", label: "Parking Lot Sweep", key, start: s, end: s + 30 });
            prevSweep = Math.max(s, prevSweep + STEP);
            idx++;
        }
    }

    // Ice bin: once, 15 minutes, at the quietest point (not in the first hour or the closing stretch)
    if (st.ice && st.ice.on) {
        const key = "ice#0";
        const lo = Math.min(W0 + 60, TW1 - 15);
        const hi = Math.max(lo, TW1 - 45);
        let s = pinned(key);
        if (s === null) s = bestSlot(lo, hi, x => quietCost(x, 15));
        addTask({ type: "ice", label: "Ice Bin", key, start: s, end: s + 15 });
    }
    tasks.sort((a, b) => a.start - b.start);

    // Break runners are set aside once for each stretch of breaks/tasks (not pulled in and out),
    // and the number of runners stays the same for the whole stretch.
    const spans = [...breaks.map(b => [b.start, b.end]), ...tasks.map(k => [k.start, k.end])].sort((a, b) => a[0] - b[0]);
    const windows = [];
    spans.forEach(([a, b]) => {
        const w = windows[windows.length - 1];
        if (w && a - w.end <= 90) w.end = Math.max(w.end, b);
        else windows.push({ start: a - STEP, end: b });
    });
    windows.forEach(w => {
        let mc = 0, pk = 0;
        for (let t = w.start; t < w.end; t += STEP) {
            mc = Math.max(mc, busyIntervals.filter(([a, b]) => a <= t && t < b).length);
            pk = Math.max(pk, headAt(t));
        }
        if (runnerSetting === "0") w.R = 0;
        else if (runnerSetting !== "auto") w.R = +runnerSetting;
        else w.R = pk >= 14 ? Math.max(1, Math.min(2, mc)) : (pk >= 7 ? 1 : 0);
    });
    const windowAt = t => windows.find(x => x.start <= t && t < x.end) || null;
    // Runners are only pulled when a break/task actually needs covering, then stay runners for that stretch
    let curWindow = null, activeRunners = 0;
    const runnerSet = new Set();

    // Fill order at a given time: in the AM, a spot past its open-by time jumps ahead of everything
    // except the drive-thru trio and Register 1
    const openBy = {};
    if (isAM) Object.entries(OPEN_BY).forEach(([pos, v]) => { const m = toMin(v); if (POS_INFO[pos] && m !== null) openBy[pos] = m; });
    const orderAt = t => {
        const due = FILL_ORDER.filter(pos => openBy[pos] !== undefined && t >= openBy[pos]);
        if (!due.length) return FILL_ORDER;
        const top = FILL_ORDER.filter(pos => POS_INFO[pos].priority <= 2 && !due.includes(pos));
        const rest = FILL_ORDER.filter(pos => POS_INFO[pos].priority > 2 && !due.includes(pos));
        return [...top, ...due, ...rest];
    };
    const lateOpen = {};

    // Simulation
    const mode = st.mode || "balanced";
    const busy = {};
    people.forEach(p => { busy[p.name] = []; });
    breaks.forEach(b => busy[b.name].push({ start: b.start, end: b.end }));
    tasks.filter(k => k.forced).forEach(k => { if (busy[k.forced]) busy[k.forced].push({ start: k.start, end: k.end }); });
    const isBusy = (n, t) => busy[n].some(x => x.start <= t && t < x.end);
    const rating = (n, skill) => { const r = ratings && ratings[n] && ratings[n][skill]; return r ? r : 3; };
    const home = {}, homeOwner = {};
    const modeScore = (name, pos) => {
        const r = rating(name, POS_INFO[pos].skill);
        if (mode === "aces") return r;
        if (mode === "training") return 6 - r;
        return POS_INFO[pos].priority <= 6 ? r : 6 - r;
    };
    // People moved just for the length of a break/task cover: name -> the spot they're temporarily in
    const tempAt = {};
    const scoreFor = (p, pos) => {
        let s = modeScore(p.name, pos);
        if (home[p.name] === pos) s += 2;   // go back to your own spot
        if (p.floater) s -= 100;            // floaters only fill in when needed
        if (runnerSet.has(p.name)) s -= 50; // this stretch's break runner stays a runner
        return s;
    };

    // Outside rotation: each outside person trades with one inside partner on a fixed schedule
    const OUTSIDE = new Set(POSITIONS.filter(p => p.group === "Outside").map(p => p.name));
    const outStart = {}, pairOf = {};
    const rotationShort = new Set();
    let noTouch = new Set();   // training spots this step — never rotated, swapped or handed to a floater
    const rotateOutside = (assign, on, t) => {
        const posOf = {};
        Object.entries(assign).forEach(([pos, n]) => { posOf[n] = pos; });
        const isFloater = n => !!(on.find(x => x.name === n) || {}).floater;
        // Register 1 and the three drive-thru spots are never pulled into a rotation
        const canSwapIn = n => {
            const qpos = posOf[n];
            return !!qpos && !OUTSIDE.has(qpos) && POS_INFO[qpos].priority > 2 && homeOwner[qpos] === n && !isFloater(n) && !noTouch.has(qpos) && !sessionOf(n, t);
        };
        Object.keys(assign).filter(pos => OUTSIDE.has(pos) && !noTouch.has(pos)).forEach(opos => {
            const P = assign[opos];
            if (homeOwner[opos] && homeOwner[opos] !== P) return;     // just covering someone's break
            if (outStart[P] === undefined || t - outStart[P] < rotEvery) return;
            let Q = pairOf[P];
            const partnerStillHere = Q && pairOf[Q] === P && on.some(x => x.name === Q);
            if (partnerStillHere && !canSwapIn(Q)) return;            // partner is on break or covering: wait for them
            if (!partnerStillHere) {
                const partnerGone = q => !pairOf[q] || pairOf[q] === P || !on.some(x => x.name === pairOf[q]);
                const cands = Object.keys(posOf).filter(q => q !== P && canSwapIn(q) && partnerGone(q));
                if (!cands.length) { rotationShort.add(P); return; }
                const skill = POS_INFO[opos].skill;
                // Partner comes from the least important inside spots first
                const tier = n => POS_INFO[posOf[n]].priority <= 5 ? 1 : 0;
                cands.sort((a, b) => tier(a) - tier(b)
                    || FILL_ORDER.indexOf(posOf[b]) - FILL_ORDER.indexOf(posOf[a])
                    || rating(b, skill) - rating(a, skill)
                    || a.localeCompare(b));
                Q = cands[0];
            }
            const qpos = posOf[Q];
            assign[opos] = Q;
            assign[qpos] = P;
            posOf[Q] = opos;
            posOf[P] = qpos;
            pairOf[P] = Q;
            pairOf[Q] = P;
        });
    };

    const timeline = {};
    POSITIONS.forEach(p => { timeline[p.name] = []; });
    const idleLog = {};
    const shortSlots = [];
    let prev = {};
    if (seedPos) {
        const here = new Set(people.filter(p => onShift(p, W0)).map(p => p.name));
        const taken = new Set();
        Object.entries(seedPos).forEach(([pos, n]) => {
            if (!POS_INFO[pos] || !here.has(n) || taken.has(n)) return;
            prev[pos] = n; taken.add(n); home[n] = pos; homeOwner[pos] = n;
        });
    }
    // What gets drawn: a spot shows its owner straight through their break/task (covers are listed separately)
    const shownTimeline = {};
    POSITIONS.forEach(p => { shownTimeline[p.name] = []; });
    const runnerLog = {};
    const swapLog = [];
    let handover = null;

    for (const t of slots) {
        const on = people.filter(p => onShift(p, t));
        const prevPosOf = {};
        Object.entries(prev).forEach(([pos, n]) => { prevPosOf[n] = pos; });

        // Hand out tasks that start now: someone floating first, otherwise the next-to-lose spot
        tasks.filter(k => k.start === t).sort((a, b) => !!b.forced - !!a.forced).forEach(k => {
            if (k.offRoster) { k.name = k.forced; k.pos = null; return; }
            if (k.forced) {
                const who = on.find(p => p.name === k.forced);
                if (!who) { k.name = null; warnings.push(`${k.forced} isn't here for the ${k.label.toLowerCase()} at ${fmtClock(k.start)}.`); return; }
                k.name = who.name;
                k.pos = prevPosOf[who.name] || null;
                return;   // already in busy (added up front)
            }
            const cands = on.filter(p => p.end >= k.end && !busy[p.name].some(x => x.start < k.end && k.start < x.end)
                && !sessions.some(x => x.trainer === p.name && overlaps(k.start, k.end, x.start, x.end))
                && !ownBusy(p.name, k.start, k.end));
            if (!cands.length) {
                k.name = null;
                warnings.push(`No one is free for ${k.label} at ${fmtClock(k.start)}.`);
                return;
            }
            let who = k.lockedName ? cands.find(p => p.name === k.lockedName) : null;
            if (!who) {
                const recent = p => busy[p.name].some(x => x.end <= t && x.end > t - 60) ? 5000 : 0;
                const ord = orderAt(t);
                const order = p => recent(p) + (prevPosOf[p.name] ? 1000 - ord.indexOf(prevPosOf[p.name]) : (p.floater ? 0 : 1));
                cands.sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name));
                who = cands[0];
            }
            k.name = who.name;
            k.pos = prevPosOf[who.name] || null;
            busy[who.name].push({ start: k.start, end: k.end });
        });

        const free = on.filter(p => !isBusy(p.name, t));
        const freeNames = new Set(free.map(p => p.name));
        const assign = {};
        const used = new Set();

        if (t < lockUntil) {
            // Already happened: copy it exactly
            POSITIONS.forEach(p => {
                const n = lockAt(p.name, t);
                if (n && freeNames.has(n) && !used.has(n)) { assign[p.name] = n; used.add(n); }
            });
        } else {
            const w = windowAt(t);
            if (w !== curWindow) { curWindow = w; activeRunners = 0; runnerSet.clear(); }
            if (w) activeRunners = Math.min(w.R, Math.max(activeRunners, on.length - free.length));
            const floaterCount = on.filter(p => p.floater).length;
            const R = Math.max(activeRunners, floaterCount);
            const K = Math.max(0, Math.min(FILL_ORDER.length, on.length - R, free.length));
            const pinned = {}, forcedFront = [], needsLeader = {};
            sessions.filter(x => x.start <= t && t < x.end).forEach(x => {
                if (freeNames.has(x.trainer)) pinned[x.pos] = x.trainer;
                else {
                    forcedFront.push(x.pos);
                    const b = breaks.find(b => b.name === x.trainer && b.start <= t && t < b.end);
                    if (b && b.kind === "leader") needsLeader[x.pos] = b.leaderCover;
                }
            });
            noTouch = new Set([...Object.keys(pinned), ...forcedFront]);
            const S = [...forcedFront, ...orderAt(t).filter(pos => !pinned[pos] && !forcedFront.includes(pos))].slice(0, Math.max(0, K - Object.keys(pinned).length));
            const Sset = new Set([...S, ...Object.keys(pinned)]);
            Object.entries(pinned).forEach(([pos, n]) => { assign[pos] = n; used.add(n); });

            // 1) everyone stays put if their spot is still open
            Object.entries(prev).forEach(([pos, n]) => {
                if (Sset.has(pos) && freeNames.has(n) && !assign[pos] && !used.has(n)) { assign[pos] = n; used.add(n); }
            });
            // 2) people back from a break/task take their own spot back — and whoever moved over to cover
            //    for them goes back to their own spot too (repeat until nothing changes)
            for (let changed = true, guard = 0; changed && guard < 20; guard++) {
                changed = false;
                free.forEach(p => {
                    const h = home[p.name];
                    if (!h || !Sset.has(h) || homeOwner[h] !== p.name || assign[h] === p.name || pinned[h]) return;
                    const returning = isBusy(p.name, t - STEP) || (tempAt[p.name] && !used.has(p.name));
                    if (!returning || used.has(p.name)) return;
                    if (assign[h]) used.delete(assign[h]);
                    assign[h] = p.name;
                    used.add(p.name);
                    delete tempAt[p.name];
                    changed = true;
                });
            }
            // 3) fill open spots in priority order
            let pool = free.filter(p => !used.has(p.name));
            for (const pos of S) {
                if (assign[pos]) continue;
                if (needsLeader[pos] !== undefined) {
                    // a leader has to break this trainer: take one who's free, or move one over from their spot
                    const wanted = needsLeader[pos];
                    const L = pool.find(p => p.name === wanted) || pool.find(p => leaders.has(p.name) && !sessionOf(p.name, t));
                    if (L) { pool = pool.filter(x => x !== L); assign[pos] = L.name; used.add(L.name); tempAt[L.name] = pos; continue; }
                    const held = Object.entries(assign).filter(([y, n]) => leaders.has(n) && !noTouch.has(y) && !sessionOf(n, t))
                        .sort((a, b) => (b[1] === wanted) - (a[1] === wanted) || POS_INFO[b[0]].priority - POS_INFO[a[0]].priority)[0];
                    if (held) { const [y, n] = held; delete assign[y]; assign[pos] = n; tempAt[n] = pos; continue; }
                }
                if (!pool.length) continue;
                pool.sort((a, b) => scoreFor(b, pos) - scoreFor(a, pos) || a.name.localeCompare(b.name));
                const pick = pool.shift();
                assign[pos] = pick.name;
                used.add(pick.name);
            }
            // 4) a floater stuck in a spot hands it to someone free who isn't a floater
            Object.entries(assign).forEach(([pos, n]) => {
                const person = on.find(p => p.name === n);
                if (!person || !person.floater || noTouch.has(pos)) return;
                const i = pool.findIndex(p => !p.floater);
                if (i < 0) return;
                const rep = pool.splice(i, 1)[0];
                pool.push(person);
                assign[pos] = rep.name;
            });
            // 5) hot/cold weather rotation for the outside spots
            if (rotEvery > 0) rotateOutside(assign, on, t);
            // 6) a break/task just started: if someone in another spot is clearly better for the open spot
            //    (by Aces/Balanced/Training), they move over to cover and the original cover takes their spot
            // (only for covers of 30+ minutes — not worth moving two people for the 15-minute ice bin)
            const startingNow = [...breaks.filter(b => b.start === t).map(b => b.name), ...tasks.filter(k => k.start === t && k.name && k.end - k.start >= 30).map(k => k.name)];
            startingNow.forEach(owner => {
                const X = prevPosOf[owner];
                if (!X || noTouch.has(X)) return;
                const C = X && assign[X];
                if (!C || C === owner) return;
                // Only for someone actually rated for that spot (blank ratings never move anyone):
                // Aces/Balanced-top-spot → rated 4-5 there; Training → rated 1-2 there.
                // They must be at least 2 points better for the spot than the normal cover, and the
                // swap has to come out at least 2 points ahead once their own spot is counted too.
                const skillX = POS_INFO[X].skill;
                const wantsStrong = modeScore(owner, X) === rating(owner, skillX) || mode === "aces";
                let best = null, bestGain = 1;
                Object.entries(assign).forEach(([Y, Q]) => {
                    if (Y === X || Q === C || OUTSIDE.has(Y) || tempAt[Q] || homeOwner[Y] !== Q || noTouch.has(Y) || sessionOf(Q, t)) return;
                    if (POS_INFO[Y].priority < POS_INFO[X].priority) return;   // never weaken a more important spot
                    const qp = on.find(x => x.name === Q);
                    if (!qp || qp.floater) return;
                    const qr = ratings && ratings[Q] && ratings[Q][skillX];
                    if (!qr || (wantsStrong ? qr < 4 : qr > 2)) return;
                    if (modeScore(Q, X) - modeScore(C, X) < 2) return;
                    const gain = (modeScore(Q, X) + modeScore(C, Y)) - (modeScore(C, X) + modeScore(Q, Y));
                    if (gain > bestGain) { bestGain = gain; best = Y; }
                });
                if (!best) return;
                const Q = assign[best];
                assign[X] = Q; assign[best] = C;
                tempAt[Q] = X; tempAt[C] = best;
                swapLog.push({ owner, t, pos: X, cover: Q, backfillPos: best, backfill: C });
            });
            // whoever is left over while runners are active is this stretch's runner
            if (activeRunners > 0) {
                const placedNow = new Set(Object.values(assign));
                free.filter(p => !p.floater && !placedNow.has(p.name)).slice(0, activeRunners).forEach(p => {
                    runnerSet.add(p.name);
                    // a runner's old spot is closed while they run breaks, so it's no longer "theirs"
                    const h = home[p.name];
                    if (h && homeOwner[h] === p.name) delete homeOwner[h];
                    delete home[p.name];
                });
            }
        }

        const placed = new Set(Object.values(assign));
        const idle = free.filter(p => !placed.has(p.name));

        // Home spots (a cover doesn't take over someone's home while they're away)
        Object.keys(tempAt).forEach(n => { if (assign[tempAt[n]] !== n) delete tempAt[n]; });
        Object.entries(assign).forEach(([pos, n]) => {
            if (tempAt[n] === pos) return;
            const owner = homeOwner[pos];
            const ownerAway = owner && owner !== n && on.some(p => p.name === owner) && (isBusy(owner, t) || tempAt[owner]);
            if (ownerAway) return;
            if (owner && owner !== n && home[owner] === pos) delete home[owner];
            if (home[n] && home[n] !== pos && homeOwner[home[n]] === n) delete homeOwner[home[n]];
            home[n] = pos;
            homeOwner[pos] = n;
        });

        // How long each person has been outside
        const outsideNow = new Set(Object.entries(assign).filter(([pos]) => OUTSIDE.has(pos)).map(([, n]) => n));
        outsideNow.forEach(n => { if (outStart[n] === undefined) outStart[n] = t; });
        Object.keys(outStart).forEach(n => { if (!outsideNow.has(n)) delete outStart[n]; });

        // Who covered whom
        const swapFor = n => swapLog.find(x => x.owner === n && x.t === t) || null;
        // A break/task only "leaves a spot" if it's that person's own spot (not one they were just covering)
        const ownSpot = n => { const pos = prevPosOf[n]; return pos && homeOwner[pos] === n ? pos : null; };
        breaks.filter(b => b.start === t).forEach(b => {
            b.pos = ownSpot(b.name); b.cover = b.pos ? (assign[b.pos] || null) : null;
            const sw = swapFor(b.name); if (sw) { b.backfillPos = sw.backfillPos; b.backfill = sw.backfill; }
        });
        tasks.filter(k => k.start === t && k.name).forEach(k => {
            k.pos = ownSpot(k.name); k.cover = k.pos ? (assign[k.pos] || null) : null;
            const sw = swapFor(k.name); if (sw) { k.backfillPos = sw.backfillPos; k.backfill = sw.backfill; }
        });

        POSITIONS.forEach(p => timeline[p.name].push(assign[p.name] || null));
        idle.forEach(p => { (idleLog[p.name] = idleLog[p.name] || []).push(t); });

        // Covers: someone holding a spot whose owner is on break/task (or is covering elsewhere for a moment)
        const coverOf = {};
        Object.entries(assign).forEach(([pos, n]) => { if (homeOwner[pos] && homeOwner[pos] !== n) coverOf[n] = pos; });
        POSITIONS.forEach(p => {
            const owner = homeOwner[p.name];
            let shown = assign[p.name] || null;
            if (owner && on.some(x => x.name === owner) && (isBusy(owner, t) || coverOf[owner])) shown = owner;
            shownTimeline[p.name].push(shown);
        });
        // Break runners: free people who are floating or covering someone else's spot
        free.forEach(p => { if (!placed.has(p.name) || coverOf[p.name]) (runnerLog[p.name] = runnerLog[p.name] || []).push(t); });
        if (isAM && t === SPLIT) handover = { ...assign };
        if (on.length && FILL_ORDER.slice(0, 3).some(pos => !assign[pos])) shortSlots.push(t);
        // Open-by spots that are due but empty (ignoring a quick break cover gap)
        Object.keys(openBy).forEach(pos => {
            if (t >= openBy[pos] && !assign[pos] && !(homeOwner[pos] && on.some(x => x.name === homeOwner[pos]) && isBusy(homeOwner[pos], t))) {
                if (!lateOpen[pos]) lateOpen[pos] = [];
                lateOpen[pos].push(t);
            }
        });
        prev = assign;
    }

    // Collapse slot timelines into segments
    const toSegs = line => {
        const segs = [];
        line.forEach((n, i) => {
            if (!n) return;
            const t = slots[i];
            const last = segs[segs.length - 1];
            if (last && last.name === n && last.to === t) last.to = t + STEP;
            else segs.push({ name: n, from: t, to: t + STEP });
        });
        return segs;
    };
    const positions = {}, actual = {};
    POSITIONS.forEach(p => { positions[p.name] = toSegs(shownTimeline[p.name]); actual[p.name] = toSegs(timeline[p.name]); });
    const floaters = {};
    Object.entries(runnerLog).forEach(([n, ts]) => {
        const segs = [];
        ts.forEach(t => {
            const last = segs[segs.length - 1];
            if (last && last.to === t) last.to = t + STEP; else segs.push({ from: t, to: t + STEP });
        });
        floaters[n] = segs;
    });

    // Short-staffed ranges for the top spots
    const shortRanges = [];
    shortSlots.forEach(t => {
        const last = shortRanges[shortRanges.length - 1];
        if (last && last[1] === t) last[1] = t + STEP; else shortRanges.push([t, t + STEP]);
    });
    Object.entries(lateOpen).forEach(([pos, ts]) => {
        const firstOpen = (timeline[pos] || []).findIndex((n, i) => n && slots[i] >= openBy[pos]);
        warnings.push(`Not enough people to have ${pos} out by ${fmtClock(openBy[pos])}` +
            (firstOpen < 0 ? ` — there's no one left to put there.`
                : ts.includes(openBy[pos]) ? ` — it opens at ${fmtClock(slots[firstOpen])}.` : ` (it's empty at times after that).`));
    });
    if (rotationShort.size) warnings.push(`Not enough inside people to rotate ${[...rotationShort].join(", ")} on schedule, so they stay outside longer.`);
    shortRanges.forEach(([a, b]) => warnings.push(`Not enough people for DT Bagger 1, DT Drinks and Window 1 from ${fmtClock(a)} to ${fmtClock(b)}.`));

    return {
        date: st.date, daypart: st.daypart, mode, rotation: rotEvery,
        window: [W0, W1],
        lockedUntil: lock ? lock.until : null,
        actual, handover, deferBreaks,
        calledOff,
        people: people.map(p => ({ name: p.name, start: p.start, end: p.end, shiftStart: p.shiftStart, shiftEnd: p.shiftEnd, floater: p.floater })),
        positions, floaters,
        breaks: breaks.map(b => ({ name: b.name, start: b.start, end: b.end, ideal: b.ideal, override: b.override, pos: b.pos, cover: b.cover, backfillPos: b.backfillPos || null, backfill: b.backfill || null,
            kind: b.kind || null, trainee: b.trainee || null, trainingPos: b.trainingPos || null, leaderCover: b.leaderCover || null, mergeWith: b.mergeWith || null }))
            .concat(traineeBreaks.map(b => ({ ...b }))),
        sessions: sessions.map(x => ({ trainee: x.trainee, trainer: x.trainer, pos: x.pos, start: x.start, end: x.end, fullStart: x.fullStart, fullEnd: x.fullEnd })),
        tasks: tasks.map(k => ({ type: k.type, label: k.label, key: k.key, pinned: !!k.pinned, start: k.start, end: k.end, deadline: k.deadline || null, leaves: k.leaves || null, back: k.back || null, food: k.food ?? null, merged: !!k.merged, offRoster: !!k.offRoster, mins: k.mins || null, name: k.name || null, pos: k.pos || null, cover: k.cover || null, backfillPos: k.backfillPos || null, backfill: k.backfill || null })),
        warnings,
        generatedAt: Date.now()
    };
}

let view = "roster";

let result = null;
let dirty = true;

function loadDefaults(dp) {
    try { const s = JSON.parse(localStorage.getItem("lineupDefaults:" + dp)); if (s) return { ...DAYPART_DEFAULTS[dp], ...s }; } catch (e) {}
    return { ...DAYPART_DEFAULTS[dp] };
}

function newState(dp) {
    const d = loadDefaults(dp);
    return {
        v: 1, date: todayIso(), daypart: dp, mode: d.mode || "balanced", runners: d.runners || "auto",
        roster: [], defaultShift: { start: d.start, end: d.end },
        lemonade: dp === "AM" ? [DAYPART_SPLIT] : [], sweep: { on: true }, ice: { on: !!d.iceOn },
        caterings: [], trainings: [],
        breakOverrides: {}, taskOverrides: {}, rotation: 0, lock: null, savedId: null
    };
}

function draftKey(dp) { return `lineupDraft:${todayIso()}:${dp}`; }

function loadDraft(dp) {
    try {
        const raw = localStorage.getItem(draftKey(dp));
        if (raw) {
            const o = JSON.parse(raw);
            if (o && o.state) { state = o.state; result = o.result || null; dirty = !result; return true; }
        }
    } catch (e) {}
    state = newState(dp); result = null; dirty = true;
    return false;
}

function saveDraftNow() {
    if (!state) return;
    try {
        localStorage.setItem(draftKey(state.daypart), JSON.stringify({ state, result }));
        localStorage.setItem("lineupDefaults:" + state.daypart, JSON.stringify({
            start: state.defaultShift.start, end: state.defaultShift.end,
            iceOn: state.ice.on, mode: state.mode, runners: state.runners
        }));
    } catch (e) {}
}
let saveDraftTimer = null;
function saveDraft() { clearTimeout(saveDraftTimer); saveDraftTimer = setTimeout(saveDraftNow, 250); }

function cleanOldDrafts() {
    try {
        const cutoff = isoDate(new Date(Date.now() - 8 * 86400000));
        Object.keys(localStorage).forEach(k => {
            const m = k.match(/^lineupDraft:(\d{4}-\d{2}-\d{2}):/);
            if (m && m[1] < cutoff) localStorage.removeItem(k);
        });
    } catch (e) {}
}

let liveTimer = null;
function markChanged() {
    dirty = true;
    saveDraft();
    renderRosterMeta();
    updateHero();
    if (isWide()) {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(() => {
            if (state.roster.length && !rosterProblems()) generate();
            renderLineup();
            updateHero();
        }, 450);
    }
}

// =====================================================================
// GOOGLE SHEETS / FORMS
// =====================================================================
async function gvizRows(sheetId, queryText, timeoutMs = 10000, extra = "") {
    if (isPlaceholder(sheetId)) return null;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(queryText)}${extra}&_cb=${Date.now()}`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return null;
        const text = await res.text();
        const prefix = "setResponse(";
        const startIndex = text.indexOf(prefix);
        if (startIndex === -1) return null;
        const data = JSON.parse(text.substring(startIndex + prefix.length, text.lastIndexOf(")")));
        if (!data.table) return null;
        return data.table.rows || [];
    } catch (e) {
        clearTimeout(timeoutId);
        return null;
    }
}

function cellText(cell) {
    if (!cell) return "";
    const raw = (cell.f !== undefined && cell.f !== null) ? cell.f : cell.v;
    if (raw === undefined || raw === null) return "";
    return String(raw).trim();
}
function cellRaw(cell) {
    if (!cell || cell.v === undefined || cell.v === null) return "";
    return String(cell.v).trim();
}

function submitToGoogleForm(formId, formDataObj) {
    const formUrl = `https://docs.google.com/forms/d/e/${formId}/formResponse`;
    return new Promise(resolve => {
        const iframeName = "hidden_iframe_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const iframe = document.createElement("iframe");
        iframe.name = iframeName;
        iframe.style.display = "none";
        document.body.appendChild(iframe);
        const form = document.createElement("form");
        form.action = formUrl;
        form.method = "POST";
        form.target = iframeName;
        form.style.display = "none";
        Object.entries(formDataObj).forEach(([key, value]) => {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = key;
            input.value = value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        let done = false;
        const finish = () => {
            if (done) return;
            done = true;
            setTimeout(() => { form.remove(); iframe.remove(); resolve(true); }, 400);
        };
        iframe.addEventListener("load", finish);
        setTimeout(finish, 15000);
        form.submit();
    });
}

function normalizeSkillHeader(text) {
    const key = String(text || "").toLowerCase().replace(/[^a-z]/g, "");
    if (!key) return null;
    return SKILL_ALIASES[key] || SKILLS.find(s => s.toLowerCase().replace(/[^a-z]/g, "") === key) || null;
}

// Column ids of a sheet, without any row data
async function gvizCols(sheetId, timeoutMs = 10000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=0&tq=${encodeURIComponent("SELECT * LIMIT 0")}&_cb=${Date.now()}`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return null;
        const text = await res.text();
        const start = text.indexOf("setResponse(");
        if (start === -1) return null;
        const data = JSON.parse(text.substring(start + 12, text.lastIndexOf(")")));
        return data.table && data.table.cols ? data.table.cols.map(c => c.id) : null;
    } catch (e) {
        clearTimeout(timeoutId);
        return null;
    }
}

// Staff sheet columns: A Name, B PIN (never downloaded here), C Role, D House, E+ ratings
async function loadStaff() {
    const ids = await gvizCols(STAFF_SHEET_ID);
    if (!ids || !ids.length) return false;
    const keep = ids.filter(id => id !== "B");
    const rows = await gvizRows(STAFF_SHEET_ID, "SELECT " + keep.join(", "), 12000, "&headers=0");
    if (!rows || !rows.length) return false;
    const at = id => keep.indexOf(id);          // position of a sheet column in each row
    const ratingCols = keep.filter(id => id.length > 1 || id >= "E");

    let start = 0;
    let colSkill = {};
    const first = rows[0].c || [];
    if (/^name/i.test(cellText(first[at("A")]))) {
        start = 1;
        ratingCols.forEach(id => { const sk = normalizeSkillHeader(cellText(first[at(id)])); if (sk) colSkill[at(id)] = sk; });
    }
    if (!Object.keys(colSkill).length) {
        SKILLS.forEach((sk, i) => { if (ratingCols[i]) colSkill[at(ratingCols[i])] = sk; });
        ratingSource = "Columns E–M (no rating headers found)";
    } else {
        ratingSource = "Header row: " + Object.values(colSkill).join(", ");
    }

    const staff = {}, ratings = {};
    for (let r = start; r < rows.length; r++) {
        const c = rows[r].c || [];
        const name = cellRaw(c[at("A")]);
        if (!name) continue;
        const role = (cellRaw(c[at("C")]) || "member").toLowerCase();
        const house = (cellRaw(c[at("D")]) || "foh").toLowerCase();
        staff[name] = { role, house };
        const rr = {};
        Object.entries(colSkill).forEach(([i, sk]) => {
            const v = parseFloat(cellRaw(c[i]));
            if (!isNaN(v) && v >= 1 && v <= 5) rr[sk] = Math.round(v);
        });
        ratings[name] = rr;
    }
    if (!Object.keys(staff).length) return false;
    STAFF = staff;
    RATINGS = ratings;
    return true;
}

function lineupFormReady() {
    return ["formId", "sheetId", "daypartEntry", "dateEntry", "dataEntry", "byEntry"]
        .every(k => !isPlaceholder(String(LINEUP_FORM[k]).replace("entry.", "")));
}

// Newest first. Each saved row's Lineup Data cell is JSON {id, state, result}.
async function fetchSavedLineups() {
    const rows = await gvizRows(LINEUP_FORM.sheetId, "SELECT A, B, C, D, E ORDER BY A DESC LIMIT 80", 15000);
    if (rows === null) return null;
    const list = [];
    rows.forEach(row => {
        const c = row.c || [];
        const raw = cellRaw(c[3]);
        if (!raw || raw.charAt(0) !== "{") return;
        try {
            const o = JSON.parse(raw);
            if (o && o.state) list.push({ id: o.id, state: o.state, result: o.result || null, by: cellText(c[4]), at: cellText(c[0]) });
        } catch (e) {}
    });
    return list;
}

async function findSaved(dp, dateIso) {
    const list = await fetchSavedLineups();
    if (!list) return undefined;
    return list.find(x => x.state.daypart === dp && x.state.date === dateIso) || null;
}

const wideMQ = window.matchMedia ? window.matchMedia("(min-width: 1200px)") : { matches: false };

function applyPanelVisibility() {
    const w = isWide();
    document.body.classList.toggle("wide", w);

    document.getElementById("lineupPanel").style.display = (w || view === "lineup") ? "block" : "none";

}

function modeButtons() {
    return Object.keys(MODES).map(m => `<button type="button" class="${state.mode === m ? "on" : ""}" onclick="setMode('${m}')">${MODES[m].label}</button>`).join("");
}

function shiftMetaHtml(r) {
    if (r.calledOff) return '<span class="off-tag">Called off</span>';
    if (!r.start || !r.end) return "Needs a time";
    const len = shiftMinutes(r);
    return durLabel(len) + (len > BREAK_MIN_SHIFT ? ' · <span class="brk">break</span>' : "");
}

// The Who / Trainer dropdowns follow the roster and the staff list as they change
function refreshPickers() {
    if (!state) return;
    const fill = (id, html) => {
        const el = document.getElementById(id);
        if (!el || document.activeElement === el) return;
        const v = el.value;
        el.innerHTML = html;
        if ([...el.options].some(o => o.value === v)) el.value = v;
    };
    fill("catName", rosterOptions("Who", null, true));
    fill("trTrainer", leaderOptions("Trainer"));
    const rows = document.getElementById("trainingList");
    if (rows && !rows.contains(document.activeElement)) renderTrainingList();
}

function renderRosterList() {
    setTimeout(refreshPickers, 0);
    const box = document.getElementById("rosterList");
    if (!box) return;
    if (!state.roster.length) {
        box.innerHTML = `<div class="empty-note">${ICON.users}<b>No one added yet</b><span>Search above to build the ${state.daypart} roster.</span></div>`;
        return;
    }
    box.innerHTML = state.roster.map((r, i) => {
        const bad = !r.start || !r.end;
        return `
            <div class="person ${bad ? "bad" : ""} ${r.calledOff ? "off" : ""}" id="rrow-${i}">
                <span class="hc-chip"><span class="chip-avatar">${esc(initials(r.name))}</span><span class="chip-name">${esc(r.name)}</span><span class="hc-chip-x" title="Remove" onclick="removePerson(${i})">${ICON.x}</span></span>
                <span class="shift-meta" id="rmeta-${i}">${shiftMetaHtml(r)}</span>
                ${r.calledOff
                    ? `<button type="button" class="mini-toggle" onclick="undoCallOff(${i})">Undo</button>`
                    : `<button type="button" class="mini-toggle ${r.floater ? "on" : ""}" title="Keeps them out of position to run breaks and tasks" onclick="toggleFloater(${i})">Floater</button>`}
                <div class="shift-times">
                    <input type="time" class="time-input" step="900" value="${r.start || ""}" onchange="setShift(${i}, 'start', this.value)">
                    <span>to</span>
                    <input type="time" class="time-input" step="900" value="${r.end || ""}" onchange="setShift(${i}, 'end', this.value)">
                </div>
            </div>`;
    }).join("");
}

function renderRosterMeta() {
    const el = document.getElementById("rosterCount");
    if (!el || !state) return;
    const n = state.roster.length;
    el.innerText = `${n} ${n === 1 ? "person" : "people"}`;
}

function setShift(i, key, val) {
    const r = state.roster[i];
    if (!r) return;
    r[key] = val;
    const meta = document.getElementById(`rmeta-${i}`);
    const row = document.getElementById(`rrow-${i}`);
    if (meta) meta.innerHTML = shiftMetaHtml(r);
    if (row) row.classList.toggle("bad", !r.start || !r.end);
    markChanged();
}

function undoCallOff(i) {
    if (!state.roster[i]) return;
    state.roster[i].calledOff = false;
    markChanged();
    renderRosterList();
}

function toggleFloater(i) {
    state.roster[i].floater = !state.roster[i].floater;
    markChanged();
    renderRosterList();
}

function removePerson(i) {
    const r = state.roster.splice(i, 1)[0];
    if (r && state.breakOverrides) delete state.breakOverrides[r.name];
    markChanged();
    renderRosterList();
}

function sortRoster() {
    state.roster.sort((a, b) => (toMin(a.start) ?? 9999) - (toMin(b.start) ?? 9999) || a.name.localeCompare(b.name));
    markChanged();
    renderRosterList();
}

function clearRoster() {
    if (!state.roster.length) return;
    if (!confirm("Remove everyone from this roster?")) return;
    state.roster = [];
    state.breakOverrides = {};
    markChanged();
    renderRosterList();
}

function addPerson(name) {
    name = String(name || "").trim();
    if (!name) return;
    if (state.roster.some(r => r.name.toLowerCase() === name.toLowerCase())) {
        showStatusMessage(`${name} is already on the roster.`, "warning");
        return;
    }
    const known = staffNameList().find(n => n.toLowerCase() === name.toLowerCase());
    state.roster.push({ name: known || name, start: state.defaultShift.start, end: state.defaultShift.end, floater: false });
    const input = document.getElementById("nameInput");
    if (input) { input.value = ""; input.focus(); }
    hideNameOptions();
    markChanged();
    renderRosterList();
    const list = document.getElementById("rosterList");
    if (list) list.scrollTop = list.scrollHeight;
    if (input) input.scrollIntoView({ block: "nearest" });
}

// --- Name autocomplete (same pattern as the checklist's assign screen) ---
let nameHighlight = 0;
function nameMatches() {
    const input = document.getElementById("nameInput");
    const q = input ? input.value.trim().toLowerCase() : "";
    const taken = new Set(state.roster.map(r => r.name.toLowerCase()));
    const rank = n => {
        const l = n.toLowerCase();
        if (l.startsWith(q)) return 0;                                   // "Sha" -> Shamya
        if (l.split(/\s+/).some(w => w.startsWith(q))) return 1;         // last name / second word
        return 2;                                                        // anywhere in the name
    };
    return staffNameList()
        .filter(n => !taken.has(n.toLowerCase()) && (!q || n.toLowerCase().includes(q)))
        .sort((a, b) => (q ? rank(a) - rank(b) : 0) || a.localeCompare(b));
}

function nameFilter() {
    const input = document.getElementById("nameInput");
    const box = document.getElementById("nameOptions");
    if (!input || !box) return;
    const q = input.value.trim();
    const matches = nameMatches();
    nameHighlight = 0;
    const rows = matches.slice(0, 50).map((n, i) => {
        const ratings = RATINGS[n] || {};
        const top = Object.entries(ratings).filter(([, v]) => v >= 4).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => k).join(", ");
        return `<div class="suggest-item ${i === 0 ? "highlighted" : ""}" data-n="${esc(n)}" onmousedown="event.preventDefault(); addPerson(this.dataset.n)">${esc(n)}${top ? `<small>${esc(top)}</small>` : ""}</div>`;
    });
    if (q && !matches.some(n => n.toLowerCase() === q.toLowerCase()) && !state.roster.some(r => r.name.toLowerCase() === q.toLowerCase())) {
        rows.push(`<div class="suggest-item ${rows.length === 0 ? "highlighted" : ""}" data-n="${esc(q)}" onmousedown="event.preventDefault(); addPerson(this.dataset.n)">Add "${esc(q)}"<small>not on staff list</small></div>`);
    }
    if (!rows.length) { box.style.display = "none"; box.innerHTML = ""; return; }
    const rect = input.getBoundingClientRect();
    box.style.left = rect.left + "px";
    box.style.width = rect.width + "px";
    box.innerHTML = rows.join("");
    box.style.display = "block";
    // open upward when there isn't room below
    const h = box.offsetHeight;
    const roomBelow = window.innerHeight - rect.bottom;
    box.style.top = (roomBelow < h + 8 && rect.top > roomBelow ? rect.top - h - 4 : rect.bottom + 4) + "px";
}

function hideNameOptions() {
    const box = document.getElementById("nameOptions");
    if (box) box.style.display = "none";
}

function nameKey(ev) {
    const box = document.getElementById("nameOptions");
    const items = box ? Array.from(box.querySelectorAll(".suggest-item")) : [];
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        if (!items.length) return;
        ev.preventDefault();
        nameHighlight = (nameHighlight + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("highlighted", i === nameHighlight));
        items[nameHighlight].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
        ev.preventDefault();
        if (items[nameHighlight]) addPerson(items[nameHighlight].dataset.n);
    } else if (ev.key === "Escape") {
        hideNameOptions();
    }
}

document.addEventListener("scroll", e => { if (e.target !== document.getElementById("nameOptions")) hideNameOptions(); }, true);

// --- Tasks ---
// --- Catering & training rows ---
function rosterOptions(placeholder, selected, withOther) {
    const names = state.roster.filter(r => !r.calledOff).map(r => r.name);
    if (selected && !names.includes(selected)) names.push(selected);
    return `<option value="">${esc(placeholder)}</option>` + names.map(n => `<option ${n === selected ? "selected" : ""}>${esc(n)}</option>`).join("")
        + (withOther ? `<option value="__other__">Someone not on the roster…</option>` : "");
}
function durationOptions(sel, allowNone) {
    return (allowNone ? [0] : []).concat([15, 30, 45, 60, 90, 120]).map(m => `<option value="${m}" ${m === +sel ? "selected" : ""}>${m === 0 ? "No prep" : m < 60 ? m + " min" : (m / 60) + " hr"}</option>`).join("");
}
let catType = "pickup";
let catSplit = false;
function keepCatForm(fn) {
    const keep = { name: document.getElementById("catName").value, other: document.getElementById("catOther").value, due: document.getElementById("catDue").value };
    fn();
    renderRoster();
    document.getElementById("catName").value = keep.name;
    document.getElementById("catOther").value = keep.other;
    document.getElementById("catOther").style.display = keep.name === "__other__" ? "" : "none";
    document.getElementById("catDue").value = keep.due;
}
function setCatSplit(v) { keepCatForm(() => { catSplit = v; }); }
// Problems show right under the Add button (and as a pop-up)
function formError(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg || ""; el.style.display = msg ? "" : "none"; }
    if (msg) showStatusMessage(msg, "warning");
}
function setCatType(t) { keepCatForm(() => { catType = t; }); }
function positionOptions(placeholder, selected) {
    return `<option value="">${esc(placeholder)}</option>` + POSITIONS.map(p => `<option ${p.name === selected ? "selected" : ""}>${esc(p.name)}</option>`).join("");
}
// Trainers: leaders from the staff list (the ones working this shift first)
function leaderOptions(placeholder, selected) {
    const all = leaderNames();
    const onRoster = new Set(state.roster.filter(r => !r.calledOff).map(r => r.name));
    if (selected && !all.includes(selected)) all.push(selected);
    all.sort((a, b) => (onRoster.has(b) - onRoster.has(a)) || a.localeCompare(b));
    if (!all.length) return `<option value="">${staffReady ? "No leaders found in the staff list" : "Loading leaders…"}</option>`;
    return `<option value="">${esc(placeholder)}</option>` + all.map(n => `<option value="${esc(n)}" ${n === selected ? "selected" : ""}>${esc(n)}${onRoster.has(n) ? "" : " (not on roster)"}</option>`).join("");
}

function renderCateringList() {
    const box = document.getElementById("cateringList");
    if (!box) return;
    box.innerHTML = state.caterings.map((c, i) => {
        const delivery = c.type === "delivery";
        const due = toMin(c.due);
        const prep = c.split ? (+c.food || 0) : delivery ? (+c.mins || 0) : (+c.mins || 30);
        const span = due === null ? "" : delivery
            ? `Out ${fmtClock(due - prep)} – back ~${fmtClock(due + (+c.gone || 40))}`
            : `Out ${fmtClock(due - prep)} – ${fmtClock(due)}`;
        return `
        <div class="item-row cat-row">
            <span class="hc-chip"><span class="chip-avatar">${esc(initials(c.name))}</span><span class="chip-name">${esc(c.name)}</span><span class="hc-chip-x" title="Remove" onclick="state.caterings.splice(${i},1); markChanged(); renderCateringList()">${ICON.x}</span></span>
            <span class="type-tag ${delivery ? "deliv" : ""}">${delivery ? "Delivery" : "Pickup"}</span>
            ${c.offRoster ? `<span class="type-tag extra" title="Comes in just for this — not counted as a body">Catering only</span>` : ""}
            <span class="mini-label">${delivery ? "leaves" : "due"}</span>
            <input type="time" class="time-input" step="900" value="${c.due}" onchange="state.caterings[${i}].due=this.value; markChanged(); renderCateringList()">
            ${c.split
                ? `<span class="mini-label">supplies</span><input type="number" class="time-input num" min="5" step="5" value="${+c.supplies || 20}" onchange="state.caterings[${i}].supplies=Math.max(5, +this.value || 20); markChanged(); renderCateringList()"><span class="mini-label">min, food</span><input type="number" class="time-input num" min="0" step="5" value="${+c.food || 0}" onchange="state.caterings[${i}].food=Math.max(0, +this.value || 0); markChanged(); renderCateringList()"><span class="mini-label">min</span>`
                : `<span class="mini-label">prep</span>
            <select class="time-input sel" onchange="state.caterings[${i}].mins=+this.value; markChanged(); renderCateringList()">${durationOptions(prep, delivery)}</select>`}
            <button type="button" class="mini-toggle ${c.split ? "on" : ""}" title="Supplies earlier, food right before" onclick="toggleCatSplit(${i})">Split</button>
            ${delivery ? `<span class="mini-label">gone</span><input type="number" class="time-input num" min="5" step="5" value="${+c.gone || 40}" onchange="state.caterings[${i}].gone=Math.max(5, +this.value || 40); markChanged(); renderCateringList()"><span class="mini-label">min</span>` : ""}
            <span class="times-inline">${span}${c.split ? ` · supplies earlier` : ""}</span>
        </div>`;
    }).join("");
}

function toggleCatSplit(i) {
    const c = state.caterings[i];
    if (!c) return;
    if (c.split) { c.split = false; c.mins = (+c.supplies || 0) + (+c.food || 0) || 30; }
    else { const total = +c.mins || 30; c.split = true; c.food = Math.min(10, total); c.supplies = Math.max(5, total - c.food); }
    markChanged();
    renderCateringList();
}

function addCatering() {
    let name = document.getElementById("catName").value;
    let offRoster = false;
    if (name === "__other__") {
        name = document.getElementById("catOther").value.trim();
        if (!name) { formError("catErr", "Type the name of the person coming in for it."); return; }
        const onRoster = state.roster.find(r => r.name.toLowerCase() === name.toLowerCase() && !r.calledOff);
        if (onRoster) name = onRoster.name; else offRoster = true;
    }
    const due = document.getElementById("catDue").value;
    const minsEl = document.getElementById("catMins");
    const mins = minsEl ? +minsEl.value : 0;
    const split = catSplit ? { split: true, supplies: Math.max(5, +document.getElementById("catSupplies").value || 20), food: Math.max(0, +document.getElementById("catFood").value || 0) } : {};
    const goneEl = document.getElementById("catGone");
    const gone = goneEl ? Math.max(5, +goneEl.value || 40) : 0;
    if (!name) { formError("catErr", state.roster.length ? `Pick who's ${catType === "delivery" ? "taking the delivery" : "making the catering"}.` : "Add people to the roster first, or pick \"Someone not on the roster\"."); return; }
    if (!due) { formError("catErr", catType === "delivery" ? "Add the time they leave." : "Add the time the catering is due."); return; }
    formError("catErr", "");
    state.caterings.push(Object.assign(catType === "delivery" ? { type: "delivery", name, due, mins, gone } : { type: "pickup", name, due, mins: mins || 30 }, split, offRoster ? { offRoster: true } : {}));

    renderCateringList();

    document.getElementById("catOther").value = "";

}

function renderTrainingList() {

function addTraining() {
    const trainee = document.getElementById("trTrainee").value.trim();
    const pos = document.getElementById("trPos").value;
    const trainer = document.getElementById("trTrainer").value;
    const start = document.getElementById("trStart").value, end = document.getElementById("trEnd").value;

    if (state.roster.some(r => r.name.toLowerCase() === trainee.toLowerCase())) showStatusMessage(`${trainee} is on the roster — trainees aren't counted as a body, so they'll be left out of spots.`, "warning", 6000);

function renderLemonList() {

function addLemonade() {

function renderSweepTimes() {
    const fill = (id, type) => {

        if (!list) { el.innerText = "Planned when the lineup is generated."; return; }
        el.innerText = list.length ? "Planned: " + list.map(k => fmtClock(k.start)).join(", ") : "Not needed — this shift is under 4 hours.";
    };
    fill("sweepTimes", "sweep");
    fill("iceTimes", "ice");

function setMode(m) {
    state.mode = m;
    markChanged();
    if (state.roster.length && !rosterProblems()) generate();
    updateHero();
    if (isWide()) { renderRoster(); renderLineup(); }
    else if (view === "lineup") renderLineup();
    else renderRoster();
}

function setRotation(v) {
    state.rotation = v;
    markChanged();
    if (state.roster.length && !rosterProblems()) generate();
    updateHero();
    if (isWide()) { renderRoster(); renderLineup(); }
    else renderRoster();
}

function setRunners(v) {

}

// =====================================================================
// GENERATE
// =====================================================================
function rosterProblems() {
    const missing = state.roster.filter(r => !r.start || !r.end).map(r => r.name);
    if (missing.length) return `Add shift times for ${missing.join(", ")}.`;
    return null;
}

// Who was where at 2:00 in today's AM lineup (this device's AM draft, or the AM lineup saved to Sheets)
let sheetAmHandover = null;
function amHandover() {
    try {
        const raw = localStorage.getItem(`lineupDraft:${todayIso()}:AM`);
        const o = raw ? JSON.parse(raw) : null;
        if (o && o.result && o.result.handover) return { handover: o.result.handover, deferBreaks: o.result.deferBreaks || [] };
    } catch (e) {}
    return sheetAmHandover;
}

function generate() {
    if (!state || !state.roster.length) { result = null; dirty = false; return; }
    // leaders come from the staff sheet's Role column (trainers are always treated as leaders)
    const leaders = leaderNames();
    result = buildLineup({ ...state, leaders }, RATINGS, state.daypart === "PM" ? amHandover() : null);
    dirty = false;
    saveDraft();
    renderSweepTimes();
}

function generateAndShow() {
    if (!state.roster.length) { showStatusMessage("Add at least one person first.", "error"); return; }
    const p = rosterProblems();
    if (p) { showStatusMessage(p, "error"); return; }
    generate();
    updateHero();
    if (isWide()) {
        renderLineup();
        document.getElementById("lineupPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
        setView("lineup");
    }
}

function regenerate() {
    const p = rosterProblems();
    if (p) { showStatusMessage(p, "error"); return; }
    generate();
    updateHero();
    renderLineup();
    showStatusMessage("Lineup rebuilt.", "success", 2000);
}

async function refreshEverything() {
    showStatusMessage("Refreshing staff and ratings...", "info", 3000);
    const ok = await startStaffLoad();
    if (state && state.roster.length && !rosterProblems()) generate();
    renderAll();
    await checkSavedLineup();
    showStatusMessage(ok ? "Refreshed." : "Couldn't reach the staff sheet — using what was already loaded.", ok ? "success" : "error", 3000);
}

// "6:30 AM – 2:00 PM + handover" (the AM lineup runs one step past 2:00 to show who takes over)
function windowLabel(res) {
    const [W0, W1] = res.window;
    const split = toMin(DAYPART_SPLIT);
    if (res.daypart === "AM" && W1 === split + STEP) return `${fmtClock(W0)} – ${fmtClock(split)} + handover`;
    return `${fmtClock(W0)} – ${fmtClock(W1)}`;
}

function nowInWindow() {
    if (!result || result.date !== todayIso()) return null;
    const d = new Date();
    let m = d.getHours() * 60 + d.getMinutes();
    const [W0, W1] = result.window;
    if (m < W0 - 360) m += 1440;
    return (m >= W0 && m < W1) ? m : null;
}

function renderBreakEditor() {

            : b.kind === "merge" ? `${b.trainingPos} → ${b.cover || "covered"}; ${b.trainee} trains with ${b.mergeWith}`
            : b.kind === "joint" ? `${b.trainingPos} → ${b.cover || "covered"}; ${b.trainee} breaks too`
            : b.pos ? `${b.pos}${b.cover ? ` → ${b.cover} covers${b.backfill ? ` (moved from ${b.backfillPos}; ${b.backfill} takes it)` : ""}` : " closes"}` : "Self-break";
