// =====================================================================
// CALL OFFS
// =====================================================================
let calloffDraft = new Set();
let calloffKeep = true;

function openCallOffs() {
    if (!state.roster.length) { showStatusMessage("Add people to the roster first.", "warning"); return; }
    calloffDraft = new Set(state.roster.filter(r => r.calledOff).map(r => r.name));
    calloffKeep = true;
    renderCallOffs();
    document.getElementById("calloffModal").classList.add("active");
}
function closeCallOffs() { document.getElementById("calloffModal").classList.remove("active"); }

// Lock point: end of the current 15-minute block, when it's today's lineup and the shift is under way
function calloffLockPoint() {
    const now = nowInWindow();
    if (now === null || !result) return null;
    return Math.floor(now / STEP) * STEP + STEP;
}

function renderCallOffs() {
    const lockAt = calloffLockPoint();
    const rows = state.roster.map((r, i) => {
        const on = calloffDraft.has(r.name);
        return `
            <div class="callrow ${on ? "off" : ""}">
                <span class="chip-avatar">${esc(initials(r.name))}</span>
                <div><b>${esc(r.name)}</b><div class="break-sub">${r.start && r.end ? fmtClock(toMin(r.start)) + " – " + fmtClock(toMin(r.end)) : "No shift time"}</div></div>
                <button type="button" class="switch ${on ? "on" : ""}" data-i="${i}" onclick="toggleCallOffDraft(+this.dataset.i)" aria-label="Called off"><i></i></button>
            </div>`;
    }).join("");
    document.getElementById("calloffBody").innerHTML = `
        <p class="sheet-help" style="margin-top:0; margin-bottom:0.8rem;">Switch on anyone who called off.</p>
        <div class="calllist">${rows}</div>
        <div class="sheet-foot">
        ${lockAt !== null ? `
        <div class="callkeep">
            <div><b>Keep the lineup the same up to ${fmtClock(lockAt)}</b><div class="break-sub">Only change the rest of the shift</div></div>
            <button type="button" class="switch ${calloffKeep ? "on" : ""}" onclick="calloffKeep=!calloffKeep; renderCallOffs()" aria-label="Keep lineup up to now"><i></i></button>
        </div>` : ""}
        <button type="button" class="btn-primary block" style="margin-top:0.85rem;" onclick="applyCallOffs()">${ICON.refresh} Regenerate with call offs</button>
        </div>`;
}

function toggleCallOffDraft(i) {
    const r = state.roster[i];
    if (!r) return;
    if (calloffDraft.has(r.name)) calloffDraft.delete(r.name); else calloffDraft.add(r.name);
    renderCallOffs();
}

function applyCallOffs() {
    const lockAt = calloffLockPoint();
    if (lockAt !== null && calloffKeep && result) {
        state.lock = {
            until: lockAt,
            positions: result.actual || result.positions,
            breaks: result.breaks.map(b => ({ name: b.name, start: b.start })),
            tasks: result.tasks.map(k => ({ key: k.key, start: k.start, name: k.name }))
        };
    } else if (!calloffKeep) {
        state.lock = null;
    }
    state.roster.forEach(r => { r.calledOff = calloffDraft.has(r.name); });
    closeCallOffs();
    markChanged();
    const p = rosterProblems();
    if (!p) generate();
    updateHero();
    if (isWide()) { renderRoster(); renderLineup(); }
    else renderLineup();
    const n = calloffDraft.size;
    showStatusMessage(p ? p : `Lineup rebuilt${n ? ` without ${n} call off${n === 1 ? "" : "s"}` : ""}.`, p ? "error" : "success", 3500);
}

function unlockLineup() {
    state.lock = null;
    markChanged();
    generate();
    updateHero();
    renderLineup();
    showStatusMessage("Rebuilt the whole shift.", "success", 2500);
}

function renderTaskEditor() {
    const box = document.getElementById("taskEditor");
    if (!box) return;
    const list = result.tasks.slice().sort((a, b) => a.start - b.start);
    if (!list.length) { box.innerHTML = `<p class="card-sub">No tasks this shift.</p>`; return; }
    const icon = { lemonade: ["lemon", ICON.cup], sweep: ["sweep", ICON.broom], ice: ["ice", ICON.ice], catering: ["cater", ICON.box], delivery: ["cater", ICON.box], catprep: ["cater", ICON.box] };
    box.innerHTML = list.map(k => {
        const [cls, svg] = icon[k.type] || ["sweep", ICON.broom];
        const who = k.name ? `${k.name}${k.pos ? ` · from ${k.pos}${k.cover ? ` → ${k.cover} covers` : ""}` : ""}` : "No one free";
        const extra = k.offRoster ? " · catering only (not on the roster)" : k.type === "catprep" ? ` · ${k.mins} min, for the ${fmtT(k.deadline)} order` : k.type === "delivery" ? ` · leaves ${fmtT(k.leaves)}, back ~${fmtT(k.back)}` : k.deadline ? ` · ready by ${fmtT(k.deadline)}` : "";
        const isPinned = !!(state.taskOverrides && k.key && state.taskOverrides[k.key]);
        return `
            <div class="break-row">
                <span class="task-icon ${cls}">${svg}</span>
                <div><b>${esc(k.label)}</b><div class="break-sub">${esc(who)}${extra}</div></div>
                ${k.type === "catering" || k.type === "delivery" ? `<span class="times-inline">${fmtClock(k.start)} – ${fmtClock(k.type === "delivery" ? k.back : k.end)}</span>` : `<input type="time" class="time-input" step="900" value="${hhmm(k.start)}" data-k="${esc(k.key || "")}" onchange="setTaskTime(this.dataset.k, this.value)">`}
                ${k.type === "catering" || k.type === "delivery" ? `<span class="auto-tag">Set</span>` : isPinned ? `<button type="button" class="link-btn" data-k="${esc(k.key)}" onclick="setTaskTime(this.dataset.k, '')">Reset</button>` : `<span class="auto-tag">Auto</span>`}
            </div>`;
    }).join("");
}

function setTaskTime(key, val) {
    if (!key) return;
    if (!state.taskOverrides) state.taskOverrides = {};
    if (val) state.taskOverrides[key] = val; else delete state.taskOverrides[key];
    dirty = true;
    saveDraft();
    generate();
    updateHero();
    renderLineup();
}

function setBreak(name, val) {
    if (!state.breakOverrides) state.breakOverrides = {};
    if (val) state.breakOverrides[name] = val; else delete state.breakOverrides[name];
    dirty = true;
    saveDraft();
    generate();
    updateHero();
    renderLineup();
}

function renderWarnings() {
    const box = document.getElementById("warnBox");
    if (!box) return;
    const w = (result.calledOff && result.calledOff.length ? [`Called off: ${result.calledOff.join(", ")}.`] : []).concat(result.warnings || []);
    box.innerHTML = `<ul class="warn-list">${w.length ? w.map(x => `<li>${esc(x)}</li>`).join("") : `<li class="ok">Everything is covered — no conflicts.</li>`}</ul>`;
}

// =====================================================================
// MIND MAP LAYOUT + RENDER
// =====================================================================
const MAP_FONT = "'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
let measureCtx = null;
function textW(t, size, weight, italic) {
    if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
    measureCtx.font = `${italic ? "italic " : ""}${weight} ${size}px ${MAP_FONT}`;
    return measureCtx.measureText(t).width;
}

function tint(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function elbow(x1, y1, tx, x2, y2) {
    if (Math.abs(y2 - y1) < 1) return `M${x1} ${y1}H${x2}`;
    const s = y2 > y1 ? 1 : -1;
    const r = Math.min(10, Math.abs(y2 - y1) / 2);
    return `M${x1} ${y1}H${tx - r}Q${tx} ${y1} ${tx} ${y1 + s * r}V${y2 - s * r}Q${tx} ${y2} ${tx + r} ${y2}H${x2}`;
}

// Who covers a break: their cover, "self" if they weren't in a spot (e.g. the runner),
// or "<spot> closes" — only ever the lowest-priority spot open at that moment (the next one to go)
function breakCover(b) {
    if (b.trainee === true) return { text: b.kind === "joint" ? `with ${b.trainer}` : `${b.trainer} runs ${b.pos}`, info: true, from: b.start, to: b.end };
    if (!b.pos) return { text: "self", info: true, from: b.start, to: b.end };
    if (!b.cover) return { text: `${b.pos} closes (next to go)`, info: true, from: b.start, to: b.end };
    return { text: b.cover, name: b.cover, from: b.start, to: b.end };
}

function mapGroups(res) {
    const W1 = res.window[1];
    const groups = [];
    ["FC", "DT", "Outside"].forEach(g => {
        const rows = POSITIONS.filter(p => p.group === g && (res.positions[p.name] || []).length).map(p => ({
            label: p.name,
            chain: res.positions[p.name].map(s => ({ text: `${s.name} ${fmtRange(s.from, s.to, W1)}`, name: s.name, from: s.from, to: s.to }))
        }));
        if (rows.length) groups.push({ key: g, rows });
    });
    if (res.breaks.length) {
        groups.push({
            key: "Breaks",
            branched: true,
            rows: res.breaks.slice().sort((a, b) => a.start - b.start || a.name.localeCompare(b.name)).map(b => ({
                branch: fmtT(b.start), branchFrom: b.start, branchTo: b.end,
                label: b.name, labelName: b.name, from: b.start, to: b.end,
                chain: [breakCover(b)]
                    .concat(b.backfill ? [{ text: `${b.backfillPos}: ${b.backfill}`, name: b.backfill, info: true, from: b.start, to: b.end }] : [])
                    .concat(b.kind === "merge" ? [{ text: `${b.trainee} trains with ${b.mergeWith}`, info: true, from: b.start, to: b.end }] : [])
                    .concat(b.kind === "leader" && b.trainee ? [{ text: `leader, with ${b.trainee}`, info: true, from: b.start, to: b.end }] : [])
            }))
        });
    }
    if ((res.sessions || []).length) {
        groups.push({
            key: "Training",
            rows: res.sessions.map(x => ({
                label: x.trainee, labelName: x.trainee,
                chain: [{ text: `${x.pos} with ${x.trainer} ${fmtRange(x.start, x.end, W1)}`, name: x.trainer, from: x.start, to: x.end }]
            }))
        });
    }
    if (res.tasks.length) {
        const order = ["Catering supplies", "Catering", "Delivery", "Lemonade", "Parking Lot Sweep", "Ice Bin"];
        const rows = order.filter(l => res.tasks.some(k => k.label === l)).map(l => ({
            label: l,
            chain: res.tasks.filter(k => k.label === l).map(k => ({ text: `${k.name || "Unassigned"} ${fmtT(k.start)}-${fmtT(k.end)}`, name: k.name, from: k.start, to: k.end }))
        }));
        groups.push({ key: "Tasks", rows });
    }
    return groups;
}

function layoutMap(res, opts = {}) {
    const groups = mapGroups(res);
    const nowM = opts.now === false ? null : (showNow ? nowInWindow() : null);
    const NODE_H = 34, ROW = 48, PADX = 13, GROUP_GAP = 16, CHAIN_GAP = 26;
    const nodes = [], edges = [];

    const sub = `${res.daypart} · ${shortDate(res.date)}`;
    const rootW = Math.max(textW("Lineup", 30, 700), textW(sub, 13, 600)) + 44;
    const rootH = 76;
    const groupW = Math.max(...groups.map(g => textW(GROUPS[g.key].label, 17, 700))) + 34;
    const rootX = 18;
    const groupX = rootX + rootW + 52;
    const posX = groupX + groupW + 46;
    const branchW = Math.max(0, ...groups.filter(g => g.branched).flatMap(g => g.rows.map(r => textW(r.branch, 15, 800)))) + 26;
    const branchRowX = posX + branchW + 40;

    let y = 18;
    groups.forEach(g => {
        g.rows.forEach((r, i) => {
            // a little space between break times
            if (g.branched && i > 0 && r.branch !== g.rows[i - 1].branch) y += 8;
            r.cy = y + ROW / 2; y += ROW;
        });
        g.cy = (g.rows[0].cy + g.rows[g.rows.length - 1].cy) / 2;
        if (g.branched) {
            g.branches = [];
            g.rows.forEach(r => {
                const last = g.branches[g.branches.length - 1];
                if (last && last.label === r.branch) last.rows.push(r);
                else g.branches.push({ label: r.branch, from: r.branchFrom, to: r.branchTo, rows: [r] });
            });
            g.branches.forEach(b => { b.cy = (b.rows[0].cy + b.rows[b.rows.length - 1].cy) / 2; });
        }
        y += GROUP_GAP;
    });
    const height = Math.max(y + 4, rootH + 40);
    const rootCy = groups.length ? (groups[0].cy + groups[groups.length - 1].cy) / 2 : height / 2;

    nodes.push({
        kind: "root", x: rootX, y: rootCy - rootH / 2, w: rootW, h: rootH, r: 14, fill: "#002a4f",
        lines: [{ text: "Lineup", size: 30, weight: 700, color: "#ffffff", dy: -9 }, { text: sub, size: 13, weight: 600, color: "#fbbf24", dy: 19 }]
    });

    let maxX = rootX + rootW;
    const rootTrunk = rootX + rootW + 24;
    groups.forEach(g => {
        const G = GROUPS[g.key];
        const gh = 40;
        edges.push({ d: elbow(rootX + rootW, rootCy, rootTrunk, groupX, g.cy), color: G.color, wd: 3 });
        nodes.push({ kind: "group", x: groupX, y: g.cy - gh / 2, w: groupW, h: gh, r: 12, fill: G.color, lines: [{ text: G.label, size: 17, weight: 700, color: G.text, dy: 0 }] });
        const trunk = groupX + groupW + 22;
        if (g.branched) {
            g.branches.forEach(b => {
                const bw = textW(b.label, 15, 800) + 26;
                edges.push({ d: elbow(groupX + groupW, g.cy, trunk, posX, b.cy), color: G.color, wd: 2 });
                const isNow = nowM !== null && b.from <= nowM && nowM < b.to;
                nodes.push({
                    kind: "branch", x: posX, y: b.cy - NODE_H / 2, w: bw, h: NODE_H, r: 10,
                    fill: isNow ? "#1d4ed8" : G.color, now: isNow,
                    lines: [{ text: b.label, size: 15, weight: 800, color: G.text, dy: 0 }]
                });
                const btrunk = posX + bw + 18;
                b.rows.forEach(r => edges.push({ d: elbow(posX + bw, b.cy, btrunk, branchRowX, r.cy), color: G.color, wd: 2 }));
            });
        }
        g.rows.forEach(r => {
            const rx = g.branched ? branchRowX : posX;
            const pw = textW(r.label, 15, 700) + PADX * 2;
            if (!g.branched) edges.push({ d: elbow(groupX + groupW, g.cy, trunk, posX, r.cy), color: G.color, wd: 2 });
            const rowNow = nowM !== null && r.from !== undefined && r.from <= nowM && nowM < r.to;
            nodes.push({
                kind: "pos", x: rx, y: r.cy - NODE_H / 2, w: pw, h: NODE_H, r: 10,
                fill: rowNow ? tint(G.color, 0.22) : "#ffffff", stroke: G.color, sw: rowNow ? 3.5 : 2, now: rowNow,
                name: r.labelName || null, lines: [{ text: r.label, size: 15, weight: 700, color: "#1e293b", dy: 0 }]
            });
            let x = rx + pw;
            r.chain.forEach(c => {
                const italic = !!c.info;
                const w = textW(c.text, c.info ? 14 : 15, c.info ? 500 : 600, italic) + PADX * 2;
                const nx = x + CHAIN_GAP;
                edges.push({ d: `M${x} ${r.cy}H${nx}`, color: G.color, wd: 2 });
                const isNow = nowM !== null && c.from !== undefined && c.from <= nowM && nowM < c.to;
                nodes.push({
                    kind: c.info ? "info" : "seg", x: nx, y: r.cy - NODE_H / 2, w, h: NODE_H, r: 10,
                    fill: isNow ? tint(G.color, 0.22) : (c.info ? "#f8fafc" : "#ffffff"),
                    stroke: G.color, sw: isNow ? 3.5 : (c.info ? 1.5 : 2), dash: !!c.info, now: isNow,
                    name: c.name || null,
                    lines: [{ text: c.text, size: c.info ? 14 : 15, weight: c.info ? 500 : 600, color: c.info ? "#475569" : "#1e293b", dy: 0, italic }]
                });
                x = nx + w;
            });
            maxX = Math.max(maxX, x);
        });
        maxX = Math.max(maxX, posX);
    });

    return { w: Math.ceil(maxX + 22), h: Math.ceil(height), nodes, edges };
}

function svgFromLayout(L) {
    const out = [`<svg xmlns="http://www.w3.org/2000/svg" id="mapSvg" viewBox="0 0 ${L.w} ${L.h}" width="${L.w}" height="${L.h}">`];
    L.edges.forEach(e => out.push(`<path d="${e.d}" fill="none" stroke="${e.color}" stroke-width="${e.wd}" stroke-linecap="round"/>`));
    L.nodes.forEach(n => {
        const click = n.name ? ` data-name="${esc(n.name)}" onclick="focusPerson(this.dataset.name)"` : "";
        out.push(`<g class="mm-node ${n.kind}${n.name ? " clickable" : ""}${n.now ? " now" : ""}"${click}>`);
        out.push(`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${n.r}" fill="${n.fill}"${n.stroke ? ` stroke="${n.stroke}" stroke-width="${n.sw}"${n.dash ? ' stroke-dasharray="5 4"' : ""}` : ""}/>`);
        n.lines.forEach(l => {
            out.push(`<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + l.dy}" text-anchor="middle" dominant-baseline="central" font-family="${MAP_FONT.replace(/"/g, "'")}" font-size="${l.size}" font-weight="${l.weight}"${l.italic ? ' font-style="italic"' : ""} fill="${l.color}">${esc(l.text)}</text>`);
        });
        out.push(`</g>`);
    });
    out.push(`</svg>`);
    return out.join("");
}

function renderMap() {
    const wrap = document.getElementById("mapWrap");
    if (!wrap || !result) return;
    mapLayout = layoutMap(result);
    wrap.innerHTML = svgFromLayout(mapLayout);
    applyZoom();
    applyFocus();
}

function applyZoom() {
    const svg = document.getElementById("mapSvg");
    const wrap = document.getElementById("mapWrap");
    if (!svg || !wrap || !mapLayout) return;
    const s = currentScale();
    svg.setAttribute("width", Math.round(mapLayout.w * s));
    svg.setAttribute("height", Math.round(mapLayout.h * s));
}

function currentScale() {
    const wrap = document.getElementById("mapWrap");
    if (typeof zoom === "number") return zoom;
    if (!wrap || !mapLayout) return 1;
    const fit = Math.min(1, (wrap.clientWidth - 4) / mapLayout.w);
    if (zoom === "fit") return Math.max(0.2, fit);
    return Math.max(0.62, fit); // auto: readable text, scroll sideways if needed
}
function zoomBy(d) { zoom = Math.max(0.3, Math.min(2.5, Math.round((currentScale() + d) * 100) / 100)); renderLineup(); }
function zoomFit() { zoom = (zoom === "fit") ? null : "fit"; renderLineup(); }

function focusPerson(name) {
    focusName = (focusName === name) ? null : name;
    applyFocus();
}

function applyFocus() {
    const svg = document.getElementById("mapSvg");
    const bar = document.getElementById("focusBar");
    if (!svg || !bar) return;
    if (!focusName) {
        svg.classList.remove("focusing");
        bar.classList.remove("active");
        return;
    }
    svg.classList.add("focusing");
    svg.querySelectorAll(".mm-node").forEach(g => {
        const mine = g.dataset.name === focusName;
        g.classList.toggle("keep", mine || g.classList.contains("root") || g.classList.contains("group") || g.classList.contains("branch"));
        g.classList.toggle("focused", mine);
    });
    const p = result.people.find(x => x.name === focusName);
    const b = result.breaks.find(x => x.name === focusName);
    const tasks = result.tasks.filter(k => k.name === focusName).map(k => `${k.label} ${fmtT(k.start)}-${fmtT(k.end)}`);
    bar.innerHTML = `<span>Showing <b>${esc(focusName)}</b></span>
        ${p ? `<span>Shift ${fmtT(p.shiftStart ?? p.start)}-${fmtT(p.shiftEnd ?? p.end)}</span>` : ""}
        ${b ? `<span>Break ${fmtT(b.start)}-${fmtT(b.end)}</span>` : ""}
        ${tasks.length ? `<span>${esc(tasks.join(" · "))}</span>` : ""}
        <span class="focus-actions">
            <button type="button" class="focus-bd" onclick="openBreakdown(focusName)">Breakdown for ${esc(focusName.split(" ")[0])}</button>
            <button type="button" onclick="focusPerson(focusName)">Clear</button>
        </span>`;
    bar.classList.add("active");
}

window.addEventListener("resize", () => { if (view === "lineup" && typeof zoom !== "number") applyZoom(); });
setInterval(() => { if (view === "lineup" && result && showNow && !document.querySelector(".modal-overlay.active")) { renderMap(); } }, 60000);

// =====================================================================
// EXPORTS
// =====================================================================
function fileBase() { return `lineup-${result.date}-${result.daypart}`; }

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function openExport() {
    const has = !!result;
    document.querySelectorAll("#exportModal .needs-result").forEach(b => { b.disabled = !has; });
    const shareBtn = document.getElementById("sharePngBtn");
    shareBtn.style.display = canShareFiles() ? "" : "none";
    document.querySelectorAll(".poster-share").forEach(b => { b.style.display = canShareFiles() ? "" : "none"; });
    const help = [];
    if (!has) help.push("Generate a lineup first to export it.");
    if (!lineupFormReady()) help.push("Saving to Google Sheets isn't set up yet — paste the form and sheet IDs into LINEUP_FORM at the top of the code.");
    help.push("The .mm file opens in mind map apps that import FreeMind maps. The .lineup file keeps everything (roster, tasks, breaks) and reopens here with Import.");
    document.getElementById("exportHelp").innerText = help.join(" ");
    document.getElementById("exportModal").classList.add("active");
}
function closeExport() { document.getElementById("exportModal").classList.remove("active"); }

function canShareFiles() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] })); } catch (e) { return false; }
}

function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawMap(ctx, L) {
    L.edges.forEach(e => {
        ctx.strokeStyle = e.color;
        ctx.lineWidth = e.wd;
        ctx.lineCap = "round";
        ctx.stroke(new Path2D(e.d));
    });
    L.nodes.forEach(n => {
        roundRectPath(ctx, n.x, n.y, n.w, n.h, n.r);
        ctx.fillStyle = n.fill;
        ctx.fill();
        if (n.stroke) {
            ctx.setLineDash(n.dash ? [5, 4] : []);
            ctx.lineWidth = n.sw;
            ctx.strokeStyle = n.stroke;
            ctx.stroke();
            ctx.setLineDash([]);
        }
        n.lines.forEach(l => {
            ctx.font = `${l.italic ? "italic " : ""}${l.weight} ${l.size}px ${MAP_FONT}`;
            ctx.fillStyle = l.color;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(l.text, n.x + n.w / 2, n.y + n.h / 2 + l.dy);
        });
    });
}

async function exportPNG(share) {
    if (!result) return;
    try { await document.fonts.ready; } catch (e) {}
    const L = layoutMap(result, { now: false });
    const sc = 2;
    const c = document.createElement("canvas");
    c.width = L.w * sc;
    c.height = L.h * sc;
    const ctx = c.getContext("2d");
    ctx.scale(sc, sc);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, L.w, L.h);
    drawMap(ctx, L);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    if (!blob) { showStatusMessage("Couldn't create the picture.", "error"); return; }
    const name = fileBase() + ".png";
    if (share && canShareFiles()) {
        try {
            await navigator.share({ files: [new File([blob], name, { type: "image/png" })], title: `${result.daypart} Lineup` });
            return;
        } catch (e) {
            if (e && e.name === "AbortError") return;
        }
    }
    downloadBlob(blob, name);
    showStatusMessage("Picture saved.", "success", 2500);
}

// =====================================================================
// LINEUP + BREAKDOWN POSTER (one picture to print or put on a screen)
// =====================================================================
function wrapText(ctx, text, maxW) {
    const words = String(text).split(" ");
    const out = [];
    let line = "";
    words.forEach(w => {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = "   " + w; }
        else line = test;
    });
    if (line) out.push(line);
    return out;
}

function buildPoster(res) {
    const L = layoutMap(res, { now: false });
    const blocks = breakdownBlocks(res);
    const HEADER = 92, PAD = 28, GAP = 28, COL_W = 360, COL_GAP = 18;
    const TIME_H = 28, LINE_H = 21, BLOCK_GAP = 14, INNER = 16;
    const measure = document.createElement("canvas").getContext("2d");
    const lineFont = `500 15px ${MAP_FONT}`;
    measure.font = lineFont;

    // Lay out breakdown blocks (wrapped lines) and flow them into columns about as tall as the map
    const laid = blocks.map(b => {
        const rows = b.lines.flatMap(l => wrapText(measure, l.text, COL_W - INNER * 2 - 10).map((txt, j) => ({ txt, brk: /^Break/.test(l.text), first: j === 0 })));
        return { t: b.t, rows, h: TIME_H + rows.length * LINE_H + BLOCK_GAP };
    });
    const total = laid.reduce((a, b) => a + b.h, 0);
    let colH = Math.max(L.h, 640);
    // keep the picture roughly landscape: don't let the breakdown go wider than ~1.4x the map
    const maxCols = Math.max(1, Math.floor((L.w * 1.4) / (COL_W + COL_GAP)));
    if (Math.ceil(total / colH) > maxCols) colH = Math.ceil(total / maxCols) + 60;
    // when it takes more than one column, split it evenly instead of leaving a near-empty last column
    const nCols = Math.max(1, Math.ceil(total / (colH - 40)));
    if (nCols > 1) colH = Math.ceil(total / nCols) + Math.max(...laid.map(b => b.h)) + 40;
    const cols = [[]];
    let used = 0;
    laid.forEach(b => {
        if (used + b.h > colH - 40 && cols[cols.length - 1].length) { cols.push([]); used = 0; }
        cols[cols.length - 1].push(b);
        used += b.h;
    });
    const bdW = cols.length * COL_W + (cols.length - 1) * COL_GAP;
    const bodyH = Math.max(L.h, Math.max(...cols.map(c => c.reduce((a, b) => a + b.h, 0))) + 50);
    const W = PAD + L.w + GAP + bdW + PAD;
    const H = HEADER + bodyH + PAD;
    return { L, cols, W, H, HEADER, PAD, GAP, COL_W, COL_GAP, TIME_H, LINE_H, BLOCK_GAP, INNER, bodyH, lineFont };
}

async function posterCanvas(res) {
    try { await document.fonts.ready; } catch (e) {}
    const P = buildPoster(res);
    const sc = Math.min(2, 15000 / Math.max(P.W, P.H));
    const c = document.createElement("canvas");
    c.width = Math.round(P.W * sc);
    c.height = Math.round(P.H * sc);
    const ctx = c.getContext("2d");
    ctx.scale(sc, sc);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, P.W, P.H);

    // Header band
    ctx.fillStyle = "#002a4f";
    ctx.fillRect(0, 0, P.W, P.HEADER - 16);
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(0, P.HEADER - 16, P.W, 4);
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff";
    ctx.font = `800 30px ${MAP_FONT}`;
    ctx.fillText(`${res.daypart} Lineup — ${prettyDate(res.date)}`, P.PAD, 32);
    ctx.fillStyle = "#cbd5e1";
    ctx.font = `600 15px ${MAP_FONT}`;
    const sub = [windowLabel(res), MODES[res.mode] ? MODES[res.mode].long : "",
        res.rotation ? `outside rotation every ${res.rotation >= 60 ? res.rotation / 60 + " hr" : res.rotation + " min"}` : "",
        res.calledOff && res.calledOff.length ? `called off: ${res.calledOff.join(", ")}` : ""].filter(Boolean).join("  ·  ");
    ctx.fillText(sub, P.PAD, 60);
    ctx.textAlign = "right";
    ctx.fillStyle = "#94a3b8";
    ctx.font = `600 13px ${MAP_FONT}`;
    ctx.fillText(`Made ${new Date().toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" })}`, P.W - P.PAD, 32);

    // Section labels
    const top = P.HEADER;
    ctx.textAlign = "left";
    ctx.fillStyle = "#5C768D";
    ctx.font = `800 12px ${MAP_FONT}`;
    ctx.fillText("LINEUP", P.PAD, top + 6);
    const bx = P.PAD + P.L.w + P.GAP;
    ctx.fillText("TIME BREAKDOWN", bx, top + 6);

    // Map
    ctx.save();
    ctx.translate(P.PAD, top + 14);
    drawMap(ctx, P.L);
    ctx.restore();

    // Divider
    ctx.strokeStyle = "#e1e8f0";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx - P.GAP / 2, top);
    ctx.lineTo(bx - P.GAP / 2, top + P.bodyH);
    ctx.stroke();

    // Breakdown columns
    P.cols.forEach((col, ci) => {
        const x = bx + ci * (P.COL_W + P.COL_GAP);
        let y = top + 22;
        const colH = col.reduce((a, b) => a + b.h, 0) + 8;
        roundRectPath(ctx, x, y - 6, P.COL_W, colH, 14);
        ctx.fillStyle = "#f5f8fb";
        ctx.fill();
        col.forEach(b => {
            ctx.textAlign = "left";
            ctx.fillStyle = "#002a4f";
            ctx.font = `800 17px ${MAP_FONT}`;
            ctx.fillText(fmtClock(b.t), x + P.INNER, y + P.TIME_H / 2 + 2);
            y += P.TIME_H;
            b.rows.forEach(r => {
                ctx.fillStyle = r.brk ? "#3b82f6" : "#c7d3e0";
                if (r.first) ctx.fillRect(x + P.INNER, y + 3, 3, P.LINE_H - 6);
                ctx.fillStyle = r.brk ? "#1e40af" : "#1e293b";
                ctx.font = P.lineFont;
                ctx.fillText(r.txt, x + P.INNER + 10, y + P.LINE_H / 2);
                y += P.LINE_H;
            });
            y += P.BLOCK_GAP;
        });
    });
    return c;
}

async function exportPoster(how) {
    if (!result) return;
    const c = await posterCanvas(result);
    if (how === "screen") { showPoster(c); return; }
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    if (!blob) { showStatusMessage("Couldn't create the picture.", "error"); return; }
    const name = `${fileBase()}-with-breakdown.png`;
    if (how === "print") { printImage(URL.createObjectURL(blob), c.width > c.height); return; }
    if (how === "share" && canShareFiles()) {
        try { await navigator.share({ files: [new File([blob], name, { type: "image/png" })], title: `${result.daypart} Lineup` }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
    }
    downloadBlob(blob, name);
    showStatusMessage("Lineup + breakdown picture saved.", "success", 2500);
}

// Prints just the picture, scaled to fit one page
function printImage(url, landscape) {
    const f = document.createElement("iframe");
    f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
    document.body.appendChild(f);
    const d = f.contentWindow.document;
    d.open();
    d.write(`<!doctype html><html><head><title>Lineup</title><style>
        @page { size: ${landscape ? "landscape" : "portrait"}; margin: 0.25in; }
        html, body { margin: 0; height: 100%; }
        body { display: flex; align-items: center; justify-content: center; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style></head><body><img src="${url}"></body></html>`);
    d.close();
    const img = d.querySelector("img");
    const go = () => {
        f.contentWindow.focus();
        f.contentWindow.print();
        setTimeout(() => { f.remove(); URL.revokeObjectURL(url); }, 60000);
    };
    if (img.complete) setTimeout(go, 50); else img.onload = () => setTimeout(go, 50);
}

// Full-screen view for a computer screen in the back

function lineupText(res) {
    const W1 = res.window[1];
    const lines = [`LINEUP — ${res.daypart} · ${prettyDate(res.date)} (${MODES[res.mode] ? MODES[res.mode].long : ""})`, ""];
    if (res.calledOff && res.calledOff.length) lines.splice(1, 0, `Called off: ${res.calledOff.join(", ")}`);
    ["FC", "DT", "Outside"].forEach(g => {
        const rows = POSITIONS.filter(p => p.group === g && (res.positions[p.name] || []).length);
        if (!rows.length) return;
        lines.push(g.toUpperCase());
        rows.forEach(p => lines.push(`  ${p.name}: ${res.positions[p.name].map(s => `${s.name} ${fmtRange(s.from, s.to, W1)}`).join(" → ")}`));
        lines.push("");
    });
    if (res.breaks.length) {
        lines.push("BREAKS");
        res.breaks.slice().sort((a, b) => a.start - b.start || a.name.localeCompare(b.name)).forEach(b => {
            lines.push(`  ${fmtT(b.start).padEnd(4)}  ${b.name} → ${breakCover(b).text}${b.backfill ? ` (${b.backfill} takes ${b.backfillPos})` : ""}${b.kind === "merge" ? ` (${b.trainee} trains with ${b.mergeWith})` : ""}`);
        });
        lines.push("");
    }
    if ((res.sessions || []).length) {
        lines.push("TRAINING");
        res.sessions.forEach(x => lines.push(`  ${x.trainee}: ${x.pos} with ${x.trainer} ${fmtRange(x.start, x.end, W1)}`));
        lines.push("");
    }
    if (res.tasks.length) {
        lines.push("TASKS");
        res.tasks.forEach(k => lines.push(`  ${k.label}: ${k.name || "Unassigned"} ${fmtT(k.start)}-${fmtT(k.end)}${k.deadline ? ` (ready by ${fmtT(k.deadline)})` : ""}`));
        lines.push("");
    }
    return lines.join("\n").trim() + "\n";
}

// =====================================================================
// TIME BLOCK BREAKDOWN
// =====================================================================
function segAt(segs, t) { return (segs || []).find(x => x.from <= t && t < x.to) || null; }

// Every change, grouped by time: spots opening/handing over, tasks, breaks
function breakdownBlocks(res) {
    const [W0, W1] = res.window;
    const order = POSITIONS.map(p => p.name);
    const blocks = [];
    for (let t = W0; t < W1; t += STEP) {
        const lines = [];
        order.forEach(pos => {
            const segs = res.positions[pos] || [];
            const now = segAt(segs, t), before = t > W0 ? segAt(segs, t - STEP) : null;
            const n = now && now.name, b = before && before.name;
            if (n && n !== b) lines.push({ who: n, text: `${n}: ${pos} (${b ? `replaces ${b}` : "Start"})` });
            else if (!n && b) {
                const gone = !res.people.some(p => p.name === b && p.start <= t && t < p.end);
                lines.push({ who: b, text: `${pos}: closes (${b} ${gone ? "leaves" : "moves"})` });
            }
        });
        res.tasks.filter(k => k.start === t && k.name).forEach(k => {
            const cover = k.pos ? (k.cover ? ` — ${k.cover} covers ${k.pos}${k.backfill ? `, ${k.backfill} takes ${k.backfillPos}` : ""}` : ` — ${k.pos} closes`) : "";
            const what = k.type === "catprep"
                ? `Catering supplies (${k.mins} min) for the ${fmtClock(k.deadline)} order`
                : k.type === "delivery"
                ? `Catering delivery — ${k.start < k.leaves ? `prep, ` : ""}leaves ${fmtClock(k.leaves)}, back ~${fmtClock(k.back)}`
                : k.type === "catering" && k.food !== null && !k.merged ? `Catering — put the food in, until ${fmtClock(k.end)}`
                : `${k.label} until ${fmtClock(k.end)}`;
            lines.push({ who: k.name, also: [k.cover, k.backfill], text: `${k.name}${k.offRoster ? " (catering only)" : ""}: ${what}${cover}` });
        });
        (res.sessions || []).forEach(x => {
            if (x.start === t) lines.push({ who: x.trainee, also: [x.trainer], text: `Training: ${x.trainee} on ${x.pos} with ${x.trainer} until ${fmtClock(x.end)}` });
            if (x.end === t && t < W1) lines.push({ who: x.trainee, also: [x.trainer], text: `Training ends: ${x.trainee}` });
        });
        res.breaks.filter(b => b.start === t).sort((a, b) => a.name.localeCompare(b.name)).forEach(b => {
            let text;
            if (b.trainee === true) text = b.kind === "joint" ? `Break: ${b.name} (trainee, with ${b.trainer})` : `Break: ${b.name} (trainee — ${b.trainer} runs ${b.pos})`;
            else if (b.kind === "joint" && b.cover) text = `Break: ${b.cover} covers ${b.name} & ${b.trainee} (${b.pos})`;
            else if (b.kind === "leader" && b.cover) text = `Break: ${b.cover} covers ${b.name} (leader, training ${b.trainee})`;
            else if (b.kind === "merge" && b.cover) text = `Break: ${b.cover} covers ${b.name} — ${b.trainee} trains with ${b.mergeWith}`;
            else if (b.kind === "forced" && b.trainee) text = `Break: ${b.cover || "nobody"} covers ${b.name} — ${b.trainee} waits (no leader free)`;
            else if (!b.pos) text = `Break: ${b.name} (Self-break)`;
            else if (!b.cover) text = `Break: ${b.name} (${b.pos} closes)`;
            else text = `Break: ${b.cover} covers ${b.name}${b.backfill ? ` (${b.backfill} takes ${b.backfillPos})` : ""}`;
            lines.push({ who: b.name, also: [b.cover, b.backfill], text });
        });
        if (lines.length) blocks.push({ t, lines });
    }
    return blocks;
}

// One person's day: where they are each block, covers, tasks, break, when they're off
// A trainee isn't on the roster, so their "shift" is their training time (catering-only people: their catering)
function traineeAsPerson(res, name) {
    const mine = (res.sessions || []).filter(x => x.trainee === name);
    if (!mine.length) {
        const cat = (res.tasks || []).filter(k => k.name === name && k.offRoster);
        if (!cat.length) return null;
        return { name, shiftStart: Math.min(...cat.map(k => k.start)), shiftEnd: Math.max(...cat.map(k => k.back || k.end)) };
    }
    return { name, shiftStart: Math.min(...mine.map(x => x.fullStart)), shiftEnd: Math.max(...mine.map(x => x.fullEnd)) };
}

function traineeBlocks(res, name) {
    const mine = (res.sessions || []).filter(x => x.trainee === name).sort((a, b) => a.start - b.start);
    const blocks = [];
    let last = null;
    const push = (t, text) => { if (text !== last) { blocks.push({ t, lines: [{ text }] }); last = text; } };
    mine.forEach(x => {
        for (let t = x.start; t < x.end; t += STEP) {
            const br = res.breaks.find(b => b.name === name && b.start <= t && t < b.end);
            const tbr = res.breaks.find(b => b.name === x.trainer && b.start <= t && t < b.end);
            if (br) push(t, `Break until ${fmtClock(br.end)}`);
            else if (tbr && tbr.kind === "merge") push(t, `Train with ${tbr.mergeWith} until ${fmtClock(tbr.end)}`);
            else if (tbr && tbr.kind === "forced") push(t, `Wait for ${x.trainer} (on break) until ${fmtClock(tbr.end)}`);
            else if (tbr && tbr.cover) push(t, `${x.pos} with ${tbr.cover} (${x.trainer} on break) until ${fmtClock(tbr.end)}`);
            else push(t, `${x.pos} with ${x.trainer}`);
        }
        push(x.end, "Training ends");
    });
    return blocks;
}

function personBlocks(res, name) {
    const p = res.people.find(x => x.name === name);
    if (!p) {
        if ((res.sessions || []).some(x => x.trainee === name)) return traineeBlocks(res, name);
        // here just for catering
        return res.tasks.filter(k => k.name === name && k.offRoster).sort((a, b) => a.start - b.start).flatMap(k => [
            { t: k.start, lines: [{ text: k.type === "delivery" ? `${k.start < k.leaves ? "Prep catering delivery — leave at " + fmtClock(k.leaves) : "Leave on delivery"}` : `Catering due ${fmtClock(k.deadline)}` }] },
            ...(k.type === "delivery" && k.start < k.leaves ? [{ t: k.leaves, lines: [{ text: `Out on delivery — back ~${fmtClock(k.back)}` }] }] : []),
            { t: k.type === "delivery" ? k.back : k.end, lines: [{ text: "Done" }] }
        ]);
    }
    const [, W1] = res.window;
    const label = t => {
        const br = res.breaks.find(b => b.name === name && b.start <= t && t < b.end);
        if (br) return `Break until ${fmtClock(br.end)}`;
        const k = res.tasks.find(x => x.name === name && x.start <= t && t < x.end);
        if (k && k.type === "catering" && k.food !== null && !k.merged) return `Catering — put the food in, until ${fmtClock(k.end)}`;
        if (k && k.type === "catprep") return `Catering supplies for ${fmtClock(k.deadline)} order — until ${fmtClock(k.start + k.mins)}`;
        if (k && k.type === "delivery") return t < k.leaves ? `Prep catering delivery — leave at ${fmtClock(k.leaves)}` : `Out on delivery — back ~${fmtClock(k.back)}`;
        if (k) return `${k.label} until ${fmtClock(k.end)}`;
        const A = res.actual || res.positions;
        for (const pos of POSITIONS.map(x => x.name)) {
            const seg = segAt(A[pos], t);
            if (seg && seg.name === name) {
                const owner = segAt(res.positions[pos], t);
                if (owner && owner.name !== name) {
                    const onBreak = res.breaks.some(b => b.name === owner.name && b.start <= t && t < b.end);
                    const onTask = res.tasks.find(x => x.name === owner.name && x.start <= t && t < x.end);
                    return `Cover ${pos} for ${owner.name}${onBreak ? "'s break" : onTask ? ` (${onTask.label})` : ""}`;
                }
                const ses = (res.sessions || []).find(x => x.trainer === name && x.start <= t && t < x.end);
                return ses ? `${pos} — training ${ses.trainee}` : pos;
            }
        }
        return "Float / run breaks";
    };
    const blocks = [];
    let last = null;
    for (let t = p.start; t < p.end; t += STEP) {
        const l = label(t);
        if (l !== last) { blocks.push({ t, lines: [{ text: l }] }); last = l; }
    }
    const shiftEnd = p.shiftEnd ?? p.end;
    if (res.daypart === "AM" && shiftEnd > toMin(DAYPART_SPLIT)) {
        // the AM lineup's last step (2:00) only shows the handover, so their AM part ends at 2:00
        const split = toMin(DAYPART_SPLIT);
        if (blocks.length && blocks[blocks.length - 1].t >= split) blocks.pop();
        blocks.push({ t: split, lines: [{ text: "Continues on the PM lineup" }] });
    }
    else blocks.push({ t: Math.min(shiftEnd, toMin(STORE_HOURS.close)), lines: [{ text: "Off" }] });
    return blocks;
}

function breakdownText(res, name) {
    const blocks = name ? personBlocks(res, name) : breakdownBlocks(res);
    const p = name && (res.people.find(x => x.name === name) || traineeAsPerson(res, name));
    const head = name
        ? `${name} — ${res.daypart} ${shortDate(res.date)}${p ? ` · shift ${fmtClock(p.shiftStart ?? p.start)} – ${fmtClock(p.shiftEnd ?? p.end)}` : ""}`
        : `${res.daypart} Lineup — ${prettyDate(res.date)}`;
    return [head, ""].concat(blocks.flatMap(b => [fmtClock(b.t)].concat(b.lines.map(l => l.text)).concat([""]))).join("\n").trim() + "\n";
}

// FreeMind .mm - each chain is nested so it reads left to right like the on-screen map
function downloadMindMap() {
    if (!result) return;
    const x = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const groups = mapGroups(result);
    let out = `<map version="1.0.1">\n<node TEXT="${x(`Lineup ${result.daypart} ${shortDate(result.date)}`)}">\n`;
    groups.forEach((g, gi) => {
        const G = GROUPS[g.key];
        out += `<node TEXT="${x(G.label)}" POSITION="right" COLOR="${G.color}" BACKGROUND_COLOR="#ffffff">\n<edge COLOR="${G.color}" WIDTH="2"/>\n`;
        const rowOut = r => {
            out += `<node TEXT="${x(r.label)}">\n`;
            r.chain.forEach(c => { out += `<node TEXT="${x(c.text)}">\n`; });
            r.chain.forEach(() => { out += `</node>\n`; });
            out += `</node>\n`;
        };
        if (g.branched) {
            // Breaks: time -> person going on break -> person covering
            let open = null;
            g.rows.forEach(r => {
                if (r.branch !== open) {
                    if (open !== null) out += `</node>\n`;
                    out += `<node TEXT="${x(r.branch)}">\n`;
                    open = r.branch;
                }
                rowOut(r);
            });
            if (open !== null) out += `</node>\n`;
        } else {
            g.rows.forEach(rowOut);
        }
        out += `</node>\n`;
    });
    out += `</node>\n</map>\n`;
    downloadBlob(new Blob([out], { type: "application/x-freemind" }), fileBase() + ".mm");
}

function importFile(input) {
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        let o;
        try { o = JSON.parse(reader.result); } catch (e) { showStatusMessage("That file isn't a lineup file.", "error"); return; }
        if (!o || !o.state || !Array.isArray(o.state.roster)) { showStatusMessage("That file isn't a lineup file.", "error"); return; }
        applyLoadedLineup(o.state, o.result || null, `Imported ${file.name}`);
        closeExport();
    };
    reader.readAsText(file);
}

// Same day = show exactly what was saved. Different day = reuse the roster for today.
function applyLoadedLineup(loadedState, loadedResult, label, savedId) {
    saveDraftNow();
    const dp = loadedState.daypart === "AM" ? "AM" : "PM";
    const base = newState(dp);
    const sameDay = loadedState.date === todayIso();
    state = { ...base, ...loadedState, date: todayIso(), daypart: dp, savedId: savedId || null };
    state.breakOverrides = sameDay ? (loadedState.breakOverrides || {}) : {};
    state.taskOverrides = sameDay ? (loadedState.taskOverrides || {}) : {};
    if (!sameDay) { state.lock = null; state.caterings = []; state.trainings = []; state.roster = state.roster.map(r => ({ ...r, calledOff: false })); }
    state.caterings = state.caterings || []; state.trainings = state.trainings || [];
    daypart = dp;
    document.querySelectorAll(".am-pm-btn").forEach(b => b.classList.toggle("active", b.dataset.dp === dp));
    if (sameDay && loadedResult) { result = loadedResult; dirty = false; }
    else { generate(); }
    saveDraftNow();
    pendingSaved = null;
    focusName = null;
    showStatusMessage(sameDay ? `${label}.` : `${label} from ${shortDate(loadedState.date)} — rebuilt for today.`, "success", 5000);
    updateHero();
    if (isWide()) renderAll(); else setView(result ? "lineup" : "roster");
}

let savingToSheets = false;
async function saveToSheets() {
    if (!result || savingToSheets) return;
    if (!lineupFormReady()) { showStatusMessage("Saving to Sheets isn't set up yet — add the form IDs to LINEUP_FORM in the code.", "error", 8000); return; }
    const by = saverName();
    if (!by) return;
    savingToSheets = true;
    const btn = document.getElementById("saveSheetsBtn");
    btn.disabled = true;
    btn.firstChild.textContent = "Saving...";

    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    let payload = JSON.stringify({ id, state: { ...state, savedId: id }, result });
    if (payload.length > 45000) payload = JSON.stringify({ id, state: { ...state, savedId: id } }); // stays under a Sheets cell
    const form = {};
    form[LINEUP_FORM.daypartEntry] = state.daypart;
    form[LINEUP_FORM.dateEntry] = state.date;
    form[LINEUP_FORM.dataEntry] = payload;
    form[LINEUP_FORM.byEntry] = by;

    const landed = async () => {
        for (let i = 0; i < 4; i++) {
            await new Promise(r => setTimeout(r, 2500));
            const list = await fetchSavedLineups();
            if (list && list.some(x => x.id === id)) return true;
        }
        return false;
    };
    await submitToGoogleForm(LINEUP_FORM.formId, form);
    let ok = await landed();
    if (!ok) { await submitToGoogleForm(LINEUP_FORM.formId, form); ok = await landed(); }

    btn.disabled = false;
    btn.firstChild.textContent = "Save to Sheets";
    savingToSheets = false;
    if (!ok) {
        showStatusMessage("The lineup did NOT save — Google never received it. Check your connection and that the form's questions aren't Required, then try again.", "error", 12000);
        return;
    }
    state.savedId = id;
    pendingSaved = null;
    saveDraftNow();
    renderSavedBanner();
    showStatusMessage(`${state.daypart} lineup saved to Sheets.`, "success", 4000);
}

async function loadFromSheets() {
    if (!lineupFormReady()) { showStatusMessage("Loading from Sheets isn't set up yet — add the form IDs to LINEUP_FORM in the code.", "error", 8000); return; }
    showStatusMessage("Checking Sheets...", "info", 3000);
    const s = await findSaved(daypart, todayIso());
    if (s === undefined) { showStatusMessage("Couldn't reach the lineup sheet.", "error"); return; }
    if (!s) { showStatusMessage(`No ${daypart} lineup has been saved today.`, "warning"); return; }
    if (state.roster.length && s.id !== state.savedId && !confirm(`Replace your current ${daypart} roster with the one ${s.by || "a leader"} saved?`)) return;
    applyLoadedLineup(s.state, s.result, `Loaded the lineup ${s.by || "a leader"} saved`, s.id);
    closeExport();
}

async function checkSavedLineup() {
    if (!lineupFormReady() || !state) return;
    const dp = daypart;
    if (dp === "PM") {
        const am = await findSaved("AM", todayIso());
        const h = am && am.result && am.result.handover ? { handover: am.result.handover, deferBreaks: am.result.deferBreaks || [] } : null;
        if (h && JSON.stringify(h) !== JSON.stringify(sheetAmHandover)) {
            sheetAmHandover = h;
            if (state.roster.length && !rosterProblems() && daypart === "PM") { generate(); renderAll(); }
        }
    }
    const s = await findSaved(dp, todayIso());
    if (!s || dp !== daypart || s.id === state.savedId) return;
    if (!state.roster.length) {
        applyLoadedLineup(s.state, s.result, `Loaded the lineup ${s.by || "a leader"} saved`, s.id);
    } else {
        pendingSaved = s;
        renderSavedBanner();
    }
}

function renderSavedBanner() {
    document.querySelectorAll(".saved-slot").forEach((slot, i) => {
        // On wide screens show it once (above the roster), not in both columns
        if (!pendingSaved || pendingSaved.state.daypart !== daypart || (isWide() && i > 0)) { slot.innerHTML = ""; return; }
        slot.innerHTML = `<div class="saved-banner">${esc(pendingSaved.by || "A leader")} saved a different ${daypart} lineup to Sheets.
            <button type="button" onclick="applyPendingSaved()">Load it</button>
            <button type="button" class="x" title="Dismiss" onclick="pendingSaved=null; renderSavedBanner()">${ICON.x}</button></div>`;
    });
}

function applyPendingSaved() {
    const s = pendingSaved;
    if (!s) return;
    applyLoadedLineup(s.state, s.result, `Loaded the lineup ${s.by || "a leader"} saved`, s.id);
}

function openRatings() {
    const body = document.getElementById("ratingsBody");
    const names = staffNameList();
    const onRoster = state ? new Set(state.roster.map(r => r.name)) : new Set();
    const sorted = names.slice().sort((a, b) => (onRoster.has(b) - onRoster.has(a)) || a.localeCompare(b));
    if (!sorted.length) {
        body.innerHTML = `<p class="sheet-help">Staff list hasn't loaded yet. Tap &#8635; to try again.</p>`;
    } else {
        body.innerHTML = `
            <p class="sheet-help" style="margin-top:0; margin-bottom:0.75rem;">1 = needs work, 5 = ace. Edit these in the staff sheet.</p>
            <div class="ratings-scroll"><table class="ratings-table">
                <thead><tr><th>Name</th>${SKILLS.map(s => `<th>${s}</th>`).join("")}</tr></thead>
                <tbody>${sorted.map(n => `<tr><td>${esc(n)}${onRoster.has(n) ? " &#9679;" : ""}</td>${SKILLS.map(s => {
                    const v = RATINGS[n] && RATINGS[n][s];
                    return `<td><span class="rt ${v ? "rt-" + v : "rt-none"}">${v || "–"}</span></td>`;
                }).join("")}</tr>`).join("")}</tbody>
            </table></div>
            <p class="sheet-help">${esc(ratingSource)}</p>`;
    }
    document.getElementById("ratingsModal").classList.add("active");
}
function closeRatings() { document.getElementById("ratingsModal").classList.remove("active"); }

document.addEventListener("DOMContentLoaded", () => {
    applyPanelVisibility();
    cleanOldDrafts();
    startApp();
    startStaffLoad().then(ok => {
        if (!ok) showStatusMessage("Couldn't load the staff list — you can still type names in. Tap ↻ to try again.", "warning", 7000);
    });
});

window.addEventListener("pagehide", saveDraftNow);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveDraftNow(); });
