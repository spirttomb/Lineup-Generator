            if (n && n !== b) lines.push({ who: n, text: `${n}: ${pos} (${b ? `replaces ${b}` : "Start"})` });
            else if (!n && b) {
                const gone = !res.people.some(p => p.name === b && p.start <= t && t < p.end);
                lines.push({ who: b, text: `${pos}: closes (${b} ${gone ? "leaves" : "moves"})` });
            }
        });
        // Someone running breaks (not in a spot) for 30+ minutes
        res.people.forEach(p => {
            const A = res.actual || res.positions;
            const free = tt => p.start <= tt && tt < p.end
                && !res.breaks.some(b => b.name === p.name && b.start <= tt && tt < b.end)
                && !res.tasks.some(k => !k.inPlace && k.name === p.name && k.start <= tt && tt < k.end)
                && !Object.values(A).some(segs => segs.some(sg => sg.name === p.name && sg.from <= tt && tt < sg.to));
            if (!free(t) || (t > W0 && free(t - STEP))) return;
            let len = 0; for (let tt = t; free(tt) && tt < W1; tt += STEP) len += STEP;
            if (len >= 30) lines.push({ who: p.name, text: `${p.name}: Running breaks until ${fmtClock(t + len)}` });
        });
        if (res.closing && t === toMin(INSIDE_CLOSE)) lines.unshift({ who: null, text: "Inside closes — closing checklists start" });
        res.tasks.filter(k => k.start === t && k.name).forEach(k => {
            if (k.type === "closing") {
                const also = k.notes && k.notes.length ? ` (also: ${k.notes.join("; ")})` : "";
                const what = k.area === "Lead" ? `Lead the close until ${fmtClock(k.end)}`
                    : /^Closing: help /.test(k.label) ? `Help ${k.area.replace(/ \(help (.+)\)$/, " with $1")} until ${fmtClock(k.end)}`
                    : k.steps && k.steps.length ? `Close ${k.steps[0].label} until ${fmtClock(k.steps[1].at)}, then ${k.steps[1].label} until ${fmtClock(k.end)}`
                    : `Close ${k.area} until ${fmtClock(k.end)}`;
                lines.push({ who: k.name, text: `${k.name}: ${what}${also}` });
                return;
            }
            const cover = k.pos ? (k.cover ? ` — ${k.cover} covers ${k.pos}${k.backfill ? `, ${k.backfill} takes ${k.backfillPos}` : ""}` : ` — ${k.pos} closes`) : "";
            if (k.inPlace) { lines.push({ who: k.name, text: `${k.name}: ${k.label} from ${k.pos} (stays in spot)` }); return; }
            const what = k.type === "catprep"
                ? `Catering supplies (${k.mins} min) for the ${fmtClock(k.deadline)} order`
                : k.type === "delivery"
                ? `Catering delivery — ${k.start < k.leaves ? `prep, ` : ""}leaves ${fmtClock(k.leaves)}, back ~${fmtClock(k.back)}`
                : k.type === "catering" && k.food !== null && !k.merged ? `Catering — put the food in, until ${fmtClock(k.end)}`
                : `${k.label} until ${fmtClock(k.end)}`;
            lines.push({ who: k.name, also: [k.cover, k.backfill], text: `${k.name}${k.offRoster ? " (catering only)" : ""}: ${what}${cover}` });
        });
        (res.sessions || []).forEach(x => {
            const cont = (res.sessions || []).some(y => y !== x && y.trainee === x.trainee && y.end === x.start);
            if (x.start === t) lines.push({ who: x.trainee, also: [x.trainer], text: `Training: ${x.trainee} ${cont ? "moves to" : "on"} ${x.pos} with ${x.trainer} until ${fmtClock(x.end)}` });
            if (x.end === t && t < W1 && !(res.sessions || []).some(y => y !== x && y.trainee === x.trainee && y.start === x.end)) lines.push({ who: x.trainee, also: [x.trainer], text: `Training ends: ${x.trainee}` });
        });
        res.breaks.filter(b => b.start === t).sort((a, b) => a.name.localeCompare(b.name)).forEach(b => {
            let text;
            if (b.trainee === true) text = b.kind === "joint" ? `Break: ${b.name} (trainee, with ${b.trainer})` : `Break: ${b.name} (trainee — ${b.trainer} runs ${b.pos})`;
            else if (b.kind === "joint" && b.cover) text = `Break: ${b.cover} covers ${b.name} & ${b.trainee} (${b.pos})`;
            else if (b.kind === "leader" && b.cover) text = `Break: ${b.cover} covers ${b.name} (leader, training ${b.trainee})`;
            else if (b.kind === "merge" && b.cover) text = `Break: ${b.cover} covers ${b.name} — ${b.trainee} trains with ${b.mergeWith}`;
            else if (b.kind === "forced" && b.trainee) text = `Break: ${b.cover || "nobody"} covers ${b.name} — ${b.trainee} waits (no leader free)`;
            else if (!b.pos) text = `Break: ${b.name} (Self-break)`;
            else if (!b.cover) text = `Break: ${b.name} (${b.pos} closes)`;
            else text = `Break: ${b.cover} covers ${b.name}${b.backfill ? ` (${b.backfill} takes ${b.backfillPos})` : ""}`;
            lines.push({ who: b.name, also: [b.cover, b.backfill], text });
        });
        if (lines.length) blocks.push({ t, lines });
    }
    // the 10:30 close happens after the lineup ends (drive-thru closes at 10)
    const c = res.closing;
    if (c && c.block1030.length) {
        blocks.push({ t: W1, lines: [{ who: null, text: "Drive-thru closes — 10:30 close" }].concat(c.block1030.filter(b => b.name).map(b => ({
            who: b.name, text: `${b.name}: ${b.help ? "Help close (ask the leader)" : `Close ${b.area}`} until ${fmtClock(b.end)}${b.notes && b.notes.length ? ` (also: ${b.notes.join("; ")})` : ""}`
        }))).concat(c.lead && !c.block1030.some(b => b.name === c.lead) && (res.people.find(p => p.name === c.lead) || {}).shiftEnd > W1 ? [{ who: c.lead, text: `${c.lead}: Lead the close until ${fmtClock(W1 + 30)}` }] : [])
            .concat((res.sessions || []).filter(x => x.start === W1).map(x => ({ who: x.trainee, also: [x.trainer], text: `Training: ${x.trainee} on ${x.pos} with ${x.trainer} until ${fmtClock(x.end)}` }))) });
    }
    return blocks;
}

// One person's day: where they are each block, covers, tasks, break, when they're off
// A trainee isn't on the roster, so their "shift" is their training time (catering-only people: their catering)
function traineeAsPerson(res, name) {
    const mine = (res.sessions || []).filter(x => x.trainee === name);
    if (!mine.length) {
        const cat = (res.tasks || []).filter(k => k.name === name && k.offRoster);
        if (!cat.length) return null;
        return { name, shiftStart: Math.min(...cat.map(k => k.start)), shiftEnd: Math.max(...cat.map(k => k.back || k.end)) };
    }
    return { name, shiftStart: Math.min(...mine.map(x => x.fullStart)), shiftEnd: Math.max(...mine.map(x => x.fullEnd)) };
}

function traineeBlocks(res, name) {
    const mine = (res.sessions || []).filter(x => x.trainee === name).sort((a, b) => a.start - b.start);
    const blocks = [];
    let last = null;
    const push = (t, text) => { if (text !== last) { blocks.push({ t, lines: [{ text }] }); last = text; } };
    mine.forEach(x => {
        for (let t = x.start; t < x.end; t += STEP) {
            const br = res.breaks.find(b => b.name === name && b.start <= t && t < b.end);
            const tbr = res.breaks.find(b => b.name === x.trainer && b.start <= t && t < b.end);
            if (br) push(t, `Break until ${fmtClock(br.end)}`);
            else if (tbr && tbr.kind === "merge") push(t, `Train with ${tbr.mergeWith} until ${fmtClock(tbr.end)}`);
            else if (tbr && tbr.kind === "forced") push(t, `Wait for ${x.trainer} (on break) until ${fmtClock(tbr.end)}`);
            else if (tbr && tbr.cover) push(t, `${x.pos} with ${tbr.cover} (${x.trainer} on break) until ${fmtClock(tbr.end)}`);
            else push(t, `${x.pos} with ${x.trainer}`);
        }
        if (!mine.some(y => y !== x && y.start === x.end)) push(x.end, "Training ends");
    });
    return blocks;
}

function personBlocks(res, name) {
    const p = res.people.find(x => x.name === name);
    if (!p) {
        if ((res.sessions || []).some(x => x.trainee === name)) return traineeBlocks(res, name);
        // here just for catering
        return res.tasks.filter(k => k.name === name && k.offRoster).sort((a, b) => a.start - b.start).flatMap(k => [
            { t: k.start, lines: [{ text: k.type === "delivery" ? `${k.start < k.leaves ? "Prep catering delivery — leave at " + fmtClock(k.leaves) : "Leave on delivery"}` : `Catering due ${fmtClock(k.deadline)}` }] },
            ...(k.type === "delivery" && k.start < k.leaves ? [{ t: k.leaves, lines: [{ text: `Out on delivery — back ~${fmtClock(k.back)}` }] }] : []),
            { t: k.type === "delivery" ? k.back : k.end, lines: [{ text: "Done" }] }
        ]);
    }
    const [, W1] = res.window;
    const label = t => {
        const br = res.breaks.find(b => b.name === name && b.start <= t && t < b.end);
        if (br) return `Break until ${fmtClock(br.end)}`;
        const k = res.tasks.find(x => x.name === name && x.start <= t && t < x.end);
        if (k && k.inPlace) return `${k.pos} + clean the ice bin until ${fmtClock(k.end)}`;
        const tses = (res.sessions || []).find(x => x.closing && x.trainer === name && x.start <= t && t < x.end);
        const tr = tses ? ` — training ${tses.trainee}` : "";
        if (k && k.type === "closing") {
            if (k.area === "Lead") return `Lead the close until ${fmtClock(k.end)}`;
            if (/^Closing: help /.test(k.label)) return `Help ${k.area.replace(/ \(help (.+)\)$/, " with $1")} until ${fmtClock(k.end)}${tr}`;
            const also = k.notes && k.notes.length ? ` (also: ${k.notes.join("; ")})` : "";
            if (k.steps && k.steps.length) return t < k.steps[1].at ? `Close ${k.steps[0].label} until ${fmtClock(k.steps[1].at)}${tr}` : `Close ${k.steps[1].label} until ${fmtClock(k.end)}${tr}${also}`;
            return `Close ${k.area} until ${fmtClock(k.end)}${tr}${also}`;
        }
        if (k && k.type === "catering" && k.food !== null && !k.merged) return `Catering — put the food in, until ${fmtClock(k.end)}`;
        if (k && k.type === "catprep") return `Catering supplies for ${fmtClock(k.deadline)} order — until ${fmtClock(k.start + k.mins)}`;
        if (k && k.type === "delivery") return t < k.leaves ? `Prep catering delivery — leave at ${fmtClock(k.leaves)}` : `Out on delivery — back ~${fmtClock(k.back)}`;
        if (k) return `${k.label} until ${fmtClock(k.end)}`;
        const A = res.actual || res.positions;
        for (const pos of POSITIONS.map(x => x.name)) {
            const seg = segAt(A[pos], t);
            if (seg && seg.name === name) {
                const owner = segAt(res.positions[pos], t);
                if (owner && owner.name !== name) {
                    const onBreak = res.breaks.some(b => b.name === owner.name && b.start <= t && t < b.end);
                    const onTask = res.tasks.find(x => x.name === owner.name && x.start <= t && t < x.end);
                    return `Cover ${pos} for ${owner.name}${onBreak ? "'s break" : onTask ? ` (${onTask.label})` : ""}`;
                }
                const ses = (res.sessions || []).find(x => x.trainer === name && x.start <= t && t < x.end);
                return ses ? `${pos} — training ${ses.trainee}` : pos;
            }
        }
        return "Float / run breaks";
    };
    // Every change spelled out: who they replace, who takes over the spot they leave, who covers them
    const A = res.actual || res.positions;
    const ORDER = POSITIONS.map(x => x.name);
    const whereAt = t => ORDER.find(pos => { const sg = segAt(A[pos], t); return sg && sg.name === name; }) || null;
    const whoAt = (pos, t) => { const sg = segAt(A[pos], t); return sg ? sg.name : null; };
    const onSpot = l => ORDER.some(pos => l === pos || l.startsWith(pos + " —") || l.startsWith(pos + " +"));
    const blocks = [];
    let last = null;
    for (let t = p.start; t < p.end; t += STEP) {
        const l = label(t);
        if (l === last) continue;
        const now = whereAt(t), was = t > p.start ? whereAt(t - STEP) : null;
        let text = l;
        const extra = [];
        if (now && now !== was && onSpot(l)) {
            const x = t > p.start || t > res.window[0] ? whoAt(now, t - STEP) : null;
            // "back" only when it's their own spot from before (returning from a break, task or cover)
            const back = t > p.start && last && !onSpot(last) && last !== "Float / run breaks"
                && (res.positions[now] || []).some(sg => sg.name === name && sg.from < t);
            const verb = t === p.start ? "Start on " : back ? "Back on " : "Move to ";
            text = verb + l + (x && x !== name ? (back ? ` (takes it back from ${x})` : ` (replaces ${x})`) : "");
        }
        if (was && was !== now) {
            const y = whoAt(was, t);
            // the person they were covering for is back
            const yBack = y && (res.positions[was] || []).some(sg => sg.name === y && sg.from < t && t <= sg.to)
                && (res.breaks.some(b => b.name === y && b.end === t) || res.tasks.some(k => k.name === y && k.end === t));
            if (!now) text += y ? ` — ${y} covers ${was}` : ` — ${was} closes`;      // break, task or floating
            else extra.push(yBack ? `${y} is back on ${was}` : y ? `${y} takes over ${was}` : `${was} closes`);
        }
        blocks.push({ t, lines: [{ text }].concat(extra.map(e => ({ text: e }))) });
        last = l;
    }
    const shiftEnd = p.shiftEnd ?? p.end;
    // who takes their spot when they leave (before close)
    const offNote = endT => {
        if (endT >= res.window[1]) return "";
        const lp = whereAt(endT - STEP), y = lp ? whoAt(lp, endT) : null;
        return lp ? (y ? ` — ${y} takes over ${lp}` : ` — ${lp} closes`) : "";
    };
    if (res.daypart === "AM" && shiftEnd > toMin(DAYPART_SPLIT)) {
        // the AM lineup's last step (2:00) only shows the handover, so their AM part ends at 2:00
        const split = toMin(DAYPART_SPLIT);
        if (blocks.length && blocks[blocks.length - 1].t >= split) blocks.pop();
        blocks.push({ t: split, lines: [{ text: "Continues on the PM lineup" }] });
    }
    else {
        const c = res.closing;
        const c10 = c && c.block1030.find(b => b.name === name);
        if (c10) {
            const t10 = (res.sessions || []).find(x => x.closing && x.trainer === name && x.start >= c10.start);
            blocks.push({ t: c10.start, lines: [{ text: `${c10.help ? "Help close (ask the leader)" : `Close ${c10.area}`} until ${fmtClock(c10.end)}${t10 ? ` — training ${t10.trainee}` : ""}${c10.notes && c10.notes.length ? ` (also: ${c10.notes.join("; ")})` : ""}` }] });
            blocks.push({ t: c10.end, lines: [{ text: "Off" }] });
        } else if (c && c.lead === name && shiftEnd > W1) {
            blocks.push({ t: W1, lines: [{ text: `Lead the close until ${fmtClock(shiftEnd)}` }] });
            blocks.push({ t: shiftEnd, lines: [{ text: "Off" }] });
        }
        else blocks.push({ t: Math.min(shiftEnd, toMin(STORE_HOURS.close)), lines: [{ text: "Off" + offNote(Math.min(shiftEnd, toMin(STORE_HOURS.close))) }] });
    }
    return blocks;
}

function breakdownText(res, name) {
    const blocks = name ? personBlocks(res, name) : breakdownBlocks(res);
    const p = name && (res.people.find(x => x.name === name) || traineeAsPerson(res, name));
    const head = name
        ? `${name} — ${res.daypart} ${shortDate(res.date)}${p ? ` · shift ${fmtClock(p.shiftStart ?? p.start)} – ${fmtClock(p.shiftEnd ?? p.end)}` : ""}`
        : `${res.daypart} Lineup — ${prettyDate(res.date)}`;
    return [head, ""].concat(blocks.flatMap(b => [fmtClock(b.t)].concat(b.lines.map(l => l.text)).concat([""]))).join("\n").trim() + "\n";
}

let breakdownFor = null;
function openBreakdown(name) {
    if (!result) return;
    breakdownFor = name || null;
    const blocks = breakdownFor ? personBlocks(result, breakdownFor) : breakdownBlocks(result);
    const p = breakdownFor && (result.people.find(x => x.name === breakdownFor) || traineeAsPerson(result, breakdownFor));
    document.getElementById("breakdownTitle").innerText = breakdownFor ? `${breakdownFor}'s Breakdown` : "Time Breakdown";
    document.getElementById("breakdownBody").innerHTML = `
        <p class="sheet-help" style="margin-top:0; margin-bottom:0.8rem;">${breakdownFor
            ? `Shift ${p ? fmtClock(p.shiftStart ?? p.start) + " – " + fmtClock(p.shiftEnd ?? p.end) : ""} · ${result.daypart} ${shortDate(result.date)}`
            : `Every change, in order`}</p>
        <div class="bd-actions">
            <button type="button" class="btn-dark" onclick="copyBreakdown()">Copy</button>
            <button type="button" class="btn-secondary" onclick="downloadBreakdown()">Download .txt</button>
            ${breakdownFor ? "" : `<button type="button" class="btn-secondary" onclick="exportPoster('download')">Picture with lineup</button>
            <button type="button" class="btn-secondary" onclick="exportPoster('print')">Print with lineup</button>`}
            ${navigator.share ? `<button type="button" class="btn-secondary" onclick="shareBreakdown()">${ICON.share} Share</button>` : ""}
        </div>
        <div class="bd-list">${blocks.map(b => `
            <div class="bd-block">
                <div class="bd-time">${fmtClock(b.t)}</div>
                ${b.lines.map(l => `<div class="bd-line ${/^Break/.test(l.text) ? "brk" : ""}">${esc(l.text)}</div>`).join("")}
            </div>`).join("") || `<p class="sheet-help">Nothing scheduled.</p>`}
        </div>`;
    document.getElementById("breakdownModal").classList.add("active");
}
function closeBreakdown() { document.getElementById("breakdownModal").classList.remove("active"); }

async function copyBreakdown() {
    const text = breakdownText(result, breakdownFor);
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
        const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (err) {} ta.remove();
    }
    showStatusMessage("Breakdown copied.", "success", 2500);
}
function downloadBreakdown() {
    const who = breakdownFor ? "-" + breakdownFor.replace(/[^a-z0-9]+/gi, "-") : "";
    downloadBlob(new Blob([breakdownText(result, breakdownFor)], { type: "text/plain" }), `${fileBase()}-breakdown${who}.txt`);
}
async function shareBreakdown() {
    try { await navigator.share({ title: breakdownFor ? `${breakdownFor}'s breakdown` : `${result.daypart} lineup breakdown`, text: breakdownText(result, breakdownFor) }); }
    catch (e) { if (!e || e.name !== "AbortError") copyBreakdown(); }
}

async function copyText() {
    if (!result) return;
    const text = lineupText(result);
    try {
        await navigator.clipboard.writeText(text);
    } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (err) {}
        ta.remove();
    }
    showStatusMessage("Lineup text copied.", "success", 2500);
}

function downloadText() {
    if (!result) return;
    downloadBlob(new Blob([lineupText(result)], { type: "text/plain" }), fileBase() + ".txt");
}

function downloadLineupFile() {
    if (!result) return;
    const data = { app: "lineup-generator", v: 1, state, result };
    downloadBlob(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), fileBase() + ".lineup");
}

// FreeMind .mm - each chain is nested so it reads left to right like the on-screen map
function downloadMindMap() {
    if (!result) return;
    const x = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const groups = mapGroups(result);
    let out = `<map version="1.0.1">\n<node TEXT="${x(`Lineup ${result.daypart} ${shortDate(result.date)}`)}">\n`;
    groups.forEach((g, gi) => {
        const G = GROUPS[g.key];
        out += `<node TEXT="${x(G.label)}" POSITION="right" COLOR="${G.color}" BACKGROUND_COLOR="#ffffff">\n<edge COLOR="${G.color}" WIDTH="2"/>\n`;
        const rowOut = r => {
            out += `<node TEXT="${x(r.label)}">\n`;
            r.chain.forEach(c => { out += `<node TEXT="${x(c.text)}">\n`; });
            r.chain.forEach(() => { out += `</node>\n`; });
            out += `</node>\n`;
        };
        if (g.branched) {
            // Breaks: time -> person going on break -> person covering
            let open = null;
            g.rows.forEach(r => {
                if (r.branch !== open) {
                    if (open !== null) out += `</node>\n`;
                    out += `<node TEXT="${x(r.branch)}">\n`;
                    open = r.branch;
                }
                rowOut(r);
            });
            if (open !== null) out += `</node>\n`;
        } else {
            g.rows.forEach(rowOut);
        }
        out += `</node>\n`;
    });
    out += `</node>\n</map>\n`;
    downloadBlob(new Blob([out], { type: "application/x-freemind" }), fileBase() + ".mm");
}

function importFile(input) {
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        let o;
        try { o = JSON.parse(reader.result); } catch (e) { showStatusMessage("That file isn't a lineup file.", "error"); return; }
        if (!o || !o.state || !Array.isArray(o.state.roster)) { showStatusMessage("That file isn't a lineup file.", "error"); return; }
        applyLoadedLineup(o.state, o.result || null, `Imported ${file.name}`);
        closeExport();
    };
    reader.readAsText(file);
}

// Same day = show exactly what was saved. Different day = reuse the roster for today.
function applyLoadedLineup(loadedState, loadedResult, label, savedId) {
    saveDraftNow();
    const dp = loadedState.daypart === "AM" ? "AM" : "PM";
    const base = newState(dp);
    const sameDay = loadedState.date === todayIso();
    state = upgradeState({ ...base, ...loadedState, date: todayIso(), daypart: dp, savedId: savedId || null }, dp);
    state.breakOverrides = sameDay ? (loadedState.breakOverrides || {}) : {};
    state.taskOverrides = sameDay ? (loadedState.taskOverrides || {}) : {};
    if (!sameDay) { state.lock = null; state.caterings = []; state.trainings = []; state.moves = []; state.closing.swaps = []; state.roster = state.roster.map(r => ({ ...r, calledOff: false })); }
    state.caterings = state.caterings || []; state.trainings = state.trainings || [];
    daypart = dp;
    document.querySelectorAll(".am-pm-btn").forEach(b => b.classList.toggle("active", b.dataset.dp === dp));
    if (sameDay && loadedResult) { result = loadedResult; dirty = false; }
    else { generate(); }
    saveDraftNow();
    pendingSaved = null;
    focusName = null;
    showStatusMessage(sameDay ? `${label}.` : `${label} from ${shortDate(loadedState.date)} — rebuilt for today.`, "success", 5000);
    updateHero();
    setView(result ? "lineup" : "roster");
}

// =====================================================================
// SAVE / LOAD WITH SHEETS
// =====================================================================
let savingToSheets = false;
async function saveToSheets() {
    if (!result || savingToSheets) return;
    if (!lineupFormReady()) { showStatusMessage("Saving to Sheets isn't set up yet — add the form IDs to LINEUP_FORM in the code.", "error", 8000); return; }
    const by = saverName();
    if (!by) return;
    savingToSheets = true;
    const btn = document.getElementById("saveSheetsBtn");
    btn.disabled = true;
    btn.firstChild.textContent = "Saving...";

    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    let payload = JSON.stringify({ id, state: { ...state, savedId: id }, result });
    if (payload.length > 45000) payload = JSON.stringify({ id, state: { ...state, savedId: id } }); // stays under a Sheets cell
    const form = {};
    form[LINEUP_FORM.daypartEntry] = state.daypart;
    form[LINEUP_FORM.dateEntry] = state.date;
    form[LINEUP_FORM.dataEntry] = payload;
    form[LINEUP_FORM.byEntry] = by;

    const landed = async () => {
        for (let i = 0; i < 4; i++) {
            await new Promise(r => setTimeout(r, 2500));
            const list = await fetchSavedLineups();
            if (list && list.some(x => x.id === id)) return true;
        }
        return false;
    };
    await submitToGoogleForm(LINEUP_FORM.formId, form);
    let ok = await landed();
    if (!ok) { await submitToGoogleForm(LINEUP_FORM.formId, form); ok = await landed(); }

    btn.disabled = false;
    btn.firstChild.textContent = "Save to Sheets";
    savingToSheets = false;
    if (!ok) {
        showStatusMessage("The lineup did NOT save — Google never received it. Check your connection and that the form's questions aren't Required, then try again.", "error", 12000);
        return;
    }
    state.savedId = id;
    pendingSaved = null;
    saveDraftNow();
    renderSavedBanner();
    showStatusMessage(`${state.daypart} lineup saved to Sheets.`, "success", 4000);
}

async function loadFromSheets() {
    if (!lineupFormReady()) { showStatusMessage("Loading from Sheets isn't set up yet — add the form IDs to LINEUP_FORM in the code.", "error", 8000); return; }
    showStatusMessage("Checking Sheets...", "info", 3000);
    const s = await findSaved(daypart, todayIso());
    if (s === undefined) { showStatusMessage("Couldn't reach the lineup sheet.", "error"); return; }
    if (!s) { showStatusMessage(`No ${daypart} lineup has been saved today.`, "warning"); return; }
    if (state.roster.length && s.id !== state.savedId && !confirm(`Replace your current ${daypart} roster with the one ${s.by || "a leader"} saved?`)) return;
    applyLoadedLineup(s.state, s.result, `Loaded the lineup ${s.by || "a leader"} saved`, s.id);
    closeExport();
}

async function checkSavedLineup() {
    if (!lineupFormReady() || !state) return;
    const dp = daypart;
    if (dp === "PM") {
        const am = await findSaved("AM", todayIso());
        const h = am && am.result && am.result.handover ? { handover: am.result.handover, deferBreaks: am.result.deferBreaks || [] } : null;
        if (h && JSON.stringify(h) !== JSON.stringify(sheetAmHandover)) {
            sheetAmHandover = h;
            if (state.roster.length && !rosterProblems() && daypart === "PM") { generate(); renderAll(); }
        }
    }
    const s = await findSaved(dp, todayIso());
    if (!s || dp !== daypart || s.id === state.savedId) return;
    if (!state.roster.length) {
        applyLoadedLineup(s.state, s.result, `Loaded the lineup ${s.by || "a leader"} saved`, s.id);
    } else {
        pendingSaved = s;
        renderSavedBanner();
    }
}

function renderSavedBanner() {
    document.querySelectorAll(".saved-slot").forEach((slot, i) => {
        // On wide screens show it once (above the roster), not in both columns
        if (!pendingSaved || pendingSaved.state.daypart !== daypart) { slot.innerHTML = ""; return; }
        slot.innerHTML = `<div class="saved-banner">${esc(pendingSaved.by || "A leader")} saved a different ${daypart} lineup to Sheets.
            <button type="button" onclick="applyPendingSaved()">Load it</button>
            <button type="button" class="x" title="Dismiss" onclick="pendingSaved=null; renderSavedBanner()">${ICON.x}</button></div>`;
    });
}

function applyPendingSaved() {
    const s = pendingSaved;
    if (!s) return;
    applyLoadedLineup(s.state, s.result, `Loaded the lineup ${s.by || "a leader"} saved`, s.id);
}

function openRatings() {
    const body = document.getElementById("ratingsBody");
    const names = staffNameList();
    const onRoster = state ? new Set(state.roster.map(r => r.name)) : new Set();
    const sorted = names.slice().sort((a, b) => (onRoster.has(b) - onRoster.has(a)) || a.localeCompare(b));
    if (!sorted.length) {
        body.innerHTML = `<p class="sheet-help">Staff list hasn't loaded yet. Tap &#8635; to try again.</p>`;
    } else {
        body.innerHTML = `
            <p class="sheet-help" style="margin-top:0; margin-bottom:0.75rem;">1 = needs work, 5 = ace. Edit these in the staff sheet.</p>
            <div class="ratings-scroll"><table class="ratings-table">
                <thead><tr><th>Name</th>${SKILLS.map(s => `<th>${s}</th>`).join("")}</tr></thead>
                <tbody>${sorted.map(n => `<tr><td>${esc(n)}${onRoster.has(n) ? " &#9679;" : ""}</td>${SKILLS.map(s => {
                    const v = RATINGS[n] && RATINGS[n][s];
                    return `<td><span class="rt ${v ? "rt-" + v : "rt-none"}">${v || "–"}</span></td>`;
                }).join("")}</tr>`).join("")}</tbody>
            </table></div>
            <p class="sheet-help">${esc(ratingSource)}</p>`;
    }
    document.getElementById("ratingsModal").classList.add("active");
}
