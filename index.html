<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#001b35">
    <title>Lineup Builder</title>
    <style>
        @font-face {
            font-family: 'Apercu Regular Pro';
            src: url('apercu_regular_pro.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --navy-950: #001b35;
            --navy-900: #002a4f;
            --navy-800: #003d73;
            --navy-700: #044e8f;
            --gold: #f59e0b;
            --gold-hi: #fbbf24;
            --gold-soft: #fef3c7;
            --ink: #1e293b;
            --muted: #5C768D;
            --line: #e1e8f0;
            --line-strong: #c7d3e0;
            --surface: #ffffff;
            --canvas: #edf1f6;
            --tint: #f5f8fb;
            --radius: 18px;
            --shadow-sm: 0 1px 2px rgba(0, 27, 53, 0.06), 0 2px 6px rgba(0, 27, 53, 0.06);
            --shadow-md: 0 12px 32px -12px rgba(0, 27, 53, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--canvas);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        input, select, textarea, button { font-family: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        svg { flex-shrink: 0; }

        /* ---------- App bar ---------- */
        .appbar { background: var(--navy-950); color: #fff; position: sticky; top: 0; z-index: 60; }
        .appbar-inner {
            max-width: 1500px; margin: 0 auto; padding: 0.65rem 1.5rem;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
        }
        .brand { display: flex; align-items: center; gap: 0.7rem; }
        .brand-mark {
            width: 36px; height: 36px; border-radius: 11px; background: var(--gold); color: var(--navy-950);
            display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }
        .brand-name { font-weight: 800; font-size: 1.08rem; letter-spacing: -0.01em; line-height: 1; }
        .brand-name small { display: block; font-weight: 600; font-size: 0.66rem; color: #8ea6bf; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 0.25rem; }

        .dp-switch { display: flex; background: rgba(255, 255, 255, 0.08); border-radius: 999px; padding: 3px; gap: 2px; }
        .am-pm-btn {
            border: none; background: transparent; color: #a9bdd1; font-weight: 700; font-size: 0.9rem;
            padding: 0.45rem 1rem; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
            transition: background 0.2s, color 0.2s;
        }
        .am-pm-btn:hover { color: #fff; }
        .am-pm-btn.active { background: var(--gold); color: var(--navy-950); }

        .appbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.2rem; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 11px; border: none; background: transparent; color: #c6d5e4;
            display: grid; place-items: center; cursor: pointer; transition: background 0.15s, color 0.15s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        /* ---------- Header band ---------- */
        .hero {
            background:
                radial-gradient(1200px 300px at 85% -40%, rgba(245, 158, 11, 0.16), transparent 60%),
                linear-gradient(180deg, var(--navy-800), var(--navy-900));
            color: #fff; padding: 1.75rem 1.5rem 4.75rem;
        }
        .hero-inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; }
        .eyebrow { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-hi); }
        .hero h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.35rem; line-height: 1.1; }
        .hero-sub { color: #aebfd1; font-size: 0.92rem; margin-top: 0.4rem; }
        .view-tabs { display: flex; gap: 0.25rem; background: rgba(0, 0, 0, 0.22); padding: 4px; border-radius: 13px; }
        .nav-tab {
            display: flex; align-items: center; gap: 0.5rem; border: none; background: transparent; color: #c3d2e1;
            padding: 0.6rem 1.15rem; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
        }
        .nav-tab:hover { color: #fff; }
        .nav-tab.active { background: #fff; color: var(--navy-900); }
        .tab-count { background: var(--gold); color: var(--navy-950); font-size: 0.72rem; font-weight: 800; border-radius: 999px; padding: 0.05rem 0.45rem; min-width: 1.3rem; text-align: center; }
        .tab-count:empty { display: none; }

        /* ---------- Workspace ---------- */
        .workspace { max-width: 1500px; margin: -3.25rem auto 0; padding: 0 1.5rem 3rem; position: relative; }
        body.wide .workspace { display: grid; grid-template-columns: minmax(380px, 440px) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
        body.wide .view-tabs { display: none; }
        body.wide .people { max-height: 52vh; overflow-y: auto; margin-right: -0.5rem; padding-right: 0.5rem; }
        body.wide .lineup-lower { grid-template-columns: 1.35fr 1fr; }

        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 1.25rem; }
        .card-head { display: flex; align-items: center; gap: 0.8rem; padding: 1.15rem 1.3rem 0.35rem; flex-wrap: wrap; }
        .card-head .push { margin-left: auto; }
        .card-head > .step + div { flex: 1 1 12rem; min-width: 0; }
        .card-head.nowrap { flex-wrap: nowrap; }
        .card-head.nowrap > div { min-width: 0; }
        .card-head.nowrap .count-pill { white-space: nowrap; flex-shrink: 0; }
        .step {
            width: 30px; height: 30px; border-radius: 9px; background: var(--navy-900); color: var(--gold-hi);
            display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
        }
        .card-title { font-size: 1.08rem; font-weight: 800; color: var(--navy-900); letter-spacing: -0.01em; }
        .card-sub { color: var(--muted); font-size: 0.84rem; margin-top: 0.1rem; }
        .card-body { padding: 0.85rem 1.3rem 1.3rem; }
        .count-pill { background: var(--gold-soft); color: #92400e; font-weight: 800; font-size: 0.78rem; padding: 0.3rem 0.7rem; border-radius: 999px; }
        .stale { color: #b45309; font-weight: 700; }

        /* ---------- Fields ---------- */
        .field {
            width: 100%; background: var(--tint); border: 1.5px solid var(--line); border-radius: 13px;
            padding: 0.8rem 0.95rem; font-size: 1rem; color: var(--ink); transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .time-input {
            background: var(--tint); border: 1.5px solid var(--line); border-radius: 10px;
            padding: 0.45rem 0.55rem; font-size: 0.95rem; color: var(--ink); min-width: 0;
        }
        .field:focus, .time-input:focus { outline: none; border-color: var(--gold); background: #fff; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18); }
        .search-field { position: relative; }
        .search-field > svg { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
        .search-field .field { padding-left: 2.7rem; }

        .suggest-list {
            display: none; position: fixed; max-height: 260px; overflow-y: auto; background: #fff; border-radius: 14px;
            box-shadow: var(--shadow-md), 0 0 0 1px var(--line); z-index: 2000; padding: 5px;
        }
        .suggest-item { padding: 0.62rem 0.75rem; border-radius: 9px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-weight: 700; color: var(--ink); }
        .suggest-item small { color: var(--muted); font-weight: 500; font-size: 0.8rem; text-align: right; }
        .suggest-item:hover, .suggest-item.highlighted { background: var(--gold-soft); }

        .hint-line { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 0.85rem 0 0.4rem; color: var(--muted); font-size: 0.86rem; }
        .shift-pair { display: inline-flex; align-items: center; gap: 0.4rem; }

        /* ---------- People ---------- */
        .people { margin-top: 0.6rem; }
        .person {
            display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "chip meta toggle" "times times times";
            gap: 0.55rem 0.6rem; align-items: center; padding: 0.75rem 0; border-top: 1px solid var(--line);
        }
        .person .hc-chip { grid-area: chip; justify-self: start; max-width: 100%; }
        .person .shift-meta { grid-area: meta; }
        .person .mini-toggle { grid-area: toggle; }
        .person .shift-times { grid-area: times; }
        .person.bad .time-input { border-color: #ef4444; background: #fef2f2; }
        .hc-chip {
            display: inline-flex; align-items: center; gap: 0.5rem; background: var(--navy-900); color: #fff;
            border-radius: 999px; padding: 0.22rem 0.25rem 0.22rem 0.22rem; font-weight: 700; font-size: 0.95rem; min-width: 0;
        }
        .chip-avatar { width: 27px; height: 27px; border-radius: 50%; background: var(--gold); color: var(--navy-950); display: grid; place-items: center; font-size: 0.7rem; font-weight: 800; flex-shrink: 0; }
        .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 0.1rem; }
        .hc-chip-x { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-size: 0.68rem; cursor: pointer; color: #9fb3c8; flex-shrink: 0; }
        .hc-chip-x:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
        .shift-times { display: flex; align-items: center; gap: 0.45rem; color: var(--muted); font-size: 0.85rem; }
        .shift-times .time-input { flex: 1; }
        .shift-meta { font-size: 0.8rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
        .shift-meta .brk { color: #2563eb; }
        .mini-toggle {
            border: 1.5px solid var(--line-strong); background: #fff; color: var(--muted); border-radius: 8px;
            padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.76rem; cursor: pointer;
        }
        .mini-toggle:hover { border-color: var(--navy-800); color: var(--navy-800); }
        .mini-toggle.on { background: var(--navy-900); border-color: var(--navy-900); color: var(--gold-hi); }

        .add-box { margin-top: 0.75rem; padding: 0.85rem; background: var(--tint); border: 1.5px dashed var(--line-strong); border-radius: 14px; }
        .add-box .field { background: #fff; }
        .add-box .hint-line { margin-bottom: 0; }
        .person.off .hc-chip { background: #94a3b8; }
        .person.off .chip-name { text-decoration: line-through; }
        .person.off .shift-times { opacity: 0.45; pointer-events: none; }
        .off-tag { color: #b91c1c; }
        .lock-note { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin: 0 1.3rem 0.8rem; padding: 0.6rem 0.8rem; border-radius: 12px; background: var(--gold-soft); color: #78350f; font-size: 0.88rem; }
        .lock-note button { margin-left: auto; background: #fff; border: 1.5px solid #fcd34d; color: #78350f; border-radius: 8px; padding: 0.3rem 0.7rem; font-weight: 700; cursor: pointer; }
        .calllist { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .callrow { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.85rem; border-top: 1px solid var(--line); }
        .callrow:first-child { border-top: none; }
        .callrow > div { flex: 1; min-width: 0; }
        .callrow b { color: var(--navy-900); }
        .callrow.off { background: #fef2f2; }
        .callrow.off b { text-decoration: line-through; color: #b91c1c; }
        .callrow .switch.on { background: #b91c1c; }
        .callrow .switch.on i { background: #fff; }
        .sheet-foot { position: sticky; bottom: -1.4rem; background: #fff; margin: 0 -1.3rem -1.4rem; padding: 0.2rem 1.3rem 1.2rem; border-top: 1px solid var(--line); box-shadow: 0 -10px 20px -14px rgba(0, 27, 53, 0.4); }
        .callkeep { display: flex; align-items: center; gap: 0.9rem; margin-top: 0.85rem; padding: 0.85rem; border-radius: 14px; background: var(--tint); }
        .callkeep > div { flex: 1; }
        .callkeep b { color: var(--navy-900); }
        .empty-note { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; text-align: center; color: var(--muted); padding: 1.6rem 1rem; border: 1.5px dashed var(--line-strong); border-radius: 14px; margin-top: 0.6rem; font-size: 0.9rem; }
        .empty-note b { color: var(--navy-900); font-size: 0.98rem; }
        .empty-note svg { color: var(--line-strong); margin-bottom: 0.2rem; }

        .row-actions { display: flex; gap: 1.1rem; padding-top: 0.6rem; border-top: 1px solid var(--line); }
        .link-btn { background: none; border: none; color: var(--navy-700); font-weight: 700; font-size: 0.87rem; cursor: pointer; padding: 0.35rem 0.15rem; }
        .link-btn:hover { text-decoration: underline; }
        .link-btn.danger { color: #dc2626; }

        /* ---------- Tasks ---------- */
        .task { display: flex; gap: 0.9rem; padding: 0.95rem 0; border-top: 1px solid var(--line); }
        .task:first-child { border-top: none; padding-top: 0.15rem; }
        .task-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; }
        .task-icon.lemon { background: #fef9c3; color: #a16207; }
        .task-icon.sweep { background: #e0e7ff; color: #4338ca; }
        .task-icon.ice { background: #e0f2fe; color: #0369a1; }
        .task-icon.cater { background: #fce7f3; color: #be185d; }
        .task-icon.train { background: #ccfbf1; color: #0f766e; }
        .add-row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .add-row .grow { flex: 1; min-width: 9rem; }
        .item-row { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; padding: 0.5rem 0; border-top: 1px solid var(--line); }
        .item-row:first-child { border-top: none; }
        .time-input.sel { padding-right: 0.3rem; max-width: 100%; }
        .mini-label { color: var(--muted); font-size: 0.82rem; }
        .btn-dark.sm { padding: 0.45rem 0.9rem; }
        .hc-chip.trainee { background: #0f766e; }
        .cat-add .seg { margin-bottom: 0.15rem; }
        .cat-add .opt-help { margin-top: 0.45rem; }
        .time-input.num { width: 4.6rem; }
        .check-line { display: flex; align-items: center; gap: 0.45rem; font-size: 0.86rem; font-weight: 700; color: var(--navy-900); margin-top: 0.55rem; cursor: pointer; }
        .check-line input { width: 1.05rem; height: 1.05rem; accent-color: #0f2a4a; }
        .type-tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2rem 0.5rem; border-radius: 6px; background: #fce7f3; color: #be185d; }
        .type-tag.deliv { background: #ede9fe; color: #6d28d9; }
        .type-tag.extra { background: #e2e8f0; color: #334155; }
        .form-error { margin-top: 0.5rem; padding: 0.45rem 0.65rem; border-radius: 8px; background: #fef2f2; color: #b91c1c; font-size: 0.85rem; font-weight: 700; }
        .warn-tag { color: #b45309; font-size: 0.78rem; font-weight: 700; }
        .task-main { flex: 1; min-width: 0; }
        .task-name { font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; color: var(--navy-900); }
        .task-desc { color: var(--muted); font-size: 0.83rem; margin: 0.15rem 0 0.55rem; }
        .task-line { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.45rem; color: var(--muted); font-size: 0.88rem; }
        .times-inline { font-weight: 700; color: var(--navy-800); font-size: 0.82rem; }
        .icon-x { border: none; background: transparent; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
        .icon-x:hover { background: #fee2e2; color: #dc2626; }

        .switch { position: relative; width: 46px; height: 26px; border: none; border-radius: 999px; background: #cbd5e1; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
        .switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.2s, background 0.2s; }
        .switch.on { background: var(--navy-800); }
        .switch.on i { transform: translateX(20px); background: var(--gold); }

        /* ---------- Options ---------- */
        .opt { padding: 0.9rem 0; border-top: 1px solid var(--line); }
        .opt:first-child { border-top: none; padding-top: 0.15rem; }
        .opt-label { font-weight: 800; color: var(--navy-900); margin-bottom: 0.5rem; font-size: 0.95rem; }
        .opt-help { color: var(--muted); font-size: 0.83rem; margin-top: 0.5rem; line-height: 1.4; }
        .seg { display: inline-flex; background: var(--canvas); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
        .seg button { border: none; background: transparent; padding: 0.48rem 0.85rem; border-radius: 9px; font-weight: 700; font-size: 0.87rem; color: var(--muted); cursor: pointer; }
        .seg button:hover { color: var(--navy-900); }
        .seg button.on { background: #fff; color: var(--navy-900); box-shadow: var(--shadow-sm); }

        /* ---------- Buttons ---------- */
        .btn-primary {
            background: var(--gold); color: var(--navy-950); border: none; border-radius: 13px; padding: 0.95rem 1.4rem;
            font-weight: 800; font-size: 1.02rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
            box-shadow: 0 8px 18px -8px rgba(245, 158, 11, 0.8); transition: background 0.15s, transform 0.1s;
        }
        .btn-primary:hover { background: var(--gold-hi); }
        .btn-primary:active { transform: translateY(1px); }
        .btn-primary.block { width: 100%; }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-secondary, .btn-dark {
            border-radius: 10px; padding: 0.5rem 0.85rem; font-weight: 700; font-size: 0.87rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap;
        }
        .btn-secondary { background: #fff; border: 1.5px solid var(--line-strong); color: var(--navy-900); }
        .btn-secondary:hover { border-color: var(--navy-800); }
        .btn-secondary.on { background: var(--navy-900); border-color: var(--navy-900); color: var(--gold-hi); }
        .btn-dark { background: var(--navy-900); border: 1.5px solid var(--navy-900); color: #fff; }
        .btn-dark:hover { background: var(--navy-700); }
        .generate-bar { position: sticky; bottom: 0; padding: 0.4rem 0 1rem; background: linear-gradient(rgba(237, 241, 246, 0), var(--canvas) 40%); z-index: 5; }
        body.wide .generate-bar { position: static; background: none; padding-top: 0; }

        .saved-banner {
            background: var(--gold-soft); border: 1.5px solid #fcd34d; border-radius: 14px; padding: 0.7rem 0.9rem; margin-bottom: 1.1rem;
            display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; font-size: 0.9rem; font-weight: 600; color: #78350f; box-shadow: var(--shadow-sm);
        }
        .saved-banner button { background: var(--navy-900); color: #fff; border: none; border-radius: 8px; padding: 0.4rem 0.8rem; font-weight: 700; cursor: pointer; }
        .saved-banner button.x { background: transparent; color: #78350f; margin-left: auto; padding: 0.3rem 0.5rem; }

        /* ---------- Lineup ---------- */
        .map-toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; padding: 0.6rem 1.3rem 0.9rem; }
        .toolbar-spacer { flex: 1; }
        .zoom-group { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: #fff; }
        .zoom-group button { border: none; background: transparent; padding: 0.45rem 0.75rem; font-weight: 800; cursor: pointer; color: var(--navy-900); font-size: 0.87rem; }
        .zoom-group button + button { border-left: 1px solid var(--line); }
        .zoom-group button.on { background: var(--navy-900); color: var(--gold-hi); }
        .legend { display: flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; color: var(--muted); padding: 0 1.3rem 0.7rem; }
        .legend i { width: 0.85rem; height: 0.85rem; border-radius: 0.25rem; border: 2px solid var(--gold); background: rgba(245, 158, 11, 0.2); }

        .focus-bar { display: none; margin: 0 1.3rem 0.8rem; background: var(--navy-950); color: #d7e2ec; border-radius: 12px; padding: 0.55rem 0.6rem 0.55rem 0.95rem; align-items: center; gap: 0.9rem; flex-wrap: wrap; font-size: 0.88rem; }
        .focus-bar.active { display: flex; }
        .focus-bar b { color: var(--gold-hi); }
        .focus-actions { margin-left: auto; display: flex; gap: 0.4rem; }
        .focus-bar .focus-actions button { margin-left: 0; }
        .focus-bar button.focus-bd { background: #fff; color: var(--navy-950); }
        .poster-view { position: fixed; inset: 0; z-index: 4000; background: #ffffff; display: none; padding: 12px; cursor: zoom-out; }
        .poster-view.active { display: flex; flex-direction: column; }
        .poster-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
        .poster-hint { text-align: center; color: #94a3b8; font-size: 0.8rem; padding-top: 6px; }
        .bd-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .bd-list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .bd-block { padding: 0.7rem 0.95rem; border-top: 1px solid var(--line); }
        .bd-block:first-child { border-top: none; }
        .bd-time { font-weight: 800; color: var(--navy-900); margin-bottom: 0.25rem; }
        .bd-line { font-size: 0.92rem; color: var(--ink); padding: 0.12rem 0 0.12rem 0.8rem; border-left: 3px solid var(--line-strong); margin: 0.15rem 0; }
        .bd-line.brk { border-left-color: #3b82f6; color: #1e40af; }
        .focus-bar button { margin-left: auto; background: var(--gold); color: var(--navy-950); border: none; border-radius: 8px; padding: 0.35rem 0.75rem; font-weight: 800; cursor: pointer; }

        .map-wrap {
            background-color: #f7f9fc;
            background-image: radial-gradient(#d3dde8 1.1px, transparent 1.1px);
            background-size: 18px 18px;
            border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
            overflow: auto; max-height: 74vh; -webkit-overflow-scrolling: touch;
        }
        .map-wrap svg { display: block; }
        .map-foot { color: var(--muted); font-size: 0.8rem; padding: 0.7rem 1.3rem 1rem; }
        .mm-node.clickable { cursor: pointer; }
        .mm-node.clickable:hover rect { filter: brightness(0.96); }
        #mapSvg path, #mapSvg .mm-node { transition: opacity 0.2s; }
        #mapSvg.focusing .mm-node { opacity: 0.16; }
        #mapSvg.focusing .mm-node.keep { opacity: 1; }
        #mapSvg.focusing .mm-node.focused rect { stroke: #001b35; stroke-width: 3.5; }
        #mapSvg.focusing path { opacity: 0.28; }

        .lineup-lower { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        .lineup-lower > .card { margin-bottom: 0; }
        .lineup-lower > div > .card:last-child { margin-bottom: 0; }
        .warn-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .warn-list li { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.65rem 0.8rem; border-radius: 11px; background: #fff7ed; color: #7c2d12; font-size: 0.9rem; line-height: 1.4; }
        .warn-list li::before { content: "!"; flex-shrink: 0; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--gold); color: var(--navy-950); font-weight: 900; font-size: 0.75rem; display: grid; place-items: center; margin-top: 0.05rem; }
        .warn-list li.ok { background: #ecfdf5; color: #065f46; }
        .warn-list li.ok::before { content: "\2713"; background: #10b981; color: #fff; }
        .break-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
        .break-row:first-child { border-top: none; padding-top: 0; }
        .break-row > div:first-child, .break-row > .task-icon + div { flex: 1; min-width: 9rem; }
        .break-row b { color: var(--navy-900); }
        .break-sub { color: var(--muted); font-size: 0.82rem; margin-top: 0.1rem; }
        .auto-tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; padding: 0.3rem 0.4rem; min-width: 3rem; text-align: center; }

        .empty-card { text-align: center; padding: 3.5rem 1.5rem; }
        .empty-art { width: 64px; height: 64px; border-radius: 18px; background: var(--navy-900); color: var(--gold-hi); display: grid; place-items: center; margin: 0 auto 1.1rem; }
        .empty-card h2 { font-size: 1.5rem; color: var(--navy-900); margin-bottom: 0.5rem; }
        .empty-card p { color: var(--muted); margin: 0 auto 1.4rem; max-width: 26rem; }

        /* ---------- Sheets (pop-ups) ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 27, 53, 0.55); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .sheet {
            background: #fff; border-radius: 22px; width: 94%; max-width: 640px; max-height: 88vh; overflow: auto;
            box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.55); transform: translateY(14px); transition: transform 0.25s;
        }
        .sheet.wide-sheet { max-width: 920px; }
        .modal-overlay.active .sheet { transform: none; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
        .sheet-head h3 { font-size: 1.15rem; font-weight: 800; color: var(--navy-900); }
        .sheet-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--canvas); cursor: pointer; color: var(--navy-900); display: grid; place-items: center; }
        .sheet-close:hover { background: var(--line-strong); }
        .sheet-body { padding: 1.2rem 1.3rem 1.4rem; }
        .sheet-help { color: var(--muted); font-size: 0.85rem; line-height: 1.45; margin-top: 0.4rem; }

        .export-group { margin-bottom: 1.2rem; }
        .export-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.55rem; }
        .export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.55rem; }
        .export-grid button {
            background: var(--tint); color: var(--navy-900); border: 1.5px solid var(--line); border-radius: 13px; padding: 0.8rem 0.9rem;
            font-weight: 800; cursor: pointer; font-size: 0.95rem; text-align: left; transition: border-color 0.15s, background 0.15s;
        }
        .export-grid button span { display: block; font-weight: 500; font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
        .export-grid button:hover { border-color: var(--gold); background: #fff; }
        .export-grid button:disabled { opacity: 0.45; cursor: not-allowed; }

        .ratings-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .ratings-table th, .ratings-table td { padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--line); text-align: center; }
        .ratings-table th { position: sticky; top: 0; background: var(--tint); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); z-index: 1; }
        .ratings-table td:first-child, .ratings-table th:first-child { text-align: left; font-weight: 700; white-space: nowrap; }
        .rt { display: inline-block; min-width: 1.7rem; padding: 0.18rem 0.3rem; border-radius: 0.4rem; font-weight: 800; }
        .rt-1 { background: #fee2e2; color: #b91c1c; } .rt-2 { background: #ffedd5; color: #c2410c; } .rt-3 { background: #f1f5f9; color: #334155; }
        .rt-4 { background: #dbeafe; color: #1d4ed8; } .rt-5 { background: #dcfce7; color: #15803d; } .rt-none { color: #a0aec0; }
        .ratings-scroll { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }

        /* ---------- Toast ---------- */
        #statusMessageBar {
            position: fixed; left: 50%; bottom: 1.25rem; transform: translate(-50%, 140%); z-index: 3000;
            background: var(--navy-950); color: #fff; padding: 0.75rem 1.15rem; border-radius: 14px; font-weight: 700; font-size: 0.92rem;
            box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.5); max-width: min(92vw, 560px); text-align: center;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.2s, visibility 0.3s;
        }
        #statusMessageBar.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
        #statusMessageBar.success { background: #065f46; }
        #statusMessageBar.error { background: #b91c1c; }
        #statusMessageBar.warning { background: var(--gold); color: var(--navy-950); }


        /* ---------- Responsive ---------- */
        @media (max-width: 900px) {
            .lineup-lower { grid-template-columns: 1fr; }
        }
        @media (max-width: 720px) {
            .appbar-inner { grid-template-columns: auto 1fr auto; padding: 0.55rem 0.9rem; gap: 0.6rem; }
            .brand-name { display: none; }
            .dp-switch { justify-self: center; }
            .am-pm-btn { padding: 0.42rem 0.8rem; }
            .icon-btn { width: 36px; height: 36px; }
            .hero { padding: 1.3rem 1rem 4.25rem; }
            .hero h1 { font-size: 1.6rem; }
            .view-tabs { width: 100%; }
            .nav-tab { flex: 1; justify-content: center; }
            .workspace { padding: 0 0.75rem 2rem; }
            .card-head { padding: 1rem 1rem 0.3rem; }
            .card-body { padding: 0.8rem 1rem 1.1rem; }
            .map-toolbar { padding: 0.5rem 1rem 0.8rem; }
            .legend, .map-foot { padding-left: 1rem; padding-right: 1rem; }
            .focus-bar { margin: 0 1rem 0.8rem; }
            .modal-overlay { align-items: flex-end; }
            #statusMessageBar { bottom: auto; top: 4.2rem; transform: translate(-50%, -12px); }
            #statusMessageBar.show { transform: translate(-50%, 0); }
            .sheet { width: 100%; max-width: none; border-radius: 22px 22px 0 0; max-height: 92vh; }
        }
        @media (max-width: 400px) {
            .am-pm-btn svg { display: none; }
        }
    </style>
</head>
<body>

<div id="statusMessageBar"></div>

<header class="appbar">
    <div class="appbar-inner">
        <div class="brand">
            <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="12" r="2.3" fill="currentColor" stroke="none"/><path d="M6.8 12H10M10 5.5v13M10 5.5h3.5M10 12h3.5M10 18.5h3.5"/><rect x="14" y="3.8" width="7" height="3.4" rx="1.4"/><rect x="14" y="10.3" width="7" height="3.4" rx="1.4"/><rect x="14" y="16.8" width="7" height="3.4" rx="1.4"/></svg></span>

            <button class="am-pm-btn active" data-dp="PM" onclick="setDaypart('PM')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>PM</button>

            <button class="icon-btn" onclick="openRatings()" title="Ratings" aria-label="Position ratings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg></button>
            <button class="icon-btn" onclick="openExport()" title="Save &amp; Share" aria-label="Save and share"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero-inner">
        <div>
            <div class="eyebrow" id="heroEyebrow">Lineup</div>
            <h1 id="heroTitle">&nbsp;</h1>
            <p class="hero-sub" id="heroSub"></p>
        </div>
        <nav class="view-tabs">
            <button class="nav-tab active" data-view="roster" onclick="setView('roster')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/></svg>Roster<span class="tab-count" id="tabCount"></span></button>
            <button class="nav-tab" data-view="lineup" onclick="setView('lineup')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="12" r="2"/><path d="M6.5 12H10M10 6v12M10 6h4M10 12h4M10 18h4"/><circle cx="17" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Lineup</button>
        </nav>

</section>

<main class="workspace">
    <div id="rosterPanel"></div>
    <div id="lineupPanel" style="display:none;"></div>
</main>

<!-- Save / Share -->
<div class="modal-overlay" id="exportModal" onclick="if(event.target===this) closeExport()">
    <div class="sheet">
        <div class="sheet-head">
            <h3>Save &amp; Share</h3>
            <button type="button" class="sheet-close" onclick="closeExport()" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

                    <button type="button" class="needs-result" onclick="closeExport(); exportPoster('screen')">Show on Screen<span>Full screen for a monitor</span></button>

<script>
// =====================================================================
// CONFIG
// =====================================================================

// Same staff sheet as the checklist tracker. Columns A-D stay as they are
// (Name, PIN, Role, House). Position ratings (1-5) go in columns E onward.
// With a header row, columns are matched by name (Register, Bagging, Drinks,
// Window, Desserts, Dining Room, Runner, Cash, iPOS). Without one, columns
// E-M are read in exactly that order. Blank = treated as a 3.
const STAFF_SHEET_ID = "1Y1alfXEMbRiIWTbllZTQ4_K4-O5bhTnOiRn8DxN5QqY";

// One Google Form for both day parts. Questions, in this order:
//   1) Daypart (short answer)   2) Business Date (short answer)
//   3) Lineup Data (paragraph)  4) Submitted By (short answer)
// None of them should be marked Required.
const LINEUP_FORM = {
    formId: "1FAIpQLSe-3emk_9kkkoi-P4-85VlmRPe0xTsI5cBgWxMPaqOHacdNUg",
    sheetId: "1oyJaf6VXIaHxZ-0Pk1FVZMNx7vwNORkQXcXoby4TvtM",
    daypartEntry: "entry.747672722",
    dateEntry: "entry.1849691723",
    dataEntry: "entry.348560586",
    byEntry: "entry.857096984"
};


// priority = the order positions are added as people become available
const POSITIONS = [
    { name: "Register 1",    group: "FC",      priority: 2,  skill: "Register" },
    { name: "Register 2",    group: "FC",      priority: 10, skill: "Register" },
    { name: "FC Bagger 1",   group: "FC",      priority: 5,  skill: "Bagging" },
    { name: "FC Bagger 2",   group: "FC",      priority: 9,  skill: "Bagging" },
    { name: "Runner",        group: "FC",      priority: 12, skill: "Runner" },
    { name: "Mobile Drinks", group: "FC",      priority: 4,  skill: "Drinks" },
    { name: "Dining Room",   group: "FC",      priority: 7,  skill: "Dining Room" },
    { name: "DT Bagger 1",   group: "DT",      priority: 1,  skill: "Bagging" },
    { name: "DT Bagger 2",   group: "DT",      priority: 11, skill: "Bagging" },
    { name: "DT Drinks",     group: "DT",      priority: 1,  skill: "Drinks" },
    { name: "Desserts",      group: "DT",      priority: 8,  skill: "Desserts" },
    { name: "Window 1",      group: "DT",      priority: 1,  skill: "Window" },
    { name: "Window 2",      group: "DT",      priority: 13, skill: "Window" },
    { name: "Cash",          group: "Outside", priority: 3,  skill: "Cash" },
    { name: "iPOS 1",        group: "Outside", priority: 6,  skill: "iPOS" },
    { name: "iPOS 2",        group: "Outside", priority: 6,  skill: "iPOS" },
    { name: "iPOS 3",        group: "Outside", priority: 14, skill: "iPOS" }
];
const POS_INFO = Object.fromEntries(POSITIONS.map(p => [p.name, p]));
const FILL_ORDER = POSITIONS.map((p, i) => ({ ...p, i }))
    .sort((a, b) => a.priority - b.priority || a.i - b.i)
    .map(p => p.name);

const SKILLS = ["Register", "Bagging", "Drinks", "Window", "Desserts", "Dining Room", "Runner", "Cash", "iPOS"];
const SKILL_ALIASES = {
    register: "Register", registers: "Register", reg: "Register", fc: "Register",
    bag: "Bagging", bags: "Bagging", bagging: "Bagging", bagger: "Bagging", baggers: "Bagging",
    drink: "Drinks", drinks: "Drinks", bev: "Drinks", beverages: "Drinks",
    window: "Window", windows: "Window",
    dessert: "Desserts", desserts: "Desserts",
    diningroom: "Dining Room", dining: "Dining Room", dr: "Dining Room", lobby: "Dining Room",
    runner: "Runner", running: "Runner", runners: "Runner",
    cash: "Cash", ipos: "iPOS", ipad: "iPOS", outside: "iPOS"
};

const GROUPS = {
    FC:       { label: "FC",       color: "#ef4444", text: "#ffffff" },
    DT:       { label: "DT",       color: "#f59e0b", text: "#1e293b" },
    Outside:  { label: "Outside",  color: "#16a34a", text: "#ffffff" },
    Breaks:   { label: "Breaks",   color: "#3b82f6", text: "#ffffff" },

const STEP = 15;           // minutes per scheduling slot
const BREAK_LEN = 30;
const BREAK_AFTER = 120;   // ideal break = 2 hours into the shift
const BREAK_MIN_SHIFT = 300; // breaks for shifts longer than 5 hours
const LUNCH_BLOCK = [720, 780]; // no breaks 12-1
// Busy meal periods. Sweeps, the ice bin and lemonade stay out of these when they can.
const RUSH_PERIODS = [["11:30", "13:30"], ["17:00", "19:00"]];
const SWEEP_EVERY = 240;   // parking lot sweep at least every 4 hours
// Positions are only filled while the store is open. Breaks still count from someone's real start time.
const STORE_HOURS = { open: "06:30", close: "22:00" };
// AM runs until the 2:00 handover, PM starts at 2:00
const DAYPART_SPLIT = "14:00";
// Never more than this many people on break at the same time
const MAX_BREAKS_AT_ONCE = 2;

// SMALL HELPERS
// =====================================================================
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toMin(hhmm) { if (!hhmm) return null; const m = String(hhmm).match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function hhmm(min) { min = ((min % 1440) + 1440) % 1440; return `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`; }
function fmtT(min) { min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min / 60), m = min % 60; const h12 = h % 12 || 12; return m ? `${h12}${String(m).padStart(2, "0")}` : `${h12}`; }
function fmtClock(min) { min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min / 60), m = min % 60; return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; }
function fmtRange(from, to, closeAt) { return `${fmtT(from)}-${to >= closeAt ? "" : fmtT(to)}`; }
function round15(m) { return Math.round(m / STEP) * STEP; }
function durLabel(min) { const h = min / 60; return `${Number.isInteger(h) ? h : h.toFixed(2).replace(/0$/, "")}h`; }
function businessDate() { return new Date(Date.now() - 4 * 3600 * 1000); }
function isoDate(d) { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function todayIso() { return isoDate(businessDate()); }
function prettyDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }); }
function shortDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" }); }
function shiftMinutes(r) { const s = toMin(r.start), e = toMin(r.end); if (s === null || e === null) return 0; let d = e - s; if (d <= 0) d += 1440; return d; }
function isPlaceholder(id) { return !id || String(id).includes("PASTE_"); }

function showStatusMessage(message, type = "info", duration = 4000) {
    const bar = document.getElementById("statusMessageBar");
    bar.innerText = message;

    bar.classList.add("show");
    if (window.statusTimeout) clearTimeout(window.statusTimeout);
    window.statusTimeout = setTimeout(() => { bar.classList.remove("show"); }, duration);
}
