function loadDefaults(dp) {
    try { const s = JSON.parse(localStorage.getItem("lineupDefaults:" + dp)); if (s) return { ...DAYPART_DEFAULTS[dp], ...s }; } catch (e) {}
    return { ...DAYPART_DEFAULTS[dp] };
}

function newState(dp) {
    const d = loadDefaults(dp);
    return {
        v: 1, date: todayIso(), daypart: dp, mode: d.mode || "balanced", runners: d.runners || "auto",
        roster: [], defaultShift: { start: d.start, end: d.end },
        lemonade: dp === "AM" ? [DAYPART_SPLIT] : [], sweep: { on: true }, ice: { on: !!d.iceOn },
        caterings: [], trainings: [], moves: [], rules: loadRules(),
        breakOverrides: {}, taskOverrides: {}, rotation: 0, lock: null, savedId: null,
        closing: { on: true, prefs: {}, swaps: [] }
    };
}

function loadRules() {
    try { const r = JSON.parse(localStorage.getItem("lineupRules")); if (r) return Object.assign({}, DEFAULT_RULES, r); } catch (e) {}
    return Object.assign({}, DEFAULT_RULES);
}
function saveRules(r) { try { localStorage.setItem("lineupRules", JSON.stringify(r)); } catch (e) {} }

function draftKey(dp) { return `lineupDraft:${todayIso()}:${dp}`; }

// A roster saved by an older version of the page may be missing newer parts — fill them in
function upgradeState(st, dp) {
    const base = newState(dp);
    const out = Object.assign({}, base, st || {});
    ["roster", "lemonade", "caterings", "trainings", "moves"].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
    ["breakOverrides", "taskOverrides"].forEach(k => { if (!out[k] || typeof out[k] !== "object") out[k] = {}; });
    out.sweep = Object.assign({}, base.sweep, out.sweep || {});
    out.ice = Object.assign({}, base.ice, out.ice || {});
    out.defaultShift = Object.assign({}, base.defaultShift, out.defaultShift || {});
    out.rules = Object.assign({}, DEFAULT_RULES, out.rules || {});
    out.closing = Object.assign({}, base.closing, out.closing || {});
    if (!out.closing.prefs || typeof out.closing.prefs !== "object") out.closing.prefs = {};
    if (!Array.isArray(out.closing.swaps)) out.closing.swaps = [];
    if (!MODES[out.mode]) out.mode = base.mode;
    return out;
}

function loadDraft(dp) {
    try {
        const raw = localStorage.getItem(draftKey(dp));
        if (raw) {
            const o = JSON.parse(raw);
            if (o && o.state) {
                const old = JSON.stringify(Object.keys(o.state).sort());
                state = upgradeState(o.state, dp);
                // a lineup built by an older version gets rebuilt so it has everything the page now shows
                const upgraded = old !== JSON.stringify(Object.keys(state).sort());
                result = upgraded ? null : (o.result || null);
                dirty = !result;
                return true;
            }
        }
    } catch (e) {}
    state = newState(dp); result = null; dirty = true;
    return false;
}

function saveDraftNow() {
    if (!state) return;
    try {
        localStorage.setItem(draftKey(state.daypart), JSON.stringify({ state, result }));
        localStorage.setItem("lineupDefaults:" + state.daypart, JSON.stringify({
            start: state.defaultShift.start, end: state.defaultShift.end,
            iceOn: state.ice.on, mode: state.mode, runners: state.runners
        }));
    } catch (e) {}
}
let saveDraftTimer = null;
function saveDraft() { clearTimeout(saveDraftTimer); saveDraftTimer = setTimeout(saveDraftNow, 250); }

function cleanOldDrafts() {
    try {
        const cutoff = isoDate(new Date(Date.now() - 8 * 86400000));
        Object.keys(localStorage).forEach(k => {
            const m = k.match(/^lineupDraft:(\d{4}-\d{2}-\d{2}):/);
            if (m && m[1] < cutoff) localStorage.removeItem(k);
        });
    } catch (e) {}
}

let liveTimer = null;
function markChanged() {
    dirty = true;
    saveDraft();
    renderRosterMeta();
    updateHero();
    if (view === "lineup") {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(() => {
            if (state.roster.length && !rosterProblems()) generate();
            renderLineup();
            updateHero();
        }, 450);
    }
}

async function gvizRows(sheetId, queryText, timeoutMs = 10000, extra = "") {
    if (isPlaceholder(sheetId)) return null;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(queryText)}${extra}&_cb=${Date.now()}`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return null;
        const text = await res.text();
        const prefix = "setResponse(";
        const startIndex = text.indexOf(prefix);
        if (startIndex === -1) return null;
        const data = JSON.parse(text.substring(startIndex + prefix.length, text.lastIndexOf(")")));
        if (!data.table) return null;
        return data.table.rows || [];
    } catch (e) {
        clearTimeout(timeoutId);
        return null;
    }
}

function cellText(cell) {
    if (!cell) return "";
    const raw = (cell.f !== undefined && cell.f !== null) ? cell.f : cell.v;
    if (raw === undefined || raw === null) return "";
    return String(raw).trim();
}
function cellRaw(cell) {
    if (!cell || cell.v === undefined || cell.v === null) return "";
    return String(cell.v).trim();
}

function submitToGoogleForm(formId, formDataObj) {
    const formUrl = `https://docs.google.com/forms/d/e/${formId}/formResponse`;
    return new Promise(resolve => {
        const iframeName = "hidden_iframe_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const iframe = document.createElement("iframe");
        iframe.name = iframeName;
        iframe.style.display = "none";
        document.body.appendChild(iframe);
        const form = document.createElement("form");
        form.action = formUrl;
        form.method = "POST";
        form.target = iframeName;
        form.style.display = "none";
        Object.entries(formDataObj).forEach(([key, value]) => {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = key;
            input.value = value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        let done = false;
        const finish = () => {
            if (done) return;
            done = true;
            setTimeout(() => { form.remove(); iframe.remove(); resolve(true); }, 400);
        };
        iframe.addEventListener("load", finish);
        setTimeout(finish, 15000);
        form.submit();
    });
}

function normalizeSkillHeader(text) {
    const key = String(text || "").toLowerCase().replace(/[^a-z]/g, "");
    if (!key) return null;
    return SKILL_ALIASES[key] || SKILLS.find(s => s.toLowerCase().replace(/[^a-z]/g, "") === key) || null;
}

// Column ids of a sheet, without any row data
async function gvizCols(sheetId, timeoutMs = 10000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=0&tq=${encodeURIComponent("SELECT * LIMIT 0")}&_cb=${Date.now()}`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return null;
        const text = await res.text();
        const start = text.indexOf("setResponse(");
        if (start === -1) return null;
        const data = JSON.parse(text.substring(start + 12, text.lastIndexOf(")")));
        return data.table && data.table.cols ? data.table.cols.map(c => c.id) : null;
    } catch (e) {
        clearTimeout(timeoutId);
        return null;
    }
}

// Staff sheet columns: A Name, B PIN (never downloaded here), C Role, D House, E+ ratings
async function loadStaff() {
    const ids = await gvizCols(STAFF_SHEET_ID);
    if (!ids || !ids.length) return false;
    const keep = ids.filter(id => id !== "B");
    const rows = await gvizRows(STAFF_SHEET_ID, "SELECT " + keep.join(", "), 12000, "&headers=0");
    if (!rows || !rows.length) return false;
    const at = id => keep.indexOf(id);          // position of a sheet column in each row
    const ratingCols = keep.filter(id => id.length > 1 || id >= "E");

    let start = 0;
    let colSkill = {};
    const first = rows[0].c || [];
    if (/^name/i.test(cellText(first[at("A")]))) {
        start = 1;
        ratingCols.forEach(id => { const sk = normalizeSkillHeader(cellText(first[at(id)])); if (sk) colSkill[at(id)] = sk; });
    }
    if (!Object.keys(colSkill).length) {
        SKILLS.forEach((sk, i) => { if (ratingCols[i]) colSkill[at(ratingCols[i])] = sk; });
        ratingSource = "Columns E–M (no rating headers found)";
    } else {
        ratingSource = "Header row: " + Object.values(colSkill).join(", ");
    }

    const staff = {}, ratings = {};
    for (let r = start; r < rows.length; r++) {
        const c = rows[r].c || [];
        const name = cellRaw(c[at("A")]);
        if (!name) continue;
        const role = (cellRaw(c[at("C")]) || "member").toLowerCase();
        const house = (cellRaw(c[at("D")]) || "foh").toLowerCase();
        staff[name] = { role, house };
        const rr = {};
        Object.entries(colSkill).forEach(([i, sk]) => {
            const v = parseFloat(cellRaw(c[i]));
            if (!isNaN(v) && v >= 1 && v <= 5) rr[sk] = Math.round(v);
        });
        ratings[name] = rr;
    }
    if (!Object.keys(staff).length) return false;
    STAFF = staff;
    RATINGS = ratings;
    return true;
}

function lineupFormReady() {
    return ["formId", "sheetId", "daypartEntry", "dateEntry", "dataEntry", "byEntry"]

}

// Newest first. Each saved row's Lineup Data cell is JSON {id, state, result}.
async function fetchSavedLineups() {
    const rows = await gvizRows(LINEUP_FORM.sheetId, "SELECT A, B, C, D, E ORDER BY A DESC LIMIT 80", 15000);
    if (rows === null) return null;
    const list = [];
    rows.forEach(row => {
        const c = row.c || [];
        const raw = cellRaw(c[3]);
        if (!raw || raw.charAt(0) !== "{") return;
        try {
            const o = JSON.parse(raw);
            if (o && o.state) list.push({ id: o.id, state: o.state, result: o.result || null, by: cellText(c[4]), at: cellText(c[0]) });
        } catch (e) {}
    });
    return list;
}

async function findSaved(dp, dateIso) {
    const list = await fetchSavedLineups();
    if (!list) return undefined;
    return list.find(x => x.state.daypart === dp && x.state.date === dateIso) || null;
}

const hm = t => fmtClock(t).replace(/\s*[AP]M$/i, "");   // 9:30
function closingOn() { return !!(state && state.daypart === "PM" && (!state.closing || state.closing.on !== false)); }
function toggleClosing() {
    state.closing = Object.assign({ on: true, prefs: {}, swaps: [] }, state.closing || {});
    state.closing.on = !closingOn();
    markChanged();
    renderRoster();
}
// People here from the inside close until the store closes (10:00 or 10:30)
function rosterClosers() {
    const IN = toMin(INSIDE_CLOSE), CL = toMin(STORE_HOURS.close);
    return state.roster.filter(r => !r.calledOff && r.start && r.end).map(r => {
        const s = toMin(r.start), e = s + shiftMinutes(r);
        return { name: r.name, start: s, end: e, ten: e > CL };
    }).filter(x => x.start <= IN && x.end >= CL);
}
function closingPrefOptions(sel, ten) {
    const opt = (v, l) => `<option value="${v}" ${v === (sel || "") ? "selected" : ""}>${l}</option>`;
    return opt("", "Any")
        + `<optgroup label="Inside checklist (9:00)">${Object.keys(CLOSE930).map(k => opt("930:" + k, CLOSE930[k].label)).join("")}</optgroup>`
        + `<optgroup label="Spot (9:00 – 10:00)">${CLOSE_POSITIONS.map(p => opt("pos:" + p, p)).join("")}</optgroup>`
        + (ten ? `<optgroup label="10:30 close (10:00)">${CLOSE1030_ORDER.map(k => opt("1030:" + k, CLOSE1030[k].label)).join("")}</optgroup>` : "");
}
function renderClosingList() {
    const box = document.getElementById("closingList");
    if (!box || !state) return;
    if (!closingOn()) { box.innerHTML = `<p class="opt-help" style="margin:0">Off — the night runs like the rest of the shift, with no closing checklists.</p>`; return; }
    const cl = rosterClosers().sort((a, b) => a.end - b.end || a.name.localeCompare(b.name));
    const inClose = fmtClock(toMin(INSIDE_CLOSE));
    if (!cl.length) { box.innerHTML = `<p class="opt-help" style="margin:0">Inside closes at ${inClose}. Add people working until close and they'll show up here.</p>`; return; }
    // a quick look at how the close will run with this crew
    const L = new Set(leaderNames());
    const tens = cl.filter(x => x.ten), ldr = cl.filter(x => L.has(x.name)).sort((a, b) => b.ten - a.ten)[0];
    const lead = ldr && cl.length > CLOSE_POSITIONS.length + 5 ? ldr.name : null;
    const pool = cl.length - (lead ? 1 : 0);
    const n930 = Math.max(0, Math.min(5, pool - CLOSE_POSITIONS.length));
    const sp = closingSetup(n930, tens.length);
    const prefs = (state.closing && state.closing.prefs) || {};
    box.innerHTML = `
        <div class="close-sum">
            <span>${cl.length - tens.length} until ${fmtClock(toMin(STORE_HOURS.close))}</span>
            <span>${tens.length} until ${fmtClock(toMin(STORE_HOURS.close) + 30)}</span>
            ${lead ? `<span>${esc(lead)} leads</span>` : ""}
        </div>
        <p class="opt-help" style="margin:0 0 0.4rem">Inside closes at ${inClose}. ${Math.min(CLOSE_POSITIONS.length, pool)} on drive-thru &amp; outside spots, ${n930} on inside checklists, ${Math.min(6, tens.length)} on the 10:30 close.</p>
        ${pool < CLOSE_POSITIONS.length ? `<p class="opt-help" style="margin:0 0 0.4rem; color:#b91c1c">Only ${pool} here until close — some 9:00 – 10:00 spots will stay empty.</p>` : ""}
        ${sp.cuts.length ? `<ul class="close-cuts">${sp.cuts.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
        ${cl.map(x => `
            <div class="close-row">
                <div><b>${esc(x.name)}</b><span class="close-tag ${x.ten ? "ten" : ""}">until ${hm(Math.min(x.end, toMin(STORE_HOURS.close) + 30))}</span></div>
                <select class="time-input sel pref ${prefs[x.name] ? "set" : ""}" data-n="${esc(x.name)}" onchange="setClosingPref(this.dataset.n, this.value)">${closingPrefOptions(prefs[x.name], x.ten)}</select>
            </div>`).join("")}`;
}
function setClosingPref(name, v) {
    state.closing = Object.assign({ on: true, prefs: {}, swaps: [] }, state.closing || {});
    if (v) state.closing.prefs[name] = v; else delete state.closing.prefs[name];
    // a new preference wins over an older swap for that person
    state.closing.swaps = (state.closing.swaps || []).filter(sw => sw.name !== name);

}

    const nineNames = all.filter(n => n !== c.lead);

            <div class="close-sec">10:00 – 10:30</div>

}
function setClosingSwap(key, name) {
    if (!name) return;
    state.closing = Object.assign({ on: true, prefs: {}, swaps: [] }, state.closing || {});
    state.closing.swaps = (state.closing.swaps || []).filter(sw => sw.key !== key);
    state.closing.swaps.push({ key, name });
    const live = liveNow();
    if (live !== null) state.lock = lockAt(live);
    dirty = true;
    saveDraft();
    generate();
    updateHero();
    renderLineup();
    const k = key.slice(key.indexOf(":") + 1);
    const what = key.startsWith("pos:") ? k : key.startsWith("930:") ? (CLOSE930[k] || {}).label
        : CLOSE1030[k] ? `${CLOSE1030[k].label} (10:30)` : smallLabel([k.replace(/^L/, "")]) + " (10:00)";
    showStatusMessage(`${name} moved to ${what || k}.`, "success", 2500);

    generate();

function addPerson(name) {
    name = String(name || "").trim();
    if (!name) return;
    if (state.roster.some(r => r.name.toLowerCase() === name.toLowerCase())) {
        showStatusMessage(`${name} is already on the roster.`, "warning");
        return;
    }
    const known = staffNameList().find(n => n.toLowerCase() === name.toLowerCase());
    if (state.daypart === "PM" && addWhere === "now") state.roster.push({ name: known || name, start: DAYPART_SPLIT, end: state.nowEnd || state.defaultShift.end, floater: false, at2: "", brk: "auto" });
    else {
        let start = state.defaultShift.start;
        if (state.daypart === "PM" && (toMin(start) ?? 0) <= toMin(DAYPART_SPLIT)) start = "16:00";   // "later" means after 2
        state.roster.push({ name: known || name, start, end: state.defaultShift.end, floater: false });
    }
    const input = document.getElementById("nameInput");
    if (input) { input.value = ""; input.focus(); }
    hideNameOptions();
    markChanged();
    renderRosterList();
    const list = document.getElementById("rosterList");
    if (list) list.scrollTop = list.scrollHeight;
    if (input) input.scrollIntoView({ block: "nearest" });
}

// --- Name autocomplete (same pattern as the checklist's assign screen) ---
let nameHighlight = 0;
function nameMatches() {
    const input = document.getElementById("nameInput");
    const q = input ? input.value.trim().toLowerCase() : "";
    const taken = new Set(state.roster.map(r => r.name.toLowerCase()));
    const rank = n => {
        const l = n.toLowerCase();
        if (l.startsWith(q)) return 0;                                   // "Sha" -> Shamya
        if (l.split(/\s+/).some(w => w.startsWith(q))) return 1;         // last name / second word
        return 2;                                                        // anywhere in the name
    };
    return staffNameList()
        .filter(n => !taken.has(n.toLowerCase()) && (!q || n.toLowerCase().includes(q)))
        .sort((a, b) => (q ? rank(a) - rank(b) : 0) || a.localeCompare(b));
}

function nameFilter() {
    const input = document.getElementById("nameInput");
    const box = document.getElementById("nameOptions");
    if (!input || !box) return;
    const q = input.value.trim();
    const matches = nameMatches();
    nameHighlight = 0;
    const rows = matches.slice(0, 50).map((n, i) => {
        const ratings = RATINGS[n] || {};
        const top = Object.entries(ratings).filter(([, v]) => v >= 4).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => k).join(", ");
        return `<div class="suggest-item ${i === 0 ? "highlighted" : ""}" data-n="${esc(n)}" onmousedown="event.preventDefault(); addPerson(this.dataset.n)">${esc(n)}${top ? `<small>${esc(top)}</small>` : ""}</div>`;
    });
    if (q && !matches.some(n => n.toLowerCase() === q.toLowerCase()) && !state.roster.some(r => r.name.toLowerCase() === q.toLowerCase())) {
        rows.push(`<div class="suggest-item ${rows.length === 0 ? "highlighted" : ""}" data-n="${esc(q)}" onmousedown="event.preventDefault(); addPerson(this.dataset.n)">Add "${esc(q)}"<small>not on staff list</small></div>`);
    }
    if (!rows.length) { box.style.display = "none"; box.innerHTML = ""; return; }
    const rect = input.getBoundingClientRect();
    box.style.left = rect.left + "px";
    box.style.width = rect.width + "px";
    box.innerHTML = rows.join("");
    box.style.display = "block";
    // open upward when there isn't room below
    const h = box.offsetHeight;
    const roomBelow = window.innerHeight - rect.bottom;
    box.style.top = (roomBelow < h + 8 && rect.top > roomBelow ? rect.top - h - 4 : rect.bottom + 4) + "px";
}

function hideNameOptions() {
    const box = document.getElementById("nameOptions");
    if (box) box.style.display = "none";
}

function nameKey(ev) {
    const box = document.getElementById("nameOptions");
    const items = box ? Array.from(box.querySelectorAll(".suggest-item")) : [];
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        if (!items.length) return;
        ev.preventDefault();
        nameHighlight = (nameHighlight + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("highlighted", i === nameHighlight));
        items[nameHighlight].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
        ev.preventDefault();
        if (items[nameHighlight]) addPerson(items[nameHighlight].dataset.n);
    } else if (ev.key === "Escape") {
        hideNameOptions();
    }
}

document.addEventListener("scroll", e => { if (e.target !== document.getElementById("nameOptions")) hideNameOptions(); }, true);

        return `
        <div class="item-row cat-row">

function toggleCatSplit(i) {
    const c = state.caterings[i];
    if (!c) return;
    if (c.split) { c.split = false; c.mins = (+c.supplies || 0) + (+c.food || 0) || 30; }
    else { const total = +c.mins || 30; c.split = true; c.food = Math.min(10, total); c.supplies = Math.max(5, total - c.food); }
    markChanged();
    renderCateringList();
}

function addCatering() {
    let name = document.getElementById("catName").value;
    let offRoster = false;
    if (name === "__other__") {
        name = document.getElementById("catOther").value.trim();
        if (!name) { formError("catErr", "Type the name of the person coming in for it."); return; }
        const onRoster = state.roster.find(r => r.name.toLowerCase() === name.toLowerCase() && !r.calledOff);
        if (onRoster) name = onRoster.name; else offRoster = true;
    }
    const due = document.getElementById("catDue").value;
    const minsEl = document.getElementById("catMins");
    const mins = minsEl ? +minsEl.value : 0;
    const split = catSplit ? { split: true, supplies: Math.max(5, +document.getElementById("catSupplies").value || 20), food: Math.max(0, +document.getElementById("catFood").value || 0) } : {};
    const goneEl = document.getElementById("catGone");
    const gone = goneEl ? Math.max(5, +goneEl.value || 40) : 0;
    if (!name) { formError("catErr", state.roster.length ? `Pick who's ${catType === "delivery" ? "taking the delivery" : "making the catering"}.` : "Add people to the roster first, or pick \"Someone not on the roster\"."); return; }
    if (!due) { formError("catErr", catType === "delivery" ? "Add the time they leave." : "Add the time the catering is due."); return; }
    formError("catErr", "");
    if (!Array.isArray(state.caterings)) state.caterings = [];
    state.caterings.push(Object.assign(catType === "delivery" ? { type: "delivery", name, due, mins, gone } : { type: "pickup", name, due, mins: mins || 30 }, split, offRoster ? { offRoster: true } : {}));
    markChanged();
    renderCateringList();
    flashLast("cateringList");
    showStatusMessage(`Added ${name}'s ${catType === "delivery" ? "delivery" : "catering"}.`, "success", 2500);
    document.getElementById("catName").value = "";
    document.getElementById("catOther").value = "";
    document.getElementById("catOther").style.display = "none";
}

                <div class="rule"><span>Dinner rush</span><span class="rule-times">${time("rush2From")}<span class="mini-label">to</span>${time("rush2To")}</span></div>
                <div class="rule"><span>Store hours</span><span class="rule-times">${time("open")}<span class="mini-label">to</span>${time("close")}</span></div>
                <div class="rule"><span>Inside closes <small>(PM)</small></span>${time("insideClose")}</div>
            </div>
            ${changed ? `<button type="button" class="link-btn" onclick="resetRules()">Reset to default</button>` : ""}
        </details>`;
}

function setRule(key, val) {
    state.rules = Object.assign({}, DEFAULT_RULES, state.rules || {}, { [key]: val });
    saveRules(state.rules);
    rulesOpen = true;
    markChanged();
    if (state.roster.length && !rosterProblems()) generate();
    updateHero();
    if (isWide()) { renderRoster(); renderLineup(); } else renderRoster();
}

function resetRules() {
    state.rules = Object.assign({}, DEFAULT_RULES);
    saveRules(state.rules);
    rulesOpen = true;
    markChanged();
    if (state.roster.length && !rosterProblems()) generate();
    updateHero();
    if (isWide()) { renderRoster(); renderLineup(); } else renderRoster();
}

function setRotation(v) {
    state.rotation = v;
    markChanged();
    if (state.roster.length && !rosterProblems()) generate();
    updateHero();
    if (isWide()) { renderRoster(); renderLineup(); }
    else renderRoster();
}

function setRunners(v) {
    state.runners = v;
    markChanged();
    renderRoster();
}

// =====================================================================
// GENERATE
// =====================================================================
function rosterProblems() {
    const missing = state.roster.filter(r => !r.start || !r.end).map(r => r.name);
    if (missing.length) return `Add shift times for ${missing.join(", ")}.`;
    return null;
}

// Who was where at 2:00 in today's AM lineup (this device's AM draft, or the AM lineup saved to Sheets)
let sheetAmHandover = null;
function amHandover() {
    try {
        const raw = localStorage.getItem(`lineupDraft:${todayIso()}:AM`);
        const o = raw ? JSON.parse(raw) : null;
        if (o && o.result && o.result.handover) return { handover: o.result.handover, deferBreaks: o.result.deferBreaks || [] };
    } catch (e) {}
    return sheetAmHandover;
}

function generate() {
    if (!state || !state.roster.length) { result = null; dirty = false; return; }
    // leaders come from the staff sheet's Role column (trainers are always treated as leaders)
    const leaders = leaderNames();
    result = buildLineup({ ...state, leaders }, RATINGS, state.daypart === "PM" ? amHandover() : null);
    dirty = false;
    saveDraft();
    renderSweepTimes();
}

function generateAndShow() {
    if (!state.roster.length) { showStatusMessage("Add at least one person first.", "error"); return; }
    const p = rosterProblems();
    if (p) { showStatusMessage(p, "error"); return; }
    generate();
    updateHero();
    setView("lineup");
}

function regenerate() {
    const p = rosterProblems();
    if (p) { showStatusMessage(p, "error"); return; }
    generate();
    updateHero();
    renderLineup();
    showStatusMessage("Lineup rebuilt.", "success", 2000);
}

async function refreshEverything() {
    showStatusMessage("Refreshing staff and ratings...", "info", 3000);
    const ok = await startStaffLoad();
    if (state && state.roster.length && !rosterProblems()) generate();
    renderAll();
    await checkSavedLineup();
    showStatusMessage(ok ? "Refreshed." : "Couldn't reach the staff sheet — using what was already loaded.", ok ? "success" : "error", 3000);
}

                    <button type="button" onclick="zoomBy(0.15)" title="Zoom in">+</button>

            <div class="focus-bar" id="focusBar"></div>

        </section>

            </div>
            <div>
                <section class="card">

                        <div><div class="card-title">Tasks</div><div class="card-sub">Change a time to move a task</div></div>
                    </div>

// "6:30 AM – 2:00 PM + handover" (the AM lineup runs one step past 2:00 to show who takes over)
function windowLabel(res) {
    const [W0, W1] = res.window;
    const split = toMin(DAYPART_SPLIT);
    if (res.daypart === "AM" && W1 === split + STEP) return `${fmtClock(W0)} – ${fmtClock(split)} + handover`;
    return `${fmtClock(W0)} – ${fmtClock(W1)}`;
}

function nowInWindow() {
    if (!result || result.date !== todayIso()) return null;
    const d = new Date();
    let m = d.getHours() * 60 + d.getMinutes();
    const [W0, W1] = result.window;
    if (m < W0 - 360) m += 1440;
    return (m >= W0 && m < W1) ? m : null;
}

function renderBreakEditor() {
    const box = document.getElementById("breakEditor");
    if (!box) return;
    const list = result.breaks.slice().sort((a, b) => a.start - b.start);
    if (!list.length) { box.innerHTML = `<p class="card-sub">Nobody works more than 5 hours, so no breaks are needed.</p>`; return; }
    box.innerHTML = list.map(b => {
        const p = result.people.find(x => x.name === b.name) || traineeAsPerson(result, b.name);
        const fromTxt = b.trainee === true ? (b.kind === "joint" ? `Trainee — goes with ${b.trainer}` : `Trainee — ${b.trainer} runs ${b.pos} alone`)
            : b.kind === "leader" ? `${b.trainingPos} → ${b.cover || b.leaderCover} (leader) stays with ${b.trainee}`
            : b.kind === "merge" ? `${b.trainingPos} → ${b.cover || "covered"}; ${b.trainee} trains with ${b.mergeWith}`
            : b.kind === "joint" ? `${b.trainingPos} → ${b.cover || "covered"}; ${b.trainee} breaks too`
            : b.pos ? `${b.pos}${b.cover ? ` → ${b.cover} covers${b.backfill ? ` (moved from ${b.backfillPos}; ${b.backfill} takes it)` : ""}` : " closes"}` : "Self-break";
        const isOverride = !!(state.breakOverrides && state.breakOverrides[b.name]);
        return `
            <div class="break-row">
                <div><b>${esc(b.name)}</b><div class="break-sub">Shift ${p ? fmtT(p.shiftStart ?? p.start) + "-" + fmtT(p.shiftEnd ?? p.end) : ""} · ${esc(fromTxt)}</div></div>
                <input type="time" class="time-input" step="900" value="${hhmm(b.start)}" data-n="${esc(b.name)}" onchange="setBreak(this.dataset.n, this.value)">
                ${isOverride ? `<button type="button" class="link-btn" data-n="${esc(b.name)}" onclick="setBreak(this.dataset.n, '')">Reset</button>` : `<span class="auto-tag">Auto</span>`}
            </div>`;
    }).join("");
}

// =====================================================================
// MOVE SOMEONE (like a call off, but they switch spots instead of leaving)
// =====================================================================
let moveDraft = { name: "", pos: "", when: "now" };

function openMove(name) {
    if (!result) return;
    moveDraft = { name: name || moveDraft.name || "", pos: "", when: "now" };
    renderMove();
    document.getElementById("moveModal").classList.add("active");
}
function closeMove() { document.getElementById("moveModal").classList.remove("active"); }

// The first 15-minute step from now, if this lineup is today and under way
function liveNow() {
    const now = nowInWindow();
    return now === null ? null : Math.floor(now / STEP) * STEP + STEP;
}

function renderMove() {
    const names = result.people.map(p => p.name);
    const live = liveNow() !== null;
    const cur = (state.moves || []);
    const where = moveDraft.name ? currentSpot(moveDraft.name) : null;
    document.getElementById("moveBody").innerHTML = `
        <div class="move-form">
            <label class="move-field"><span>Who</span>
                <select class="time-input sel" onchange="moveDraft.name=this.value; renderMove()"><option value="">Pick someone</option>${names.map(n => `<option ${n === moveDraft.name ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
            </label>
            ${where ? `<p class="sheet-help" style="margin:0">Now on <b>${esc(where)}</b></p>` : ""}
            <label class="move-field"><span>Move to</span>
                <select class="time-input sel" onchange="moveDraft.pos=this.value">${positionOptions("Pick a spot", moveDraft.pos)}</select>
            </label>
            ${live ? `<div class="move-field"><span>When</span>
                <div class="seg">
                    <button type="button" class="${moveDraft.when === "now" ? "on" : ""}" onclick="moveDraft.when='now'; renderMove()">Now</button>
                    <button type="button" class="${moveDraft.when === "possible" ? "on" : ""}" onclick="moveDraft.when='possible'; renderMove()">When possible</button>
                </div></div>` : `<p class="sheet-help" style="margin:0">The shift hasn't started, so this is for their whole shift.</p>`}
            <button type="button" class="btn-primary block" onclick="applyMove()">${ICON.swap} Move and regenerate</button>
        </div>
        ${cur.length ? `<div class="export-title" style="margin-top:1.2rem">Moved</div>
        <div class="calllist">${cur.map((m, i) => `
            <div class="callrow">
                <span class="chip-avatar">${esc(initials(m.name))}</span>
                <div><b>${esc(m.name)}</b><div class="break-sub">${esc(m.pos)} from ${fmtClock(toMin(m.from))}${m.when === "possible" ? " (when possible)" : ""}</div></div>
                <button type="button" class="link-btn danger" onclick="removeMove(${i})">Undo</button>
            </div>`).join("")}</div>` : ""}`;
}

function currentSpot(name, t) {
    const at = t ?? (nowInWindow() ?? result.window[0]);
    for (const [pos, segs] of Object.entries(result.actual || result.positions)) if (segs.some(s => s.name === name && s.from <= at && at < s.to)) return pos;
    return null;
}

function lockAt(until) {
    return { until, positions: result.actual || result.positions, breaks: result.breaks.filter(b => !b.trainee).map(b => ({ name: b.name, start: b.start })), tasks: result.tasks.map(k => ({ key: k.key, start: k.start, name: k.name })) };
}

// How many 15-minute spots differ from the current lineup after a time
function disruption(a, b, from) {
    let n = 0;
    const A = a.actual || a.positions, B = b.actual || b.positions;
    for (let t = from; t < a.window[1]; t += STEP) {
        Object.keys(POS_INFO).forEach(pos => {
            const x = (A[pos] || []).find(s => s.from <= t && t < s.to), y = (B[pos] || []).find(s => s.from <= t && t < s.to);
            if ((x && x.name) !== (y && y.name)) n++;
        });
    }
    return n;
}

function applyMove() {
    const { name, pos, when } = moveDraft;
    if (!name || !pos) { showStatusMessage("Pick who and where.", "warning"); return; }
    const person = result.people.find(p => p.name === name);
    if (!person) return;
    const live = liveNow();
    const others = (state.moves || []).filter(m => m.name !== name);
    const leaders = leaderNames();
    let from = live !== null ? Math.max(live, person.start) : person.start;
    let lock = live !== null ? lockAt(live) : state.lock || null;
    if (live !== null && when === "possible") {
        // Try the natural moments coming up and keep the one that moves the fewest people (sooner wins ties)
        const cands = new Set([from]);
        result.breaks.forEach(b => { if (b.name === name || b.cover === name) { cands.add(b.start); cands.add(b.end); } });
        const occ = (result.actual || result.positions)[pos] || [];
        occ.forEach(sg => { cands.add(sg.from); cands.add(sg.to); });
        result.breaks.filter(b => occ.some(sg => sg.name === b.name)).forEach(b => { cands.add(b.start); cands.add(b.end); });
        result.tasks.forEach(k => { if (k.name === name) cands.add(k.end); });
        let best = null;
        [...cands].filter(t => t >= from && t < person.end && t <= from + 180).sort((a, b) => a - b).forEach(t => {
            const trial = buildLineup({ ...state, leaders, lock, moves: [...others, { name, pos, from: hhmm(t) }] }, RATINGS, state.daypart === "PM" ? amHandover() : null);
            if (!trial) return;
            const cost = disruption(result, trial, live) + (t - from) / STEP * 1.5;
            if (!best || cost < best.cost) best = { t, cost };
        });
        if (best) from = best.t;
    }
    state.lock = lock;
    state.moves = [...others, { name, pos, from: hhmm(from), when: live !== null ? when : "whole" }];
    closeMove();
    markChanged();
    generate();
    updateHero();
    renderAll();
    showStatusMessage(`${name} moves to ${pos}${live !== null ? ` at ${fmtClock(from)}` : ""}.`, "success", 3500);
}

function removeMove(i) {
    const m = (state.moves || [])[i];
    if (!m) return;
    state.moves.splice(i, 1);
    const live = liveNow();
    if (live !== null) state.lock = lockAt(live);
    markChanged();
    generate();
    updateHero();
    renderAll();
    renderMove();
    showStatusMessage(`Undid ${m.name}'s move.`, "success", 2500);
}

// =====================================================================
// CALL OFFS
// =====================================================================
let calloffDraft = new Set();
let calloffKeep = true;

function openCallOffs() {
    if (!state.roster.length) { showStatusMessage("Add people to the roster first.", "warning"); return; }
    calloffDraft = new Set(state.roster.filter(r => r.calledOff).map(r => r.name));
    calloffKeep = true;
    renderCallOffs();
    document.getElementById("calloffModal").classList.add("active");
}
function closeCallOffs() { document.getElementById("calloffModal").classList.remove("active"); }

// Lock point: end of the current 15-minute block, when it's today's lineup and the shift is under way
function calloffLockPoint() {
    const now = nowInWindow();
    if (now === null || !result) return null;
    return Math.floor(now / STEP) * STEP + STEP;
}

function renderCallOffs() {
    const lockAt = calloffLockPoint();
    const rows = state.roster.map((r, i) => {
        const on = calloffDraft.has(r.name);
        return `
            <div class="callrow ${on ? "off" : ""}">
                <span class="chip-avatar">${esc(initials(r.name))}</span>
                <div><b>${esc(r.name)}</b><div class="break-sub">${r.start && r.end ? fmtClock(toMin(r.start)) + " – " + fmtClock(toMin(r.end)) : "No shift time"}</div></div>
                <button type="button" class="switch ${on ? "on" : ""}" data-i="${i}" onclick="toggleCallOffDraft(+this.dataset.i)" aria-label="Called off"><i></i></button>
            </div>`;
    }).join("");
    document.getElementById("calloffBody").innerHTML = `
        <p class="sheet-help" style="margin-top:0; margin-bottom:0.8rem;">Switch on anyone who called off.</p>
        <div class="calllist">${rows}</div>
        <div class="sheet-foot">
        ${lockAt !== null ? `
        <div class="callkeep">
            <div><b>Keep the lineup the same up to ${fmtClock(lockAt)}</b><div class="break-sub">Only change the rest of the shift</div></div>
            <button type="button" class="switch ${calloffKeep ? "on" : ""}" onclick="calloffKeep=!calloffKeep; renderCallOffs()" aria-label="Keep lineup up to now"><i></i></button>
        </div>` : ""}
        <button type="button" class="btn-primary block" style="margin-top:0.85rem;" onclick="applyCallOffs()">${ICON.refresh} Regenerate with call offs</button>
        </div>`;
}

function toggleCallOffDraft(i) {
    const r = state.roster[i];
    if (!r) return;
    if (calloffDraft.has(r.name)) calloffDraft.delete(r.name); else calloffDraft.add(r.name);
    renderCallOffs();
}

function applyCallOffs() {
    const lockAt = calloffLockPoint();
    if (lockAt !== null && calloffKeep && result) {
        state.lock = {
            until: lockAt,
            positions: result.actual || result.positions,
            breaks: result.breaks.map(b => ({ name: b.name, start: b.start })),
            tasks: result.tasks.map(k => ({ key: k.key, start: k.start, name: k.name }))
        };
    } else if (!calloffKeep) {
        state.lock = null;
    }
    state.roster.forEach(r => { r.calledOff = calloffDraft.has(r.name); });
    closeCallOffs();
    markChanged();
    const p = rosterProblems();
    if (!p) generate();
    updateHero();
    if (isWide()) { renderRoster(); renderLineup(); }
    else renderLineup();
    const n = calloffDraft.size;
    showStatusMessage(p ? p : `Lineup rebuilt${n ? ` without ${n} call off${n === 1 ? "" : "s"}` : ""}.`, p ? "error" : "success", 3500);
}

function unlockLineup() {
    state.lock = null;
    markChanged();
    generate();
    updateHero();
    renderLineup();
    showStatusMessage("Rebuilt the whole shift.", "success", 2500);
}

function renderTaskEditor() {
    const box = document.getElementById("taskEditor");
    if (!box) return;
    const list = result.tasks.filter(k => k.type !== "closing").sort((a, b) => a.start - b.start);
    if (!list.length) { box.innerHTML = `<p class="card-sub">No tasks this shift.</p>`; return; }
    const icon = { lemonade: ["lemon", ICON.cup], sweep: ["sweep", ICON.broom], ice: ["ice", ICON.ice], catering: ["cater", ICON.box], delivery: ["cater", ICON.box], catprep: ["cater", ICON.box] };
    box.innerHTML = list.map(k => {
        const [cls, svg] = icon[k.type] || ["sweep", ICON.broom];
        const who = k.name ? `${k.name}${k.pos ? ` · from ${k.pos}${k.cover ? ` → ${k.cover} covers` : ""}` : ""}` : "No one free";
        const extra = k.inPlace ? ` · stays on ${k.pos}` : k.offRoster ? " · catering only (not on the roster)" : k.type === "catprep" ? ` · ${k.mins} min, for the ${fmtT(k.deadline)} order` : k.type === "delivery" ? ` · leaves ${fmtT(k.leaves)}, back ~${fmtT(k.back)}` : k.deadline ? ` · ready by ${fmtT(k.deadline)}` : "";
        const isPinned = !!(state.taskOverrides && k.key && state.taskOverrides[k.key]);
        return `
            <div class="break-row">
                <span class="task-icon ${cls}">${svg}</span>
                <div><b>${esc(k.label)}</b><div class="break-sub">${esc(who)}${extra}</div></div>
                ${k.type === "catering" || k.type === "delivery" ? `<span class="times-inline">${fmtClock(k.start)} – ${fmtClock(k.type === "delivery" ? k.back : k.end)}</span>` : `<input type="time" class="time-input" step="900" value="${hhmm(k.start)}" data-k="${esc(k.key || "")}" onchange="setTaskTime(this.dataset.k, this.value)">`}
                ${k.type === "catering" || k.type === "delivery" ? `<span class="auto-tag">Set</span>` : isPinned ? `<button type="button" class="link-btn" data-k="${esc(k.key)}" onclick="setTaskTime(this.dataset.k, '')">Reset</button>` : `<span class="auto-tag">Auto</span>`}
            </div>`;
    }).join("");
}

function setTaskTime(key, val) {
    if (!key) return;
    if (!state.taskOverrides) state.taskOverrides = {};
    if (val) state.taskOverrides[key] = val; else delete state.taskOverrides[key];
    dirty = true;
    saveDraft();
    generate();
    updateHero();
    renderLineup();
}

function setBreak(name, val) {
    if (!state.breakOverrides) state.breakOverrides = {};
    if (val) state.breakOverrides[name] = val; else delete state.breakOverrides[name];
    dirty = true;
    saveDraft();
    generate();
    updateHero();
    renderLineup();
}

function renderWarnings() {
    const box = document.getElementById("warnBox");
    if (!box) return;
    const w = (result.calledOff && result.calledOff.length ? [`Called off: ${result.calledOff.join(", ")}.`] : []).concat(result.warnings || []);
    box.innerHTML = `<ul class="warn-list">${w.length ? w.map(x => `<li>${esc(x)}</li>`).join("") : `<li class="ok">Everything is covered — no conflicts.</li>`}</ul>`;
}

// =====================================================================
// MIND MAP LAYOUT + RENDER
// =====================================================================
const MAP_FONT = "'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
let measureCtx = null;
function textW(t, size, weight, italic) {
    if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
    measureCtx.font = `${italic ? "italic " : ""}${weight} ${size}px ${MAP_FONT}`;
    return measureCtx.measureText(t).width;
}

function tint(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function elbow(x1, y1, tx, x2, y2) {
    if (Math.abs(y2 - y1) < 1) return `M${x1} ${y1}H${x2}`;
    const s = y2 > y1 ? 1 : -1;
    const r = Math.min(10, Math.abs(y2 - y1) / 2);
    return `M${x1} ${y1}H${tx - r}Q${tx} ${y1} ${tx} ${y1 + s * r}V${y2 - s * r}Q${tx} ${y2} ${tx + r} ${y2}H${x2}`;
}

// Who covers a break: their cover, "self" if they weren't in a spot (e.g. the runner),
// or "<spot> closes" — only ever the lowest-priority spot open at that moment (the next one to go)
function breakCover(b) {
    if (b.trainee === true) return { text: b.kind === "joint" ? `with ${b.trainer}` : `${b.trainer} runs ${b.pos}`, info: true, from: b.start, to: b.end };
    if (!b.pos) return { text: "self", info: true, from: b.start, to: b.end };
    if (!b.cover) return { text: `${b.pos} closes (next to go)`, info: true, from: b.start, to: b.end };
    return { text: b.cover, name: b.cover, from: b.start, to: b.end };
}

function mapGroups(res) {
    const W1 = res.window[1];
    const groups = [];
    ["FC", "DT", "Outside"].forEach(g => {
        const rows = POSITIONS.filter(p => p.group === g && (res.positions[p.name] || []).length).map(p => ({
            label: p.name,
            chain: res.positions[p.name].slice().sort((a, b) => a.from - b.from).flatMap((s, i, arr) => {
                const seg = { text: `${s.name} ${fmtRange(s.from, s.to, W1)}`, name: s.name, from: s.from, to: s.to };
                const nx = arr[i + 1];
                // empty for a while before the next person: say so instead of leaving a silent hole
                return nx && nx.from > s.to ? [seg, { text: `closed ${fmtT(s.to)}-${fmtT(nx.from)}`, info: true, from: s.to, to: nx.from }] : [seg];
            })
        }));
        if (rows.length) groups.push({ key: g, rows });
    });
    if (res.breaks.length) {
        groups.push({
            key: "Breaks",
            branched: true,
            rows: res.breaks.slice().sort((a, b) => a.start - b.start || a.name.localeCompare(b.name)).map(b => ({
                branch: fmtT(b.start), branchFrom: b.start, branchTo: b.end,
                label: b.name, labelName: b.name, from: b.start, to: b.end,
                chain: [breakCover(b)]
                    .concat(b.backfill ? [{ text: `${b.backfillPos}: ${b.backfill}`, name: b.backfill, info: true, from: b.start, to: b.end }] : [])
                    .concat(b.kind === "merge" ? [{ text: `${b.trainee} trains with ${b.mergeWith}`, info: true, from: b.start, to: b.end }] : [])
                    .concat(b.kind === "leader" && b.trainee ? [{ text: `leader, with ${b.trainee}`, info: true, from: b.start, to: b.end }] : [])
            }))
        });
    }
    if ((res.sessions || []).length) {
        groups.push({
            key: "Training",
            rows: [...new Set(res.sessions.map(x => x.trainee))].map(tn => ({
                label: tn, labelName: tn,
                chain: res.sessions.filter(x => x.trainee === tn).sort((a, b) => a.start - b.start)
                    .map(x => ({ text: `${x.pos} with ${x.trainer} ${fmtT(x.start)}-${fmtT(x.end)}`, name: x.trainer, from: x.start, to: x.end }))
            }))
        });
    }
    if (res.tasks.length) {
        const order = ["Catering supplies", "Catering", "Delivery", "Lemonade", "Parking Lot Sweep", "Ice Bin"];
        const rows = order.filter(l => res.tasks.some(k => k.label === l)).map(l => ({
            label: l,
            chain: res.tasks.filter(k => k.label === l).map(k => ({ text: `${k.name || "Unassigned"} ${fmtT(k.start)}-${fmtT(k.end)}`, name: k.name, from: k.start, to: k.end }))
        }));
        if (rows.length) groups.push({ key: "Tasks", rows });
    }
    const c = res.closing;
    if (c) {
        const also = b => b.notes && b.notes.length ? [{ text: "+ " + b.notes.join("; "), info: true }] : [];
        const rows9 = c.block930.map(b => {
            const then = c.spots.find(s => s.from && s.name === b.name);
            return {
                label: b.area,
                chain: [{ text: `${b.name || "Nobody"} ${fmtT(b.start)}-${fmtT(b.end)}`, name: b.name, from: b.start, to: b.end }]
                    .concat(b.steps && b.steps.length ? [{ text: `Break Room first, then the rest at ${fmtT(b.steps[1].at)}`, info: true }] : [])
                    .concat(then ? [{ text: `then ${then.pos} ${fmtT(then.from)}-${fmtT(res.window[1])}`, name: then.name, from: then.from, to: res.window[1] }] : [])
                    .concat(!then && b.thenHelp ? [{ text: `then help ${b.thenHelp} ${fmtT(b.end)}-${fmtT(res.window[1])}`, name: b.name, from: b.end, to: res.window[1] }] : [])
                    .concat(also(b))
            };
        });
        if (c.lead) rows9.push({ label: "Lead", chain: [{ text: `${c.lead} ${fmtT(toMin(INSIDE_CLOSE))}-${fmtT(res.window[1])}`, name: c.lead }] });
        if (rows9.length) groups.push({ key: "Close930", rows: rows9 });
        const rows10 = c.block1030.map(b => ({ label: b.area, chain: [{ text: `${b.name || "Nobody"} ${fmtT(b.start)}-${fmtT(b.end)}`, name: b.name }].concat(also(b)) }));
        if (rows10.length) groups.push({ key: "Close1030", rows: rows10 });
    }
    return groups;
}

// One tree: a root, then (unless flat) one node per group, then the rows and their chains.
// flat = the root stands in for a single group (used for the Breaks and Tasks trees).
function layoutTree(groups, root, ox, oy, nowM, flat) {
    const NODE_H = 34, ROW = 48, PADX = 13, GROUP_GAP = 16, CHAIN_GAP = 26;
    const nodes = [], edges = [];
    if (!groups.length) return { w: 0, h: 0, nodes, edges };
    const rootW = Math.max(textW(root.title, root.size || 30, 700), root.sub ? textW(root.sub, 13, 600) : 0) + 44;
    const rootH = root.sub ? 76 : 56;
    const rootX = ox + 18;
    const groupW = flat ? 0 : Math.max(...groups.map(g => textW(GROUPS[g.key].label, 17, 700))) + 34;
    const groupX = rootX + rootW + 52;
    const posX = flat ? rootX + rootW + 46 : groupX + groupW + 46;
    const branchW = Math.max(0, ...groups.filter(g => g.branched).flatMap(g => g.rows.map(r => textW(r.branch, 15, 800)))) + 26;
    const branchRowX = posX + branchW + 40;

    let y = oy + 18;
    groups.forEach(g => {
        g.rows.forEach((r, i) => {
            if (g.branched && i > 0 && r.branch !== g.rows[i - 1].branch) y += 8;   // a little space between break times
            r.cy = y + ROW / 2; y += ROW;
        });
        g.cy = (g.rows[0].cy + g.rows[g.rows.length - 1].cy) / 2;
        if (g.branched) {
            g.branches = [];
            g.rows.forEach(r => {
                const last = g.branches[g.branches.length - 1];
                if (last && last.label === r.branch) last.rows.push(r);
                else g.branches.push({ label: r.branch, from: r.branchFrom, to: r.branchTo, rows: [r] });
            });
            g.branches.forEach(b => { b.cy = (b.rows[0].cy + b.rows[b.rows.length - 1].cy) / 2; });
        }
        y += GROUP_GAP;
    });
    const bottom = Math.max(y + 4, oy + rootH + 40);
    const rootCy = (groups[0].cy + groups[groups.length - 1].cy) / 2;

    nodes.push({
        kind: "root", x: rootX, y: rootCy - rootH / 2, w: rootW, h: rootH, r: 14, fill: root.fill,
        lines: root.sub
            ? [{ text: root.title, size: root.size || 30, weight: 700, color: root.text || "#ffffff", dy: -9 }, { text: root.sub, size: 13, weight: 600, color: root.subColor || "#fbbf24", dy: 19 }]
            : [{ text: root.title, size: root.size || 24, weight: 700, color: root.text || "#ffffff", dy: 0 }]
    });

    let maxX = rootX + rootW;
    const rootTrunk = rootX + rootW + 24;
    groups.forEach(g => {
        const G = GROUPS[g.key];
        let parentX = rootX + rootW, parentCy = rootCy, trunk = rootTrunk;
        if (!flat) {
            const gh = 40;
            edges.push({ d: elbow(rootX + rootW, rootCy, rootTrunk, groupX, g.cy), color: G.color, wd: 3 });
            nodes.push({ kind: "group", x: groupX, y: g.cy - gh / 2, w: groupW, h: gh, r: 12, fill: G.color, lines: [{ text: G.label, size: 17, weight: 700, color: G.text, dy: 0 }] });
            parentX = groupX + groupW; parentCy = g.cy; trunk = groupX + groupW + 22;
        }
        if (g.branched) {
            g.branches.forEach(b => {
                const bw = textW(b.label, 15, 800) + 26;
                edges.push({ d: elbow(parentX, parentCy, trunk, posX, b.cy), color: G.color, wd: 2 });
                const isNow = nowM !== null && b.from <= nowM && nowM < b.to;
                nodes.push({
                    kind: "branch", x: posX, y: b.cy - NODE_H / 2, w: bw, h: NODE_H, r: 10,
                    fill: isNow ? "#1d4ed8" : G.color, now: isNow,
                    lines: [{ text: b.label, size: 15, weight: 800, color: G.text, dy: 0 }]
                });
                const btrunk = posX + bw + 18;
                b.rows.forEach(r => edges.push({ d: elbow(posX + bw, b.cy, btrunk, branchRowX, r.cy), color: G.color, wd: 2 }));
            });
        }
        g.rows.forEach(r => {
            const rx = g.branched ? branchRowX : posX;
            const pw = textW(r.label, 15, 700) + PADX * 2;
            if (!g.branched) edges.push({ d: elbow(parentX, parentCy, trunk, posX, r.cy), color: G.color, wd: 2 });
            const rowNow = nowM !== null && r.from !== undefined && r.from <= nowM && nowM < r.to;
            nodes.push({
                kind: "pos", x: rx, y: r.cy - NODE_H / 2, w: pw, h: NODE_H, r: 10,
                fill: rowNow ? tint(G.color, 0.22) : "#ffffff", stroke: G.color, sw: rowNow ? 3.5 : 2, now: rowNow,
                name: r.labelName || null, lines: [{ text: r.label, size: 15, weight: 700, color: "#1e293b", dy: 0 }]
            });
            let x = rx + pw;
            r.chain.forEach(c => {
                const italic = !!c.info;
                const w = textW(c.text, c.info ? 14 : 15, c.info ? 500 : 600, italic) + PADX * 2;
                const nx = x + CHAIN_GAP;
                edges.push({ d: `M${x} ${r.cy}H${nx}`, color: G.color, wd: 2 });
                const isNow = nowM !== null && c.from !== undefined && c.from <= nowM && nowM < c.to;
                nodes.push({
                    kind: c.info ? "info" : "seg", x: nx, y: r.cy - NODE_H / 2, w, h: NODE_H, r: 10,
                    fill: isNow ? tint(G.color, 0.22) : (c.info ? "#f8fafc" : "#ffffff"),
                    stroke: G.color, sw: isNow ? 3.5 : (c.info ? 1.5 : 2), dash: !!c.info, now: isNow,
                    name: c.name || null,
                    lines: [{ text: c.text, size: c.info ? 14 : 15, weight: c.info ? 500 : 600, color: c.info ? "#475569" : "#1e293b", dy: 0, italic }]
                });
                x = nx + w;
            });
            maxX = Math.max(maxX, x);
        });
        maxX = Math.max(maxX, posX);
    });
    return { w: Math.ceil(maxX + 22 - ox), h: Math.ceil(bottom - oy), nodes, edges };
}

// Three separate trees: the lineup on the left, breaks top-middle, tasks bottom-middle
function layoutMap(res, opts = {}) {
    const groups = mapGroups(res);
    const nowM = opts.now === false ? null : (showNow ? nowInWindow() : null);
    const lineupG = groups.filter(g => ["FC", "DT", "Outside", "Training"].includes(g.key));
    const breakG = groups.filter(g => g.key === "Breaks");
    const taskG = groups.filter(g => g.key === "Tasks");
    const closeG = groups.filter(g => g.key === "Close930" || g.key === "Close1030");
    const roots = {
        closing: { title: "Closing", sub: `Inside closes ${fmtClock(toMin(INSIDE_CLOSE))}`, fill: "#831843", subColor: "#fbcfe8" },
        lineup: { title: "Lineup", sub: `${res.daypart} · ${shortDate(res.date)}`, fill: "#002a4f" },
        breaks: { title: "Breaks", fill: GROUPS.Breaks.color, size: 22 },
        tasks: { title: "Tasks", fill: GROUPS.Tasks.color, size: 22 }
    };
    const GAP = 40, VGAP = 28;
    // measure, then place
    const mL = layoutTree(lineupG, roots.lineup, 0, 0, nowM, false);
    const mB = layoutTree(breakG, roots.breaks, 0, 0, nowM, true);
    const midX = mL.w ? mL.w + GAP : 0;
    const L1 = layoutTree(lineupG, roots.lineup, 0, 0, nowM, false);
    const B1 = layoutTree(breakG, roots.breaks, midX, 0, nowM, true);
    const T1 = layoutTree(taskG, roots.tasks, midX, B1.h ? B1.h + VGAP : 0, nowM, true);
    const cY = (B1.h ? B1.h + VGAP : 0) + (T1.h ? T1.h + VGAP : 0);
    const C1 = layoutTree(closeG, roots.closing, midX, cY, nowM, false);
    const midW = Math.max(B1.w, T1.w, C1.w);
    const stack = [B1, T1, C1].filter(x => x.h);
    const midH = stack.reduce((a, x) => a + x.h, 0) + VGAP * Math.max(0, stack.length - 1);
    const parts = [L1, B1, T1, C1].filter(x => x.nodes.length);
    // separators between the lineup tree and the middle column, and between breaks, tasks and closing
    const seps = [];
    if (L1.w && midH) seps.push({ x1: midX - GAP / 2, y1: 14, x2: midX - GAP / 2, y2: Math.max(L1.h, midH) - 10 });
    let sy = 0;
    stack.forEach((x, i) => { sy += x.h; if (i < stack.length - 1) { seps.push({ x1: midX + 12, y1: sy + VGAP / 2, x2: midX + midW - 12, y2: sy + VGAP / 2 }); sy += VGAP; } });
    return {
        w: Math.ceil((midX || 0) + (midX ? midW : L1.w)),
        h: Math.ceil(Math.max(L1.h, midH)),
        nodes: parts.flatMap(x => x.nodes),
        edges: parts.flatMap(x => x.edges),
        seps
    };
}

function svgFromLayout(L) {
    const out = [`<svg xmlns="http://www.w3.org/2000/svg" id="mapSvg" viewBox="0 0 ${L.w} ${L.h}" width="${L.w}" height="${L.h}">`];
    (L.seps || []).forEach(l => out.push(`<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="#d3dde8" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>`));
    L.edges.forEach(e => out.push(`<path d="${e.d}" fill="none" stroke="${e.color}" stroke-width="${e.wd}" stroke-linecap="round"/>`));
    L.nodes.forEach(n => {
        const click = n.name ? ` data-name="${esc(n.name)}" onclick="focusPerson(this.dataset.name)"` : "";
        out.push(`<g class="mm-node ${n.kind}${n.name ? " clickable" : ""}${n.now ? " now" : ""}"${click}>`);
        out.push(`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${n.r}" fill="${n.fill}"${n.stroke ? ` stroke="${n.stroke}" stroke-width="${n.sw}"${n.dash ? ' stroke-dasharray="5 4"' : ""}` : ""}/>`);
        n.lines.forEach(l => {
            out.push(`<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + l.dy}" text-anchor="middle" dominant-baseline="central" font-family="${MAP_FONT.replace(/"/g, "'")}" font-size="${l.size}" font-weight="${l.weight}"${l.italic ? ' font-style="italic"' : ""} fill="${l.color}">${esc(l.text)}</text>`);
        });
        out.push(`</g>`);
    });
    out.push(`</svg>`);
    return out.join("");
}

function renderMap() {
    const wrap = document.getElementById("mapWrap");
    if (!wrap || !result) return;
    mapLayout = layoutMap(result);
    wrap.innerHTML = svgFromLayout(mapLayout);
    applyZoom();
    applyFocus();
}

function applyZoom() {
    const svg = document.getElementById("mapSvg");
    const wrap = document.getElementById("mapWrap");
    if (!svg || !wrap || !mapLayout) return;
    const s = currentScale();
    svg.setAttribute("width", Math.round(mapLayout.w * s));
    svg.setAttribute("height", Math.round(mapLayout.h * s));
}

function currentScale() {
    const wrap = document.getElementById("mapWrap");
    if (typeof zoom === "number") return zoom;
    if (!wrap || !mapLayout) return 1;
    const fit = Math.min(1, (wrap.clientWidth - 4) / mapLayout.w);
    if (zoom === "fit") return Math.max(0.2, fit);
    return Math.max(0.62, fit); // auto: readable text, scroll sideways if needed
}
function zoomBy(d) { zoom = Math.max(0.3, Math.min(2.5, Math.round((currentScale() + d) * 100) / 100)); renderLineup(); }
function zoomFit() { zoom = (zoom === "fit") ? null : "fit"; renderLineup(); }

function focusPerson(name) {
    focusName = (focusName === name) ? null : name;
    applyFocus();
    renderBdPanel();
}

// Wide screens: the live time breakdown next to the lineup — everyone, or the person you tapped
function renderBdPanel() {
    const el = document.getElementById("bdPanel");
    if (!el || !result) return;
    const who = focusName && (result.people.some(p => p.name === focusName) || traineeAsPerson(result, focusName)) ? focusName : null;
    const blocks = who ? personBlocks(result, who) : breakdownBlocks(result);
    const p = who && (result.people.find(x => x.name === who) || traineeAsPerson(result, who));
    const now = showNow ? nowInWindow() : null;
    let nowIdx = -1;
    if (now !== null) blocks.forEach((b, i) => { if (b.t <= now) nowIdx = i; });
    el.innerHTML = `
        <div class="card-head">
            <div><div class="card-title">${who ? esc(who) : "Time Breakdown"}</div>
            <div class="card-sub">${who ? (p ? `Shift ${fmtClock(p.shiftStart ?? p.start)} – ${fmtClock(p.shiftEnd ?? p.end)}` : "") : "Every change, in order"}</div></div>
            ${who ? `<button type="button" class="btn-secondary push" onclick="focusPerson(focusName)">Everyone</button>` : ""}
        </div>
        <div class="bd-actions">
            <button type="button" class="btn-dark sm" onclick="breakdownFor=${who ? "focusName" : "null"}; copyBreakdown()">Copy</button>
            <button type="button" class="btn-secondary" onclick="breakdownFor=${who ? "focusName" : "null"}; downloadBreakdown()">Download</button>
            ${navigator.share ? `<button type="button" class="btn-secondary" onclick="breakdownFor=${who ? "focusName" : "null"}; shareBreakdown()">${ICON.share} Share</button>` : ""}
        </div>
        <div class="bd-list">${blocks.map((b, i) => `
            <div class="bd-block ${i === nowIdx ? "now" : ""}">
                <div class="bd-time">${fmtClock(b.t)}</div>
                ${b.lines.map(l => `<div class="bd-line ${/^Break/.test(l.text) ? "brk" : ""}">${esc(l.text)}</div>`).join("")}
            </div>`).join("") || `<p class="sheet-help" style="padding:0 1.3rem 1rem">Nothing scheduled.</p>`}
        </div>`;
    const nowEl = el.querySelector(".bd-block.now");
    if (nowEl && !who) nowEl.scrollIntoView({ block: "nearest" });
}

function applyFocus() {
    const svg = document.getElementById("mapSvg");
    const bar = document.getElementById("focusBar");
    if (!svg || !bar) return;
    if (!focusName) {
        svg.classList.remove("focusing");
        bar.classList.remove("active");
        return;
    }
    svg.classList.add("focusing");
    svg.querySelectorAll(".mm-node").forEach(g => {
        const mine = g.dataset.name === focusName;
        g.classList.toggle("keep", mine || g.classList.contains("root") || g.classList.contains("group") || g.classList.contains("branch"));
        g.classList.toggle("focused", mine);
    });
    const p = result.people.find(x => x.name === focusName);
    const b = result.breaks.find(x => x.name === focusName);
    const tasks = result.tasks.filter(k => k.name === focusName).map(k => `${k.label} ${fmtT(k.start)}-${fmtT(k.end)}`);
    bar.innerHTML = `<span>Showing <b>${esc(focusName)}</b></span>
        ${p ? `<span>Shift ${fmtT(p.shiftStart ?? p.start)}-${fmtT(p.shiftEnd ?? p.end)}</span>` : ""}
        ${b ? `<span>Break ${fmtT(b.start)}-${fmtT(b.end)}</span>` : ""}
        ${tasks.length ? `<span>${esc(tasks.join(" · "))}</span>` : ""}
        <span class="focus-actions">
            ${result.people.some(x => x.name === focusName) ? `<button type="button" class="focus-bd" onclick="openMove(focusName)">Move</button>` : ""}
            <button type="button" class="focus-bd narrow-only" onclick="openBreakdown(focusName)">Breakdown for ${esc(focusName.split(" ")[0])}</button>
            <button type="button" onclick="focusPerson(focusName)">Clear</button>
        </span>`;
    bar.classList.add("active");
}

window.addEventListener("resize", () => { if (view === "lineup" && typeof zoom !== "number") applyZoom(); });
setInterval(() => { if (view === "lineup" && result && showNow && !document.querySelector(".modal-overlay.active")) { renderMap(); } }, 60000);

// =====================================================================
// EXPORTS
// =====================================================================
function fileBase() { return `lineup-${result.date}-${result.daypart}`; }

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function openExport() {
    const has = !!result;
    document.querySelectorAll("#exportModal .needs-result").forEach(b => { b.disabled = !has; });
    const shareBtn = document.getElementById("sharePngBtn");
    shareBtn.style.display = canShareFiles() ? "" : "none";
    document.querySelectorAll(".poster-share").forEach(b => { b.style.display = canShareFiles() ? "" : "none"; });
    const help = [];
    if (!has) help.push("Generate a lineup first to export it.");
    if (!lineupFormReady()) help.push("Saving to Google Sheets isn't set up yet — paste the form and sheet IDs into LINEUP_FORM at the top of the code.");
    help.push("The .mm file opens in mind map apps that import FreeMind maps. The .lineup file keeps everything (roster, tasks, breaks) and reopens here with Import.");
    document.getElementById("exportHelp").innerText = help.join(" ");
    document.getElementById("exportModal").classList.add("active");
}
function closeExport() { document.getElementById("exportModal").classList.remove("active"); }

function canShareFiles() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] })); } catch (e) { return false; }
}

function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawMap(ctx, L) {
    (L.seps || []).forEach(l => {
        ctx.save(); ctx.strokeStyle = "#d3dde8"; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke(); ctx.restore();
    });
    L.edges.forEach(e => {
        ctx.strokeStyle = e.color;
        ctx.lineWidth = e.wd;
        ctx.lineCap = "round";
        ctx.stroke(new Path2D(e.d));
    });
    L.nodes.forEach(n => {
        roundRectPath(ctx, n.x, n.y, n.w, n.h, n.r);
        ctx.fillStyle = n.fill;
        ctx.fill();
        if (n.stroke) {
            ctx.setLineDash(n.dash ? [5, 4] : []);
            ctx.lineWidth = n.sw;
            ctx.strokeStyle = n.stroke;
            ctx.stroke();
            ctx.setLineDash([]);
        }
        n.lines.forEach(l => {
            ctx.font = `${l.italic ? "italic " : ""}${l.weight} ${l.size}px ${MAP_FONT}`;
            ctx.fillStyle = l.color;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(l.text, n.x + n.w / 2, n.y + n.h / 2 + l.dy);
        });
    });
}

async function exportPNG(share) {
    if (!result) return;
    try { await document.fonts.ready; } catch (e) {}
    const L = layoutMap(result, { now: false });
    const sc = 2;
    const c = document.createElement("canvas");
    c.width = L.w * sc;
    c.height = L.h * sc;
    const ctx = c.getContext("2d");
    ctx.scale(sc, sc);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, L.w, L.h);
    drawMap(ctx, L);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    if (!blob) { showStatusMessage("Couldn't create the picture.", "error"); return; }
    const name = fileBase() + ".png";
    if (share && canShareFiles()) {
        try {
            await navigator.share({ files: [new File([blob], name, { type: "image/png" })], title: `${result.daypart} Lineup` });
            return;
        } catch (e) {
            if (e && e.name === "AbortError") return;
        }
    }
    downloadBlob(blob, name);
    showStatusMessage("Picture saved.", "success", 2500);
}

// =====================================================================
// LINEUP + BREAKDOWN POSTER (one picture to print or put on a screen)
// =====================================================================
function wrapText(ctx, text, maxW) {
    const words = String(text).split(" ");
    const out = [];
    let line = "";
    words.forEach(w => {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = "   " + w; }
        else line = test;
    });
    if (line) out.push(line);
    return out;
}

function buildPoster(res) {
    const L = layoutMap(res, { now: false });
    const blocks = breakdownBlocks(res);
    const HEADER = 92, PAD = 28, GAP = 28, COL_W = 360, COL_GAP = 18;
    const TIME_H = 28, LINE_H = 21, BLOCK_GAP = 14, INNER = 16;
    const measure = document.createElement("canvas").getContext("2d");
    const lineFont = `500 15px ${MAP_FONT}`;
    measure.font = lineFont;

    // Lay out breakdown blocks (wrapped lines) and flow them into columns about as tall as the map
    const laid = blocks.map(b => {
        const rows = b.lines.flatMap(l => wrapText(measure, l.text, COL_W - INNER * 2 - 10).map((txt, j) => ({ txt, brk: /^Break/.test(l.text), first: j === 0 })));
        return { t: b.t, rows, h: TIME_H + rows.length * LINE_H + BLOCK_GAP };
    });
    const total = laid.reduce((a, b) => a + b.h, 0);
    const tallest = Math.max(0, ...laid.map(b => b.h));
    // Flow the blocks into n columns (filling each up to colH)
    const flow = colH => {
        const cols = [[]];
        let used = 0;
        laid.forEach(b => {
            if (used + b.h > colH && cols[cols.length - 1].length) { cols.push([]); used = 0; }
            cols[cols.length - 1].push(b);
            used += b.h;
        });
        return cols;
    };
    // Pick the column count that makes the whole picture closest to a landscape page (about 1.35 : 1)
    let best = null;
    for (let n = 1; n <= 5; n++) {
        const colH = Math.max(Math.ceil(total / n) + tallest, Math.min(L.h, total) - 50);
        const cols = flow(colH);
        if (cols.length > n + 1) continue;
        const bw = cols.length * COL_W + (cols.length - 1) * COL_GAP;
        const bh = Math.max(L.h, Math.max(...cols.map(c => c.reduce((a, b) => a + b.h, 0))) + 50);
        const ratio = (PAD + L.w + GAP + bw + PAD) / (HEADER + bh + PAD);
        const score = Math.abs(Math.log(ratio / 1.35));
        if (!best || score < best.score - 0.02) best = { cols, score };
    }
    const cols = best ? best.cols : [laid];
    const bdW = cols.length * COL_W + (cols.length - 1) * COL_GAP;
    const bodyH = Math.max(L.h, Math.max(...cols.map(c => c.reduce((a, b) => a + b.h, 0))) + 50);
    const W = PAD + L.w + GAP + bdW + PAD;
    const H = HEADER + bodyH + PAD;
    return { L, cols, W, H, HEADER, PAD, GAP, COL_W, COL_GAP, TIME_H, LINE_H, BLOCK_GAP, INNER, bodyH, lineFont };
}

async function posterCanvas(res) {
    try { await document.fonts.ready; } catch (e) {}
    const P = buildPoster(res);
    const sc = Math.min(2, 15000 / Math.max(P.W, P.H));
    const c = document.createElement("canvas");
    c.width = Math.round(P.W * sc);
    c.height = Math.round(P.H * sc);
    const ctx = c.getContext("2d");
    ctx.scale(sc, sc);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, P.W, P.H);

    // Header band
    ctx.fillStyle = "#002a4f";
    ctx.fillRect(0, 0, P.W, P.HEADER - 16);
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(0, P.HEADER - 16, P.W, 4);
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff";
    ctx.font = `800 30px ${MAP_FONT}`;
    ctx.fillText(`${res.daypart} Lineup — ${prettyDate(res.date)}`, P.PAD, 32);
    ctx.fillStyle = "#cbd5e1";
    ctx.font = `600 15px ${MAP_FONT}`;
    const sub = [windowLabel(res), MODES[res.mode] ? MODES[res.mode].long : "",
        res.rotation ? `outside rotation every ${res.rotation >= 60 ? res.rotation / 60 + " hr" : res.rotation + " min"}` : "",
        res.calledOff && res.calledOff.length ? `called off: ${res.calledOff.join(", ")}` : ""].filter(Boolean).join("  ·  ");
    ctx.fillText(sub, P.PAD, 60);
    ctx.textAlign = "right";
    ctx.fillStyle = "#94a3b8";
    ctx.font = `600 13px ${MAP_FONT}`;
    ctx.fillText(`Made ${new Date().toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" })}`, P.W - P.PAD, 32);

    // Section labels
    const top = P.HEADER;
    ctx.textAlign = "left";
    ctx.fillStyle = "#5C768D";
    ctx.font = `800 12px ${MAP_FONT}`;
    ctx.fillText("LINEUP", P.PAD, top + 6);
    const bx = P.PAD + P.L.w + P.GAP;
    ctx.fillText("TIME BREAKDOWN", bx, top + 6);

    // Map
    ctx.save();
    ctx.translate(P.PAD, top + 14);
    drawMap(ctx, P.L);
    ctx.restore();

    // Divider
    ctx.strokeStyle = "#e1e8f0";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx - P.GAP / 2, top);
    ctx.lineTo(bx - P.GAP / 2, top + P.bodyH);
    ctx.stroke();

    // Breakdown columns
    P.cols.forEach((col, ci) => {
        const x = bx + ci * (P.COL_W + P.COL_GAP);
        let y = top + 22;
        const colH = col.reduce((a, b) => a + b.h, 0) + 8;
        roundRectPath(ctx, x, y - 6, P.COL_W, colH, 14);
        ctx.fillStyle = "#f5f8fb";
        ctx.fill();
        col.forEach(b => {
            ctx.textAlign = "left";
            ctx.fillStyle = "#002a4f";
            ctx.font = `800 17px ${MAP_FONT}`;
            ctx.fillText(fmtClock(b.t), x + P.INNER, y + P.TIME_H / 2 + 2);
            y += P.TIME_H;
            b.rows.forEach(r => {
                ctx.fillStyle = r.brk ? "#3b82f6" : "#c7d3e0";
                if (r.first) ctx.fillRect(x + P.INNER, y + 3, 3, P.LINE_H - 6);
                ctx.fillStyle = r.brk ? "#1e40af" : "#1e293b";
                ctx.font = P.lineFont;
                ctx.fillText(r.txt, x + P.INNER + 10, y + P.LINE_H / 2);
                y += P.LINE_H;
            });
            y += P.BLOCK_GAP;
        });
    });
    return c;
}

async function exportPoster(how) {
    if (!result) return;
    const c = await posterCanvas(result);
    if (how === "screen") { showPoster(c); return; }
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    if (!blob) { showStatusMessage("Couldn't create the picture.", "error"); return; }
    const name = `${fileBase()}-with-breakdown.png`;
    if (how === "print") { printImage(URL.createObjectURL(blob), c.width > c.height); return; }
    if (how === "share" && canShareFiles()) {
        try { await navigator.share({ files: [new File([blob], name, { type: "image/png" })], title: `${result.daypart} Lineup` }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
    }
    downloadBlob(blob, name);
    showStatusMessage("Lineup + breakdown picture saved.", "success", 2500);
}

// Prints just the picture, scaled to fit one page
function printImage(url, landscape) {
    const f = document.createElement("iframe");
    f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
    document.body.appendChild(f);
    const d = f.contentWindow.document;
    d.open();
    d.write(`<!doctype html><html><head><title>Lineup</title><style>
        @page { size: ${landscape ? "landscape" : "portrait"}; margin: 0.25in; }
        html, body { margin: 0; height: 100%; }
        body { display: flex; align-items: center; justify-content: center; }
        img { max-width: 100%; max-height: 100vh; object-fit: contain; }
    </style></head><body><img src="${url}"></body></html>`);
    d.close();
    const img = d.querySelector("img");
    const go = () => {
        f.contentWindow.focus();
        f.contentWindow.print();
        setTimeout(() => { f.remove(); URL.revokeObjectURL(url); }, 60000);
    };
    if (img.complete) setTimeout(go, 50); else img.onload = () => setTimeout(go, 50);
}

// Full-screen view for a computer screen in the back
function showPoster(canvas) {
    const ov = document.getElementById("posterView");
    const box = document.getElementById("posterImg");
    box.innerHTML = "";
    canvas.style.cssText = "max-width:100%;max-height:100%;width:auto;height:auto;display:block;margin:auto;";
    box.appendChild(canvas);
    ov.classList.add("active");
    try { if (ov.requestFullscreen) ov.requestFullscreen().catch(() => {}); } catch (e) {}
}
function closePoster() {
    document.getElementById("posterView").classList.remove("active");
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("posterView").classList.contains("active")) closePoster(); });

function lineupText(res) {
    const W1 = res.window[1];
    const lines = [`LINEUP — ${res.daypart} · ${prettyDate(res.date)} (${MODES[res.mode] ? MODES[res.mode].long : ""})`, ""];
    if (res.calledOff && res.calledOff.length) lines.splice(1, 0, `Called off: ${res.calledOff.join(", ")}`);
    ["FC", "DT", "Outside"].forEach(g => {
        const rows = POSITIONS.filter(p => p.group === g && (res.positions[p.name] || []).length);
        if (!rows.length) return;
        lines.push(g.toUpperCase());
        rows.forEach(p => lines.push(`  ${p.name}: ${res.positions[p.name].map(s => `${s.name} ${fmtRange(s.from, s.to, W1)}`).join(" → ")}`));
        lines.push("");
    });
    if (res.breaks.length) {
        lines.push("BREAKS");
        res.breaks.slice().sort((a, b) => a.start - b.start || a.name.localeCompare(b.name)).forEach(b => {
            lines.push(`  ${fmtT(b.start).padEnd(4)}  ${b.name} → ${breakCover(b).text}${b.backfill ? ` (${b.backfill} takes ${b.backfillPos})` : ""}${b.kind === "merge" ? ` (${b.trainee} trains with ${b.mergeWith})` : ""}`);
        });
        lines.push("");
    }
    if ((res.sessions || []).length) {
        lines.push("TRAINING");
        res.sessions.slice().sort((a, b) => a.trainee.localeCompare(b.trainee) || a.start - b.start).forEach(x => lines.push(`  ${x.trainee}: ${x.pos} with ${x.trainer} ${fmtT(x.start)}-${fmtT(x.end)}`));
        lines.push("");
    }
    const plain = res.tasks.filter(k => k.type !== "closing");
    if (plain.length) {
        lines.push("TASKS");
        plain.forEach(k => lines.push(`  ${k.label}: ${k.name || "Unassigned"} ${fmtT(k.start)}-${fmtT(k.end)}${k.deadline ? ` (ready by ${fmtT(k.deadline)})` : ""}`));
        lines.push("");
    }
    const c = res.closing;
    if (c) {
        const also = b => b.notes && b.notes.length ? ` (also: ${b.notes.join("; ")})` : "";
        lines.push(`CLOSING (inside closes ${fmtClock(toMin(INSIDE_CLOSE))})`);
        if (c.cuts.length) lines.push(`  ${c.cuts.join(" · ")}`);
        lines.push("  9:00-10:00");
        c.spots.filter(s => !s.from).forEach(s => lines.push(`    ${s.pos}: ${s.name}`));
        if (c.lead) lines.push(`    Lead: ${c.lead}`);
        c.block930.forEach(b => {
            const then = c.spots.find(s => s.from && s.name === b.name);
            lines.push(`    ${b.area}: ${b.name || "Nobody"} ${fmtT(b.start)}-${fmtT(b.end)}${then ? `, then ${then.pos}` : b.thenHelp ? `, then help ${b.thenHelp}` : ""}${also(b)}`);
        });
        if (c.block1030.length) {
            lines.push("  10:00-10:30");
            c.block1030.forEach(b => lines.push(`    ${b.area}: ${b.name || "Nobody"}${also(b)}`));
        }
        lines.push("");
    }
    return lines.join("\n").trim() + "\n";
}

// =====================================================================
// TIME BLOCK BREAKDOWN
// =====================================================================
function segAt(segs, t) { return (segs || []).find(x => x.from <= t && t < x.to) || null; }

// Every change, grouped by time: spots opening/handing over, tasks, breaks
function breakdownBlocks(res) {
    const [W0, W1] = res.window;
    const order = POSITIONS.map(p => p.name);
    const blocks = [];
    for (let t = W0; t < W1; t += STEP) {
        const lines = [];
        order.forEach(pos => {
            const segs = res.positions[pos] || [];
            const now = segAt(segs, t), before = t > W0 ? segAt(segs, t - STEP) : null;
            const n = now && now.name, b = before && before.name;
