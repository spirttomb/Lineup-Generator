<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#001b35">
    <title>Lineup Builder</title>
    <style>
        @font-face {
            font-family: 'Apercu Regular Pro';
            src: url('apercu_regular_pro.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --navy-950: #001b35;
            --navy-900: #002a4f;
            --navy-800: #003d73;
            --navy-700: #044e8f;
            --gold: #f59e0b;
            --gold-hi: #fbbf24;
            --gold-soft: #fef3c7;
            --ink: #1e293b;
            --muted: #5C768D;
            --line: #e1e8f0;
            --line-strong: #c7d3e0;
            --surface: #ffffff;
            --canvas: #edf1f6;
            --tint: #f5f8fb;
            --radius: 18px;
            --shadow-sm: 0 1px 2px rgba(0, 27, 53, 0.06), 0 2px 6px rgba(0, 27, 53, 0.06);
            --shadow-md: 0 12px 32px -12px rgba(0, 27, 53, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--canvas);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        input, select, textarea, button { font-family: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        svg { flex-shrink: 0; }

        /* ---------- App bar ---------- */
        .appbar { background: var(--navy-950); color: #fff; position: sticky; top: 0; z-index: 60; }
        .appbar-inner {
            max-width: 1500px; margin: 0 auto; padding: 0.65rem 1.5rem;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
        }
        .brand { display: flex; align-items: center; gap: 0.7rem; }
        .brand-mark {
            width: 36px; height: 36px; border-radius: 11px; background: var(--gold); color: var(--navy-950);
            display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }
        .brand-name { font-weight: 800; font-size: 1.08rem; letter-spacing: -0.01em; line-height: 1; }
        .brand-name small { display: block; font-weight: 600; font-size: 0.66rem; color: #8ea6bf; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 0.25rem; }

        .dp-switch { display: flex; background: rgba(255, 255, 255, 0.08); border-radius: 999px; padding: 3px; gap: 2px; }
        .am-pm-btn {
            border: none; background: transparent; color: #a9bdd1; font-weight: 700; font-size: 0.9rem;
            padding: 0.45rem 1rem; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
            transition: background 0.2s, color 0.2s;
        }
        .am-pm-btn:hover { color: #fff; }
        .am-pm-btn.active { background: var(--gold); color: var(--navy-950); }

        .appbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.2rem; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 11px; border: none; background: transparent; color: #c6d5e4;
            display: grid; place-items: center; cursor: pointer; transition: background 0.15s, color 0.15s;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        /* ---------- Header band ---------- */
        .hero {
            background:
                radial-gradient(1200px 300px at 85% -40%, rgba(245, 158, 11, 0.16), transparent 60%),
                linear-gradient(180deg, var(--navy-800), var(--navy-900));
            color: #fff; padding: 1.75rem 1.5rem 4.75rem;
        }
        .hero-inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; }
        .eyebrow { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-hi); }
        .hero h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.35rem; line-height: 1.1; }
        .hero-sub { color: #aebfd1; font-size: 0.92rem; margin-top: 0.4rem; }
        .view-tabs { display: flex; gap: 0.25rem; background: rgba(0, 0, 0, 0.22); padding: 4px; border-radius: 13px; }
        .nav-tab {
            display: flex; align-items: center; gap: 0.5rem; border: none; background: transparent; color: #c3d2e1;
            padding: 0.6rem 1.15rem; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
        }
        .nav-tab:hover { color: #fff; }
        .nav-tab.active { background: #fff; color: var(--navy-900); }
        .tab-count { background: var(--gold); color: var(--navy-950); font-size: 0.72rem; font-weight: 800; border-radius: 999px; padding: 0.05rem 0.45rem; min-width: 1.3rem; text-align: center; }
        .tab-count:empty { display: none; }

        /* ---------- Workspace ---------- */
        .workspace { max-width: 1500px; margin: -3.25rem auto 0; padding: 0 1.5rem 3rem; position: relative; }
        body.wide .workspace { display: grid; grid-template-columns: minmax(380px, 440px) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
        body.wide .view-tabs { display: none; }
        body.wide .people { max-height: 52vh; overflow-y: auto; margin-right: -0.5rem; padding-right: 0.5rem; }
        body.wide .lineup-lower { grid-template-columns: 1.35fr 1fr; }

        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 1.25rem; }
        .card-head { display: flex; align-items: center; gap: 0.8rem; padding: 1.15rem 1.3rem 0.35rem; flex-wrap: wrap; }
        .card-head .push { margin-left: auto; }
        .card-head.nowrap { flex-wrap: nowrap; }
        .card-head.nowrap > div { min-width: 0; }
        .card-head.nowrap .count-pill { white-space: nowrap; flex-shrink: 0; }
        .step {
            width: 30px; height: 30px; border-radius: 9px; background: var(--navy-900); color: var(--gold-hi);
            display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
        }
        .card-title { font-size: 1.08rem; font-weight: 800; color: var(--navy-900); letter-spacing: -0.01em; }
        .card-sub { color: var(--muted); font-size: 0.84rem; margin-top: 0.1rem; }
        .card-body { padding: 0.85rem 1.3rem 1.3rem; }
        .count-pill { background: var(--gold-soft); color: #92400e; font-weight: 800; font-size: 0.78rem; padding: 0.3rem 0.7rem; border-radius: 999px; }
        .stale { color: #b45309; font-weight: 700; }

        /* ---------- Fields ---------- */
        .field {
            width: 100%; background: var(--tint); border: 1.5px solid var(--line); border-radius: 13px;
            padding: 0.8rem 0.95rem; font-size: 1rem; color: var(--ink); transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .time-input {
            background: var(--tint); border: 1.5px solid var(--line); border-radius: 10px;
            padding: 0.45rem 0.55rem; font-size: 0.95rem; color: var(--ink); min-width: 0;
        }
        .field:focus, .time-input:focus { outline: none; border-color: var(--gold); background: #fff; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18); }
        .search-field { position: relative; }
        .search-field > svg { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
        .search-field .field { padding-left: 2.7rem; }

        .suggest-list {
            display: none; position: fixed; max-height: 260px; overflow-y: auto; background: #fff; border-radius: 14px;
            box-shadow: var(--shadow-md), 0 0 0 1px var(--line); z-index: 2000; padding: 5px;
        }
        .suggest-item { padding: 0.62rem 0.75rem; border-radius: 9px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-weight: 700; color: var(--ink); }
        .suggest-item small { color: var(--muted); font-weight: 500; font-size: 0.8rem; text-align: right; }
        .suggest-item:hover, .suggest-item.highlighted { background: var(--gold-soft); }

        .hint-line { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 0.85rem 0 0.4rem; color: var(--muted); font-size: 0.86rem; }
        .shift-pair { display: inline-flex; align-items: center; gap: 0.4rem; }

        /* ---------- People ---------- */
        .people { margin-top: 0.6rem; }
        .person {
            display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "chip meta toggle" "times times times";
            gap: 0.55rem 0.6rem; align-items: center; padding: 0.75rem 0; border-top: 1px solid var(--line);
        }
        .person .hc-chip { grid-area: chip; justify-self: start; max-width: 100%; }
        .person .shift-meta { grid-area: meta; }
        .person .mini-toggle { grid-area: toggle; }
        .person .shift-times { grid-area: times; }
        .person.bad .time-input { border-color: #ef4444; background: #fef2f2; }
        .hc-chip {
            display: inline-flex; align-items: center; gap: 0.5rem; background: var(--navy-900); color: #fff;
            border-radius: 999px; padding: 0.22rem 0.25rem 0.22rem 0.22rem; font-weight: 700; font-size: 0.95rem; min-width: 0;
        }
        .chip-avatar { width: 27px; height: 27px; border-radius: 50%; background: var(--gold); color: var(--navy-950); display: grid; place-items: center; font-size: 0.7rem; font-weight: 800; flex-shrink: 0; }
        .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 0.1rem; }
        .hc-chip-x { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-size: 0.68rem; cursor: pointer; color: #9fb3c8; flex-shrink: 0; }
        .hc-chip-x:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
        .shift-times { display: flex; align-items: center; gap: 0.45rem; color: var(--muted); font-size: 0.85rem; }
        .shift-times .time-input { flex: 1; }
        .shift-meta { font-size: 0.8rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
        .shift-meta .brk { color: #2563eb; }
        .mini-toggle {
            border: 1.5px solid var(--line-strong); background: #fff; color: var(--muted); border-radius: 8px;
            padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.76rem; cursor: pointer;
        }
        .mini-toggle:hover { border-color: var(--navy-800); color: var(--navy-800); }
        .mini-toggle.on { background: var(--navy-900); border-color: var(--navy-900); color: var(--gold-hi); }

        .empty-note { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; text-align: center; color: var(--muted); padding: 1.6rem 1rem; border: 1.5px dashed var(--line-strong); border-radius: 14px; margin-top: 0.6rem; font-size: 0.9rem; }
        .empty-note b { color: var(--navy-900); font-size: 0.98rem; }
        .empty-note svg { color: var(--line-strong); margin-bottom: 0.2rem; }

        .row-actions { display: flex; gap: 1.1rem; padding-top: 0.6rem; border-top: 1px solid var(--line); }
        .link-btn { background: none; border: none; color: var(--navy-700); font-weight: 700; font-size: 0.87rem; cursor: pointer; padding: 0.35rem 0.15rem; }
        .link-btn:hover { text-decoration: underline; }
        .link-btn.danger { color: #dc2626; }

        /* ---------- Tasks ---------- */
        .task { display: flex; gap: 0.9rem; padding: 0.95rem 0; border-top: 1px solid var(--line); }
        .task:first-child { border-top: none; padding-top: 0.15rem; }
        .task-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; }
        .task-icon.lemon { background: #fef9c3; color: #a16207; }
        .task-icon.sweep { background: #e0e7ff; color: #4338ca; }
        .task-icon.ice { background: #e0f2fe; color: #0369a1; }
        .task-main { flex: 1; min-width: 0; }
        .task-name { font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; color: var(--navy-900); }
        .task-desc { color: var(--muted); font-size: 0.83rem; margin: 0.15rem 0 0.55rem; }
        .task-line { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.45rem; color: var(--muted); font-size: 0.88rem; }
        .times-inline { font-weight: 700; color: var(--navy-800); font-size: 0.82rem; }
        .icon-x { border: none; background: transparent; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
        .icon-x:hover { background: #fee2e2; color: #dc2626; }

        .switch { position: relative; width: 46px; height: 26px; border: none; border-radius: 999px; background: #cbd5e1; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
        .switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.2s, background 0.2s; }
        .switch.on { background: var(--navy-800); }
        .switch.on i { transform: translateX(20px); background: var(--gold); }

        /* ---------- Options ---------- */
        .opt { padding: 0.9rem 0; border-top: 1px solid var(--line); }
        .opt:first-child { border-top: none; padding-top: 0.15rem; }
        .opt-label { font-weight: 800; color: var(--navy-900); margin-bottom: 0.5rem; font-size: 0.95rem; }
        .opt-help { color: var(--muted); font-size: 0.83rem; margin-top: 0.5rem; line-height: 1.4; }
        .seg { display: inline-flex; background: var(--canvas); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
        .seg button { border: none; background: transparent; padding: 0.48rem 0.85rem; border-radius: 9px; font-weight: 700; font-size: 0.87rem; color: var(--muted); cursor: pointer; }
        .seg button:hover { color: var(--navy-900); }
        .seg button.on { background: #fff; color: var(--navy-900); box-shadow: var(--shadow-sm); }

        /* ---------- Buttons ---------- */
        .btn-primary {
            background: var(--gold); color: var(--navy-950); border: none; border-radius: 13px; padding: 0.95rem 1.4rem;
            font-weight: 800; font-size: 1.02rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
            box-shadow: 0 8px 18px -8px rgba(245, 158, 11, 0.8); transition: background 0.15s, transform 0.1s;
        }
        .btn-primary:hover { background: var(--gold-hi); }
        .btn-primary:active { transform: translateY(1px); }
        .btn-primary.block { width: 100%; }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-secondary, .btn-dark {
            border-radius: 10px; padding: 0.5rem 0.85rem; font-weight: 700; font-size: 0.87rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap;
        }
        .btn-secondary { background: #fff; border: 1.5px solid var(--line-strong); color: var(--navy-900); }
        .btn-secondary:hover { border-color: var(--navy-800); }
        .btn-secondary.on { background: var(--navy-900); border-color: var(--navy-900); color: var(--gold-hi); }
        .btn-dark { background: var(--navy-900); border: 1.5px solid var(--navy-900); color: #fff; }
        .btn-dark:hover { background: var(--navy-700); }
        .generate-bar { position: sticky; bottom: 0; padding: 0.4rem 0 1rem; background: linear-gradient(rgba(237, 241, 246, 0), var(--canvas) 40%); z-index: 5; }
        body.wide .generate-bar { position: static; background: none; padding-top: 0; }

        .saved-banner {
            background: var(--gold-soft); border: 1.5px solid #fcd34d; border-radius: 14px; padding: 0.7rem 0.9rem; margin-bottom: 1.1rem;
            display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; font-size: 0.9rem; font-weight: 600; color: #78350f; box-shadow: var(--shadow-sm);
        }
        .saved-banner button { background: var(--navy-900); color: #fff; border: none; border-radius: 8px; padding: 0.4rem 0.8rem; font-weight: 700; cursor: pointer; }
        .saved-banner button.x { background: transparent; color: #78350f; margin-left: auto; padding: 0.3rem 0.5rem; }

        /* ---------- Lineup ---------- */
        .map-toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; padding: 0.6rem 1.3rem 0.9rem; }
        .toolbar-spacer { flex: 1; }
        .zoom-group { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: #fff; }
        .zoom-group button { border: none; background: transparent; padding: 0.45rem 0.75rem; font-weight: 800; cursor: pointer; color: var(--navy-900); font-size: 0.87rem; }
        .zoom-group button + button { border-left: 1px solid var(--line); }
        .zoom-group button.on { background: var(--navy-900); color: var(--gold-hi); }
        .legend { display: flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; color: var(--muted); padding: 0 1.3rem 0.7rem; }
        .legend i { width: 0.85rem; height: 0.85rem; border-radius: 0.25rem; border: 2px solid var(--gold); background: rgba(245, 158, 11, 0.2); }

        .focus-bar { display: none; margin: 0 1.3rem 0.8rem; background: var(--navy-950); color: #d7e2ec; border-radius: 12px; padding: 0.55rem 0.6rem 0.55rem 0.95rem; align-items: center; gap: 0.9rem; flex-wrap: wrap; font-size: 0.88rem; }
        .focus-bar.active { display: flex; }
        .focus-bar b { color: var(--gold-hi); }
        .focus-bar button { margin-left: auto; background: var(--gold); color: var(--navy-950); border: none; border-radius: 8px; padding: 0.35rem 0.75rem; font-weight: 800; cursor: pointer; }

        .map-wrap {
            background-color: #f7f9fc;
            background-image: radial-gradient(#d3dde8 1.1px, transparent 1.1px);
            background-size: 18px 18px;
            border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
            overflow: auto; max-height: 74vh; -webkit-overflow-scrolling: touch;
        }
        .map-wrap svg { display: block; }
        .map-foot { color: var(--muted); font-size: 0.8rem; padding: 0.7rem 1.3rem 1rem; }
        .mm-node.clickable { cursor: pointer; }
        .mm-node.clickable:hover rect { filter: brightness(0.96); }
        #mapSvg path, #mapSvg .mm-node { transition: opacity 0.2s; }
        #mapSvg.focusing .mm-node { opacity: 0.16; }
        #mapSvg.focusing .mm-node.keep { opacity: 1; }
        #mapSvg.focusing .mm-node.focused rect { stroke: #001b35; stroke-width: 3.5; }
        #mapSvg.focusing path { opacity: 0.28; }

        .lineup-lower { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        .lineup-lower > .card { margin-bottom: 0; }
        .lineup-lower > div > .card:last-child { margin-bottom: 0; }
        .warn-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .warn-list li { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.65rem 0.8rem; border-radius: 11px; background: #fff7ed; color: #7c2d12; font-size: 0.9rem; line-height: 1.4; }
        .warn-list li::before { content: "!"; flex-shrink: 0; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--gold); color: var(--navy-950); font-weight: 900; font-size: 0.75rem; display: grid; place-items: center; margin-top: 0.05rem; }
        .warn-list li.ok { background: #ecfdf5; color: #065f46; }
        .warn-list li.ok::before { content: "\2713"; background: #10b981; color: #fff; }
        .break-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
        .break-row:first-child { border-top: none; padding-top: 0; }
        .break-row > div:first-child, .break-row > .task-icon + div { flex: 1; min-width: 9rem; }
        .break-row b { color: var(--navy-900); }
        .break-sub { color: var(--muted); font-size: 0.82rem; margin-top: 0.1rem; }
        .auto-tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; padding: 0.3rem 0.4rem; min-width: 3rem; text-align: center; }

        .empty-card { text-align: center; padding: 3.5rem 1.5rem; }
        .empty-art { width: 64px; height: 64px; border-radius: 18px; background: var(--navy-900); color: var(--gold-hi); display: grid; place-items: center; margin: 0 auto 1.1rem; }
        .empty-card h2 { font-size: 1.5rem; color: var(--navy-900); margin-bottom: 0.5rem; }
        .empty-card p { color: var(--muted); margin: 0 auto 1.4rem; max-width: 26rem; }

        /* ---------- Sheets (pop-ups) ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 27, 53, 0.55); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .sheet {
            background: #fff; border-radius: 22px; width: 94%; max-width: 640px; max-height: 88vh; overflow: auto;
            box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.55); transform: translateY(14px); transition: transform 0.25s;
        }
        .sheet.wide-sheet { max-width: 920px; }
        .modal-overlay.active .sheet { transform: none; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
        .sheet-head h3 { font-size: 1.15rem; font-weight: 800; color: var(--navy-900); }
        .sheet-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--canvas); cursor: pointer; color: var(--navy-900); display: grid; place-items: center; }
        .sheet-close:hover { background: var(--line-strong); }
        .sheet-body { padding: 1.2rem 1.3rem 1.4rem; }
        .sheet-help { color: var(--muted); font-size: 0.85rem; line-height: 1.45; margin-top: 0.4rem; }

        .export-group { margin-bottom: 1.2rem; }
        .export-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.55rem; }

        .ratings-scroll { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }

        /* ---------- Toast ---------- */
        #statusMessageBar {
            position: fixed; left: 50%; bottom: 1.25rem; transform: translate(-50%, 140%); z-index: 3000;
            background: var(--navy-950); color: #fff; padding: 0.75rem 1.15rem; border-radius: 14px; font-weight: 700; font-size: 0.92rem;

        #statusMessageBar.error { background: #b91c1c; }
        #statusMessageBar.warning { background: var(--gold); color: var(--navy-950); }

        @media (max-width: 900px) {
            .lineup-lower { grid-template-columns: 1fr; }

            .appbar-inner { grid-template-columns: auto 1fr auto; padding: 0.55rem 0.9rem; gap: 0.6rem; }

            #statusMessageBar.show { transform: translate(-50%, 0); }

// =====================================================================

// =====================================================================
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toMin(hhmm) { if (!hhmm) return null; const m = String(hhmm).match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function hhmm(min) { min = ((min % 1440) + 1440) % 1440; return `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`; }
function fmtT(min) { min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min / 60), m = min % 60; const h12 = h % 12 || 12; return m ? `${h12}${String(m).padStart(2, "0")}` : `${h12}`; }
function fmtClock(min) { min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min / 60), m = min % 60; return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; }
function fmtRange(from, to, closeAt) { return `${fmtT(from)}-${to >= closeAt ? "" : fmtT(to)}`; }
function round15(m) { return Math.round(m / STEP) * STEP; }
function durLabel(min) { const h = min / 60; return `${Number.isInteger(h) ? h : h.toFixed(2).replace(/0$/, "")}h`; }
function businessDate() { return new Date(Date.now() - 4 * 3600 * 1000); }
function isoDate(d) { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function todayIso() { return isoDate(businessDate()); }
function prettyDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }); }
function shortDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" }); }
function shiftMinutes(r) { const s = toMin(r.start), e = toMin(r.end); if (s === null || e === null) return 0; let d = e - s; if (d <= 0) d += 1440; return d; }
function isPlaceholder(id) { return !id || String(id).includes("PASTE_"); }

function showStatusMessage(message, type = "info", duration = 4000) {

}

    x: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'

    const w = String(name || "").trim().split(/\s+/).filter(Boolean);

// SCHEDULING ENGINE (no DOM - pure function of the roster + ratings)
// =====================================================================
function buildLineup(st, ratings) {
    const warnings = [];
    const people = (st.roster || [])
        .filter(r => r.name && toMin(r.start) !== null && toMin(r.end) !== null)
        .map(r => {
            const s = round15(toMin(r.start));
            let e = round15(toMin(r.end));
            if (e <= s) e += 1440;
            return { name: r.name, start: s, end: e, floater: !!r.floater };
        });
    if (!people.length) return null;

    const W0 = Math.min(...people.map(p => p.start));
    const W1 = Math.max(...people.map(p => p.end));
    const slots = [];
    for (let t = W0; t < W1; t += STEP) slots.push(t);

    // A typed clock time placed inside this lineup's window (handles past midnight)
    const norm = v => { let m = toMin(v); if (m === null) return null; m = round15(m); if (m < W0 - 360) m += 1440; return m; };
    const onShift = (p, t) => p.start <= t && t < p.end;
    const headAt = t => people.filter(p => onShift(p, t)).length;
    const peak = Math.max(...slots.map(headAt));
    const runnerSetting = String(st.runners || "auto");
    const maxConc = runnerSetting === "auto" ? (peak >= 14 ? 2 : 1) : Math.max(1, +runnerSetting);
    const inLunch = (s, e) => [0, 1440].some(off => s < LUNCH_BLOCK[1] + off && e > LUNCH_BLOCK[0] + off);

    const tasks = [];
    const busyIntervals = [];
    const concAt = t => busyIntervals.filter(([a, b]) => a <= t && t < b).length;

    // Breaks: soonest at 2 hours in, never 12-1, spread so they don't stack up
    const breaks = [];
    people.filter(p => p.end - p.start > BREAK_MIN_SHIFT)
        .sort((a, b) => a.start - b.start || a.name.localeCompare(b.name))
        .forEach(p => {
            const ideal = p.start + BREAK_AFTER;
            const latest = Math.max(ideal, p.end - 90);
            let chosen = null, override = false;
            const ov = st.breakOverrides && st.breakOverrides[p.name];
            if (ov) {
                const s = norm(ov);
                if (s !== null && s >= p.start && s + BREAK_LEN <= p.end) { chosen = s; override = true; }
            }
            if (chosen === null) {
                for (let s = ideal; s <= latest; s += STEP) {
                    if (inLunch(s, s + BREAK_LEN)) continue;
                    let ok = true;
                    for (let t = s; t < s + BREAK_LEN; t += STEP) if (concAt(t) >= maxConc) ok = false;
                    if (ok) { chosen = s; break; }
                }
            }
            if (chosen === null) {
                for (let s = ideal; s <= latest; s += STEP) if (!inLunch(s, s + BREAK_LEN)) { chosen = s; break; }
                if (chosen !== null) warnings.push(`${p.name}'s break at ${fmtClock(chosen)} overlaps another break or task, so a position closes for it.`);
            }
            if (chosen === null) {
                chosen = ideal;
                warnings.push(`${p.name}'s break could not be kept out of 12–1.`);
            }
            if (!override && chosen - ideal >= 60) warnings.push(`${p.name}'s break was pushed to ${fmtClock(chosen)} (ideal was ${fmtClock(ideal)}).`);
            breaks.push({ name: p.name, start: chosen, end: chosen + BREAK_LEN, ideal, override, pos: null, cover: null });
            busyIntervals.push([chosen, chosen + BREAK_LEN]);
        });

    // ---- Tasks go in the quietest open times, around the breaks ----
    const rush = RUSH_PERIODS.map(([a, b]) => [toMin(a), toMin(b)]);
    const inRush = (s, e) => rush.some(([a, b]) => [0, 1440].some(off => s < b + off && e > a + off));
    // Lower = better: nothing else going on, plenty of people, not during a rush
    const quietCost = (s, len) => {
        let sc = 0;
        for (let t = s; t < s + len; t += STEP) {
            sc += concAt(t) * 10;
            const n = headAt(t);
            if (n === 0) sc += 1000; else if (n < 3) sc += 40; else if (n < 6) sc += 8;
        }
        if (inLunch(s, s + len)) sc += 30;
        if (inRush(s, s + len)) sc += 15;
        return sc;
    };
    const bestSlot = (lo, hi, extra) => {
        let best = lo, bestScore = Infinity;
        for (let s = lo; s <= hi; s += STEP) {
            const sc = extra(s);
            if (sc < bestScore) { bestScore = sc; best = s; }
        }
        return best;
    };
    // A leader can pin any task to a time from the Tasks list
    const pinned = key => {
        const v = st.taskOverrides && st.taskOverrides[key];
        const m = v ? norm(v) : null;
        return (m !== null && m >= W0 && m < W1) ? m : null;
    };
    const addTask = (k) => { tasks.push(k); busyIntervals.push([k.start, k.end]); };

    // Lemonade: 1 hour, done by the time entered, in the quietest hour before that (fresher wins ties)
    (st.lemonade || []).map(norm).filter(v => v !== null).sort((a, b) => a - b).forEach((deadline, idx) => {
        const key = `lemonade#${idx}`;
        let hi = Math.min(deadline - 60, W1 - 60);
        let lo = Math.max(W0, deadline - 180);
        if (hi < W0) {
            hi = lo = W0;
            warnings.push(`Lemonade needed by ${fmtClock(deadline)} can't be done in time — it starts at ${fmtClock(W0)}.`);
        } else if (lo > hi) lo = hi;
        let s = pinned(key);
        if (s === null) s = bestSlot(lo, hi, x => quietCost(x, 60) + (hi - x) / STEP);
        addTask({ type: "lemonade", label: "Lemonade", key, start: s, end: s + 60, deadline, pinned: pinned(key) !== null });
    });

    // Parking lot sweeps: never more than 4 hours apart (counting from the start of the shift),
    // as few as possible, each in the quietest spot of its window
    if (st.sweep && st.sweep.on) {
        let prev = W0, idx = 0;
        while (W1 - prev > SWEEP_EVERY && idx < 8) {
            const key = `sweep#${idx}`;
            const hi = Math.min(prev + SWEEP_EVERY, W1 - 30);
            const lo = Math.min(Math.max(W0, prev + SWEEP_EVERY / 2), hi);
            let s = pinned(key);
            if (s === null) s = bestSlot(lo, hi, x => quietCost(x, 30) + (hi - x) / STEP * 1.5);
            addTask({ type: "sweep", label: "Parking Lot Sweep", key, start: s, end: s + 30, pinned: pinned(key) !== null });
            prev = Math.max(s, prev + STEP);
            idx++;
        }
    }

    // Ice bin: once, 15 minutes, at the quietest point (not in the first hour or the closing stretch)
    if (st.ice && st.ice.on) {
        const key = "ice#0";
        const lo = Math.min(W0 + 60, W1 - 15);
        const hi = Math.max(lo, W1 - 45);
        let s = pinned(key);
        if (s === null) s = bestSlot(lo, hi, x => quietCost(x, 15));
        addTask({ type: "ice", label: "Ice Bin", key, start: s, end: s + 15, pinned: pinned(key) !== null });
    }
    tasks.sort((a, b) => a.start - b.start);

    // Windows where break runners are kept out of position
    const spans = [...breaks.map(b => [b.start, b.end]), ...tasks.map(k => [k.start, k.end])].sort((a, b) => a[0] - b[0]);
    const windows = [];
    spans.forEach(([a, b]) => {
        const w = windows[windows.length - 1];
        if (w && a - w.end <= 30) w.end = Math.max(w.end, b);
        else windows.push({ start: a - STEP, end: b });
    });
    windows.forEach(w => {
        w.maxConc = 0;
        for (let t = w.start; t < w.end; t += STEP) w.maxConc = Math.max(w.maxConc, busyIntervals.filter(([a, b]) => a <= t && t < b).length);
    });
    const runnersAt = (t, n) => {
        if (runnerSetting === "0") return 0;
        const w = windows.find(x => x.start <= t && t < x.end);
        if (!w) return 0;
        if (runnerSetting !== "auto") return +runnerSetting;
        if (n >= 14) return Math.max(1, Math.min(2, w.maxConc));
        if (n >= 7) return 1;
        return 0;
    };

    // Simulation
    const mode = st.mode || "balanced";
    const busy = {};
    people.forEach(p => { busy[p.name] = []; });
    breaks.forEach(b => busy[b.name].push({ start: b.start, end: b.end }));
    const isBusy = (n, t) => busy[n].some(x => x.start <= t && t < x.end);
    const rating = (n, skill) => { const r = ratings && ratings[n] && ratings[n][skill]; return r ? r : 3; };
    const home = {}, homeOwner = {};
    const scoreFor = (p, pos) => {
        const r = rating(p.name, POS_INFO[pos].skill);
        let s;
        if (mode === "aces") s = r;
        else if (mode === "training") s = 6 - r;
        else s = POS_INFO[pos].priority <= 6 ? r : 6 - r;
        if (home[p.name] === pos) s += 2;   // go back to your own spot
        if (p.floater) s -= 100;            // floaters only fill in when needed
        return s;
    };

    const timeline = {};
    POSITIONS.forEach(p => { timeline[p.name] = []; });
    const idleLog = {};
    const shortSlots = [];
    let prev = {};

    for (const t of slots) {
        const on = people.filter(p => onShift(p, t));
        const prevPosOf = {};
        Object.entries(prev).forEach(([pos, n]) => { prevPosOf[n] = pos; });

        // Hand out tasks that start now: someone floating first, otherwise the next-to-lose spot
        tasks.filter(k => k.start === t).forEach(k => {
            const cands = on.filter(p => p.end >= k.end && !busy[p.name].some(x => x.start < k.end && k.start < x.end));
            if (!cands.length) {
                k.name = null;
                warnings.push(`No one is free for ${k.label} at ${fmtClock(k.start)}.`);
                return;
            }
            // Spread the work: skip anyone who just came back from a break or task if possible
            const recent = p => busy[p.name].some(x => x.end <= t && x.end > t - 60) ? 5000 : 0;
            const order = p => recent(p) + (prevPosOf[p.name] ? 1000 - FILL_ORDER.indexOf(prevPosOf[p.name]) : (p.floater ? 0 : 1));
            cands.sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name));
            const who = cands[0];
            k.name = who.name;
            k.pos = prevPosOf[who.name] || null;
            busy[who.name].push({ start: k.start, end: k.end });
        });

        const free = on.filter(p => !isBusy(p.name, t));
        const freeNames = new Set(free.map(p => p.name));
        const floaterCount = on.filter(p => p.floater).length;
        const R = Math.max(runnersAt(t, on.length), floaterCount);
        const K = Math.max(0, Math.min(FILL_ORDER.length, on.length - R, free.length));
        const S = FILL_ORDER.slice(0, K);
        const Sset = new Set(S);

        const assign = {};
        const used = new Set();
        // 1) everyone stays put if their spot is still open
        Object.entries(prev).forEach(([pos, n]) => {
            if (Sset.has(pos) && freeNames.has(n)) { assign[pos] = n; used.add(n); }
        });
        // 2) people back from break/task take their own spot back
        free.forEach(p => {
            const h = home[p.name];
            if (!h || !Sset.has(h) || homeOwner[h] !== p.name || used.has(p.name)) return;
            if (!isBusy(p.name, t - STEP)) return;
            if (assign[h]) used.delete(assign[h]);
            assign[h] = p.name;
            used.add(p.name);
        });
        // 3) fill open spots in priority order
        let pool = free.filter(p => !used.has(p.name));
        for (const pos of S) {
            if (assign[pos] || !pool.length) continue;
            pool.sort((a, b) => scoreFor(b, pos) - scoreFor(a, pos) || a.name.localeCompare(b.name));
            const pick = pool.shift();
            assign[pos] = pick.name;
            used.add(pick.name);
        }
        // 4) a floater stuck in a spot hands it to someone free who isn't a floater
        Object.entries(assign).forEach(([pos, n]) => {
            const person = on.find(p => p.name === n);
            if (!person || !person.floater) return;
            const i = pool.findIndex(p => !p.floater);
            if (i < 0) return;
            const rep = pool.splice(i, 1)[0];
            pool.push(person);
            assign[pos] = rep.name;
        });

        // Home spots (a cover doesn't take over someone's home while they're away)
        Object.entries(assign).forEach(([pos, n]) => {
            const owner = homeOwner[pos];
            const ownerAway = owner && owner !== n && on.some(p => p.name === owner) && isBusy(owner, t);
            if (ownerAway) return;
            if (owner && owner !== n && home[owner] === pos) delete home[owner];
            if (home[n] && home[n] !== pos && homeOwner[home[n]] === n) delete homeOwner[home[n]];
            home[n] = pos;
            homeOwner[pos] = n;
        });

        // Who covered whom
        breaks.filter(b => b.start === t).forEach(b => { b.pos = prevPosOf[b.name] || null; b.cover = b.pos ? (assign[b.pos] || null) : null; });
        tasks.filter(k => k.start === t && k.name).forEach(k => { k.cover = k.pos ? (assign[k.pos] || null) : null; });

        POSITIONS.forEach(p => timeline[p.name].push(assign[p.name] || null));
        pool.forEach(p => { (idleLog[p.name] = idleLog[p.name] || []).push(t); });
        if (on.length && FILL_ORDER.slice(0, 3).some(pos => !assign[pos])) shortSlots.push(t);
        prev = assign;
    }

    // Collapse slot timelines into segments
    const positions = {};
    POSITIONS.forEach(p => {
        const segs = [];
        timeline[p.name].forEach((n, i) => {
            if (!n) return;
            const t = slots[i];
            const last = segs[segs.length - 1];
            if (last && last.name === n && last.to === t) last.to = t + STEP;
            else segs.push({ name: n, from: t, to: t + STEP });
        });
        positions[p.name] = segs;
    });
    const floaters = {};
    Object.entries(idleLog).forEach(([n, ts]) => {
        const segs = [];
        ts.forEach(t => {
            const last = segs[segs.length - 1];
            if (last && last.to === t) last.to = t + STEP; else segs.push({ from: t, to: t + STEP });
        });
        floaters[n] = segs;
    });

    // Short-staffed ranges for the top spots
    const shortRanges = [];
    shortSlots.forEach(t => {
        const last = shortRanges[shortRanges.length - 1];
        if (last && last[1] === t) last[1] = t + STEP; else shortRanges.push([t, t + STEP]);
    });
    shortRanges.forEach(([a, b]) => warnings.push(`Not enough people for DT Bagger 1, DT Drinks and Window 1 from ${fmtClock(a)} to ${fmtClock(b)}.`));

    return {
        date: st.date, daypart: st.daypart, mode,
        window: [W0, W1],
        people: people.map(p => ({ name: p.name, start: p.start, end: p.end, floater: p.floater })),
        positions, floaters,
        breaks: breaks.map(b => ({ name: b.name, start: b.start, end: b.end, ideal: b.ideal, override: b.override, pos: b.pos, cover: b.cover })),
        tasks: tasks.map(k => ({ type: k.type, label: k.label, key: k.key, pinned: !!k.pinned, start: k.start, end: k.end, deadline: k.deadline || null, name: k.name || null, pos: k.pos || null, cover: k.cover || null })),
        warnings,
        generatedAt: Date.now()
    };
}

// =====================================================================
// APP STATE
// =====================================================================
let STAFF = {};          // name -> { role, house }
let RATINGS = {};        // name -> { skill: 1-5 }
let ratingSource = "";
let staffReady = false;

let daypart = "PM";
let view = "roster";
let state = null;
let result = null;
let dirty = true;
let zoom = null;         // null = auto (fit, but stays readable on phones), 'fit' = whole map, number = manual
let focusName = null;
let showNow = true;
let pendingSaved = null;
let mapLayout = null;

function loadDefaults(dp) {
    try { const s = JSON.parse(localStorage.getItem("lineupDefaults:" + dp)); if (s) return { ...DAYPART_DEFAULTS[dp], ...s }; } catch (e) {}
    return { ...DAYPART_DEFAULTS[dp] };
}

function newState(dp) {
    const d = loadDefaults(dp);
    return {
        v: 1, date: todayIso(), daypart: dp, mode: d.mode || "balanced", runners: d.runners || "auto",
        roster: [], defaultShift: { start: d.start, end: d.end },
        lemonade: [], sweep: { on: true }, ice: { on: !!d.iceOn },
        breakOverrides: {}, taskOverrides: {}, savedId: null
    };
}

function draftKey(dp) { return `lineupDraft:${todayIso()}:${dp}`; }

function loadDraft(dp) {
    try {
        const raw = localStorage.getItem(draftKey(dp));
        if (raw) {
            const o = JSON.parse(raw);
            if (o && o.state) { state = o.state; result = o.result || null; dirty = !result; return true; }
        }
    } catch (e) {}
    state = newState(dp); result = null; dirty = true;
    return false;
}

function saveDraftNow() {
    if (!state) return;
    try {
        localStorage.setItem(draftKey(state.daypart), JSON.stringify({ state, result }));
        localStorage.setItem("lineupDefaults:" + state.daypart, JSON.stringify({
            start: state.defaultShift.start, end: state.defaultShift.end,
            iceOn: state.ice.on, mode: state.mode, runners: state.runners
        }));
    } catch (e) {}
}
let saveDraftTimer = null;
function saveDraft() { clearTimeout(saveDraftTimer); saveDraftTimer = setTimeout(saveDraftNow, 250); }

function cleanOldDrafts() {
    try {
        const cutoff = isoDate(new Date(Date.now() - 8 * 86400000));
        Object.keys(localStorage).forEach(k => {
            const m = k.match(/^lineupDraft:(\d{4}-\d{2}-\d{2}):/);
            if (m && m[1] < cutoff) localStorage.removeItem(k);
        });
    } catch (e) {}
}

let liveTimer = null;
function markChanged() {
    dirty = true;
    saveDraft();
    renderRosterMeta();
    updateHero();
    if (isWide()) {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(() => {
            if (state.roster.length && !rosterProblems()) generate();
            renderLineup();
            updateHero();
        }, 450);
    }
}

// =====================================================================
// GOOGLE SHEETS / FORMS
// =====================================================================
async function gvizRows(sheetId, queryText, timeoutMs = 10000, extra = "") {
    if (isPlaceholder(sheetId)) return null;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(queryText)}${extra}&_cb=${Date.now()}`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return null;
        const text = await res.text();
        const prefix = "setResponse(";
        const startIndex = text.indexOf(prefix);
        if (startIndex === -1) return null;
        const data = JSON.parse(text.substring(startIndex + prefix.length, text.lastIndexOf(")")));
        if (!data.table) return null;
        return data.table.rows || [];
    } catch (e) {
        clearTimeout(timeoutId);
        return null;
    }
}

function cellText(cell) {
    if (!cell) return "";
    const raw = (cell.f !== undefined && cell.f !== null) ? cell.f : cell.v;
    if (raw === undefined || raw === null) return "";
    return String(raw).trim();
}
function cellRaw(cell) {
    if (!cell || cell.v === undefined || cell.v === null) return "";
    return String(cell.v).trim();
}

function submitToGoogleForm(formId, formDataObj) {
    const formUrl = `https://docs.google.com/forms/d/e/${formId}/formResponse`;
    return new Promise(resolve => {
        const iframeName = "hidden_iframe_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const iframe = document.createElement("iframe");
        iframe.name = iframeName;
        iframe.style.display = "none";
        document.body.appendChild(iframe);
        const form = document.createElement("form");
        form.action = formUrl;
        form.method = "POST";
        form.target = iframeName;
        form.style.display = "none";
        Object.entries(formDataObj).forEach(([key, value]) => {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = key;
            input.value = value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        let done = false;
        const finish = () => {
            if (done) return;
            done = true;
            setTimeout(() => { form.remove(); iframe.remove(); resolve(true); }, 400);
        };
        iframe.addEventListener("load", finish);
        setTimeout(finish, 15000);
        form.submit();
    });
}

function normalizeSkillHeader(text) {
    const key = String(text || "").toLowerCase().replace(/[^a-z]/g, "");
    if (!key) return null;
    return SKILL_ALIASES[key] || SKILLS.find(s => s.toLowerCase().replace(/[^a-z]/g, "") === key) || null;
}

// Column ids of a sheet, without any row data
async function gvizCols(sheetId, timeoutMs = 10000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=0&tq=${encodeURIComponent("SELECT * LIMIT 0")}&_cb=${Date.now()}`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return null;
        const text = await res.text();
        const start = text.indexOf("setResponse(");
        if (start === -1) return null;
        const data = JSON.parse(text.substring(start + 12, text.lastIndexOf(")")));
        return data.table && data.table.cols ? data.table.cols.map(c => c.id) : null;
    } catch (e) {
        clearTimeout(timeoutId);
        return null;
    }
}

// Staff sheet columns: A Name, B PIN (never downloaded here), C Role, D House, E+ ratings
async function loadStaff() {
    const ids = await gvizCols(STAFF_SHEET_ID);
    if (!ids || !ids.length) return false;
    const keep = ids.filter(id => id !== "B");
    const rows = await gvizRows(STAFF_SHEET_ID, "SELECT " + keep.join(", "), 12000, "&headers=0");
    if (!rows || !rows.length) return false;
    const at = id => keep.indexOf(id);          // position of a sheet column in each row
    const ratingCols = keep.filter(id => id.length > 1 || id >= "E");

    let start = 0;
    let colSkill = {};
    const first = rows[0].c || [];
    if (/^name/i.test(cellText(first[at("A")]))) {
        start = 1;
        ratingCols.forEach(id => { const sk = normalizeSkillHeader(cellText(first[at(id)])); if (sk) colSkill[at(id)] = sk; });
    }
    if (!Object.keys(colSkill).length) {
        SKILLS.forEach((sk, i) => { if (ratingCols[i]) colSkill[at(ratingCols[i])] = sk; });
        ratingSource = "Columns E–M (no rating headers found)";
    } else {
        ratingSource = "Header row: " + Object.values(colSkill).join(", ");
    }

    const staff = {}, ratings = {};
    for (let r = start; r < rows.length; r++) {
        const c = rows[r].c || [];
        const name = cellRaw(c[at("A")]);
        if (!name) continue;
        const role = (cellRaw(c[at("C")]) || "member").toLowerCase();
        const house = (cellRaw(c[at("D")]) || "foh").toLowerCase();
        staff[name] = { role, house };
        const rr = {};
        Object.entries(colSkill).forEach(([i, sk]) => {
            const v = parseFloat(cellRaw(c[i]));
            if (!isNaN(v) && v >= 1 && v <= 5) rr[sk] = Math.round(v);
        });
        ratings[name] = rr;
    }
    if (!Object.keys(staff).length) return false;
    STAFF = staff;
    RATINGS = ratings;
    return true;
}

function lineupFormReady() {

}

// Newest first. Each saved row's Lineup Data cell is JSON {id, state, result}.
async function fetchSavedLineups() {
    const rows = await gvizRows(LINEUP_FORM.sheetId, "SELECT A, B, C, D, E ORDER BY A DESC LIMIT 80", 15000);
    if (rows === null) return null;
    const list = [];
    rows.forEach(row => {
        const c = row.c || [];
        const raw = cellRaw(c[3]);
        if (!raw || raw.charAt(0) !== "{") return;
        try {
            const o = JSON.parse(raw);
            if (o && o.state) list.push({ id: o.id, state: o.state, result: o.result || null, by: cellText(c[4]), at: cellText(c[0]) });
        } catch (e) {}
    });
    return list;
}

async function findSaved(dp, dateIso) {
    const list = await fetchSavedLineups();
    if (!list) return undefined;
    return list.find(x => x.state.daypart === dp && x.state.date === dateIso) || null;
}

// --- Name autocomplete (same pattern as the checklist's assign screen) ---
let nameHighlight = 0;
function nameMatches() {
    const input = document.getElementById("nameInput");
    const q = input ? input.value.trim().toLowerCase() : "";
    const taken = new Set(state.roster.map(r => r.name.toLowerCase()));
    const rank = n => {
        const l = n.toLowerCase();
        if (l.startsWith(q)) return 0;                                   // "Sha" -> Shamya
        if (l.split(/\s+/).some(w => w.startsWith(q))) return 1;         // last name / second word
        return 2;                                                        // anywhere in the name
    };
    return staffNameList()
        .filter(n => !taken.has(n.toLowerCase()) && (!q || n.toLowerCase().includes(q)))
        .sort((a, b) => (q ? rank(a) - rank(b) : 0) || a.localeCompare(b));
}

function nameFilter() {
    const input = document.getElementById("nameInput");
    const box = document.getElementById("nameOptions");
    if (!input || !box) return;
    const q = input.value.trim();
    const matches = nameMatches();
    nameHighlight = 0;
    const rows = matches.slice(0, 50).map((n, i) => {
        const ratings = RATINGS[n] || {};
        const top = Object.entries(ratings).filter(([, v]) => v >= 4).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => k).join(", ");
        return `<div class="suggest-item ${i === 0 ? "highlighted" : ""}" data-n="${esc(n)}" onmousedown="event.preventDefault(); addPerson(this.dataset.n)">${esc(n)}${top ? `<small>${esc(top)}</small>` : ""}</div>`;
    });
    if (q && !matches.some(n => n.toLowerCase() === q.toLowerCase()) && !state.roster.some(r => r.name.toLowerCase() === q.toLowerCase())) {
        rows.push(`<div class="suggest-item ${rows.length === 0 ? "highlighted" : ""}" data-n="${esc(q)}" onmousedown="event.preventDefault(); addPerson(this.dataset.n)">Add "${esc(q)}"<small>not on staff list</small></div>`);
    }
    if (!rows.length) { box.style.display = "none"; box.innerHTML = ""; return; }
    const rect = input.getBoundingClientRect();
    box.style.left = rect.left + "px";
    box.style.top = (rect.bottom + 4) + "px";
    box.style.width = rect.width + "px";
    box.innerHTML = rows.join("");
    box.style.display = "block";
}

function hideNameOptions() {
    const box = document.getElementById("nameOptions");
    if (box) box.style.display = "none";
}

function nameKey(ev) {
    const box = document.getElementById("nameOptions");
    const items = box ? Array.from(box.querySelectorAll(".suggest-item")) : [];
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        if (!items.length) return;
        ev.preventDefault();
        nameHighlight = (nameHighlight + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle("highlighted", i === nameHighlight));
        items[nameHighlight].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
        ev.preventDefault();
        if (items[nameHighlight]) addPerson(items[nameHighlight].dataset.n);
    } else if (ev.key === "Escape") {
        hideNameOptions();
    }
}

// =====================================================================
// GENERATE
// =====================================================================
function rosterProblems() {
    const missing = state.roster.filter(r => !r.start || !r.end).map(r => r.name);
    if (missing.length) return `Add shift times for ${missing.join(", ")}.`;
    return null;
}

function generate() {
    if (!state || !state.roster.length) { result = null; dirty = false; return; }
    result = buildLineup(state, RATINGS);
    dirty = false;
    saveDraft();
    renderSweepTimes();
}

function generateAndShow() {
    if (!state.roster.length) { showStatusMessage("Add at least one person first.", "error"); return; }
    const p = rosterProblems();
    if (p) { showStatusMessage(p, "error"); return; }
    generate();
    updateHero();
    if (isWide()) {
        renderLineup();
        document.getElementById("lineupPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
        setView("lineup");
    }
}

function regenerate() {
    const p = rosterProblems();
    if (p) { showStatusMessage(p, "error"); return; }
    generate();
    updateHero();
    renderLineup();
    showStatusMessage("Lineup rebuilt.", "success", 2000);
}

    showStatusMessage("Refreshing staff and ratings...", "info", 3000);
    const ok = await startStaffLoad();
    if (state && state.roster.length && !rosterProblems()) generate();
    renderAll();
    await checkSavedLineup();
    showStatusMessage(ok ? "Refreshed." : "Couldn't reach the staff sheet — using what was already loaded.", ok ? "success" : "error", 3000);
}

                <input type="time" class="time-input" step="900" value="${hhmm(b.start)}" data-n="${esc(b.name)}" onchange="setBreak(this.dataset.n, this.value)">
                ${isOverride ? `<button type="button" class="link-btn" data-n="${esc(b.name)}" onclick="setBreak(this.dataset.n, '')">Reset</button>` : `<span class="auto-tag">Auto</span>`}
            </div>`;
    }).join("");
}

function renderTaskEditor() {
    const box = document.getElementById("taskEditor");
    if (!box) return;
    const list = result.tasks.slice().sort((a, b) => a.start - b.start);
    if (!list.length) { box.innerHTML = `<p class="card-sub">No tasks this shift.</p>`; return; }
    const icon = { lemonade: ["lemon", ICON.cup], sweep: ["sweep", ICON.broom], ice: ["ice", ICON.ice] };
    box.innerHTML = list.map(k => {
        const [cls, svg] = icon[k.type] || ["sweep", ICON.broom];
        const who = k.name ? `${k.name}${k.pos ? ` · from ${k.pos}${k.cover ? ` → ${k.cover} covers` : ""}` : ""}` : "No one free";
        const extra = k.deadline ? ` · ready by ${fmtT(k.deadline)}` : "";
        const isPinned = !!(state.taskOverrides && k.key && state.taskOverrides[k.key]);
        return `
            <div class="break-row">
                <span class="task-icon ${cls}">${svg}</span>
                <div><b>${esc(k.label)}</b><div class="break-sub">${esc(who)}${extra}</div></div>
                <input type="time" class="time-input" step="900" value="${hhmm(k.start)}" data-k="${esc(k.key || "")}" onchange="setTaskTime(this.dataset.k, this.value)">
                ${isPinned ? `<button type="button" class="link-btn" data-k="${esc(k.key)}" onclick="setTaskTime(this.dataset.k, '')">Reset</button>` : `<span class="auto-tag">Auto</span>`}
            </div>`;
    }).join("");
}

function setTaskTime(key, val) {
    if (!key) return;
    if (!state.taskOverrides) state.taskOverrides = {};
    if (val) state.taskOverrides[key] = val; else delete state.taskOverrides[key];
    dirty = true;
    saveDraft();
    generate();
    updateHero();
    renderLineup();
}

function setBreak(name, val) {
    if (!state.breakOverrides) state.breakOverrides = {};
    if (val) state.breakOverrides[name] = val; else delete state.breakOverrides[name];
    dirty = true;
    saveDraft();
    generate();
    updateHero();
    renderLineup();
}

function renderWarnings() {
    const box = document.getElementById("warnBox");
    if (!box) return;
    const w = result.warnings || [];
    box.innerHTML = `<ul class="warn-list">${w.length ? w.map(x => `<li>${esc(x)}</li>`).join("") : `<li class="ok">Everything is covered — no conflicts.</li>`}</ul>`;
}

// =====================================================================
// MIND MAP LAYOUT + RENDER
// =====================================================================
const MAP_FONT = "'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
let measureCtx = null;
function textW(t, size, weight, italic) {
    if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
    measureCtx.font = `${italic ? "italic " : ""}${weight} ${size}px ${MAP_FONT}`;
    return measureCtx.measureText(t).width;
}

function tint(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function elbow(x1, y1, tx, x2, y2) {
    if (Math.abs(y2 - y1) < 1) return `M${x1} ${y1}H${x2}`;
    const s = y2 > y1 ? 1 : -1;
    const r = Math.min(10, Math.abs(y2 - y1) / 2);
    return `M${x1} ${y1}H${tx - r}Q${tx} ${y1} ${tx} ${y1 + s * r}V${y2 - s * r}Q${tx} ${y2} ${tx + r} ${y2}H${x2}`;
}

function mapGroups(res) {
    const W1 = res.window[1];
    const groups = [];
    ["FC", "DT", "Outside"].forEach(g => {
        const rows = POSITIONS.filter(p => p.group === g && (res.positions[p.name] || []).length).map(p => ({
            label: p.name,
            chain: res.positions[p.name].map(s => ({ text: `${s.name} ${fmtRange(s.from, s.to, W1)}`, name: s.name, from: s.from, to: s.to }))
        }));
        if (rows.length) groups.push({ key: g, rows });
    });
    if (res.breaks.length) {
        groups.push({
            key: "Breaks",
            rows: res.breaks.slice().sort((a, b) => a.start - b.start || a.name.localeCompare(b.name)).map(b => ({
                label: b.name, labelName: b.name,
                chain: [
                    { text: `${fmtT(b.start)}-${fmtT(b.end)}`, name: b.name, from: b.start, to: b.end },
                    b.pos ? { text: b.cover ? `${b.pos}: ${b.cover}` : `${b.pos} closes`, name: b.cover || null, info: true }
                          : { text: "Floating", info: true }
                ]
            }))
        });
    }
    if (res.tasks.length) {
        const order = ["Lemonade", "Parking Lot Sweep", "Ice Bin"];
        const rows = order.filter(l => res.tasks.some(k => k.label === l)).map(l => ({
            label: l,
            chain: res.tasks.filter(k => k.label === l).map(k => ({ text: `${k.name || "Unassigned"} ${fmtT(k.start)}-${fmtT(k.end)}`, name: k.name, from: k.start, to: k.end }))
        }));
        groups.push({ key: "Tasks", rows });
    }
    const fl = Object.entries(res.floaters || {}).filter(([, segs]) => segs.length);
    if (fl.length) {
        groups.push({
            key: "Floaters",
            rows: fl.sort((a, b) => a[1][0].from - b[1][0].from || a[0].localeCompare(b[0])).map(([n, segs]) => ({
                label: n, labelName: n,
                chain: segs.map(s => ({ text: fmtRange(s.from, s.to, W1), name: n, from: s.from, to: s.to }))
            }))
        });
    }
    return groups;
}

function layoutMap(res, opts = {}) {
    const groups = mapGroups(res);
    const nowM = opts.now === false ? null : (showNow ? nowInWindow() : null);
    const NODE_H = 34, ROW = 48, PADX = 13, GROUP_GAP = 16, CHAIN_GAP = 26;
    const nodes = [], edges = [];

    const sub = `${res.daypart} · ${shortDate(res.date)}`;
    const rootW = Math.max(textW("Lineup", 30, 700), textW(sub, 13, 600)) + 44;
    const rootH = 76;
    const groupW = Math.max(...groups.map(g => textW(GROUPS[g.key].label, 17, 700))) + 34;
    const rootX = 18;
    const groupX = rootX + rootW + 52;
    const posX = groupX + groupW + 46;

    let y = 18;
    groups.forEach(g => {
        g.rows.forEach(r => { r.cy = y + ROW / 2; y += ROW; });
        g.cy = (g.rows[0].cy + g.rows[g.rows.length - 1].cy) / 2;
        y += GROUP_GAP;
    });
    const height = Math.max(y + 4, rootH + 40);
    const rootCy = groups.length ? (groups[0].cy + groups[groups.length - 1].cy) / 2 : height / 2;

    nodes.push({
        kind: "root", x: rootX, y: rootCy - rootH / 2, w: rootW, h: rootH, r: 14, fill: "#002a4f",
        lines: [{ text: "Lineup", size: 30, weight: 700, color: "#ffffff", dy: -9 }, { text: sub, size: 13, weight: 600, color: "#fbbf24", dy: 19 }]
    });

    let maxX = rootX + rootW;
    const rootTrunk = rootX + rootW + 24;
    groups.forEach(g => {
        const G = GROUPS[g.key];
        const gh = 40;
        edges.push({ d: elbow(rootX + rootW, rootCy, rootTrunk, groupX, g.cy), color: G.color, wd: 3 });
        nodes.push({ kind: "group", x: groupX, y: g.cy - gh / 2, w: groupW, h: gh, r: 12, fill: G.color, lines: [{ text: G.label, size: 17, weight: 700, color: G.text, dy: 0 }] });
        const trunk = groupX + groupW + 22;
        g.rows.forEach(r => {
            const pw = textW(r.label, 15, 700) + PADX * 2;
            edges.push({ d: elbow(groupX + groupW, g.cy, trunk, posX, r.cy), color: G.color, wd: 2 });
            nodes.push({
                kind: "pos", x: posX, y: r.cy - NODE_H / 2, w: pw, h: NODE_H, r: 10, fill: "#ffffff", stroke: G.color, sw: 2,
                name: r.labelName || null, lines: [{ text: r.label, size: 15, weight: 700, color: "#1e293b", dy: 0 }]
            });
            let x = posX + pw;
            r.chain.forEach(c => {
                const italic = !!c.info;
                const w = textW(c.text, c.info ? 14 : 15, c.info ? 500 : 600, italic) + PADX * 2;
                const nx = x + CHAIN_GAP;
                edges.push({ d: `M${x} ${r.cy}H${nx}`, color: G.color, wd: 2 });
                const isNow = nowM !== null && c.from !== undefined && c.from <= nowM && nowM < c.to;
                nodes.push({
                    kind: c.info ? "info" : "seg", x: nx, y: r.cy - NODE_H / 2, w, h: NODE_H, r: 10,
                    fill: isNow ? tint(G.color, 0.22) : (c.info ? "#f8fafc" : "#ffffff"),
                    stroke: G.color, sw: isNow ? 3.5 : (c.info ? 1.5 : 2), dash: !!c.info, now: isNow,
                    name: c.name || null,
                    lines: [{ text: c.text, size: c.info ? 14 : 15, weight: c.info ? 500 : 600, color: c.info ? "#475569" : "#1e293b", dy: 0, italic }]
                });
                x = nx + w;
            });
            maxX = Math.max(maxX, x);
        });
        maxX = Math.max(maxX, posX);
    });

    return { w: Math.ceil(maxX + 22), h: Math.ceil(height), nodes, edges };
}

function svgFromLayout(L) {
    const out = [`<svg xmlns="http://www.w3.org/2000/svg" id="mapSvg" viewBox="0 0 ${L.w} ${L.h}" width="${L.w}" height="${L.h}">`];
    L.edges.forEach(e => out.push(`<path d="${e.d}" fill="none" stroke="${e.color}" stroke-width="${e.wd}" stroke-linecap="round"/>`));
    L.nodes.forEach(n => {
        const click = n.name ? ` data-name="${esc(n.name)}" onclick="focusPerson(this.dataset.name)"` : "";
        out.push(`<g class="mm-node ${n.kind}${n.name ? " clickable" : ""}${n.now ? " now" : ""}"${click}>`);
        out.push(`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${n.r}" fill="${n.fill}"${n.stroke ? ` stroke="${n.stroke}" stroke-width="${n.sw}"${n.dash ? ' stroke-dasharray="5 4"' : ""}` : ""}/>`);
        n.lines.forEach(l => {
            out.push(`<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + l.dy}" text-anchor="middle" dominant-baseline="central" font-family="${MAP_FONT.replace(/"/g, "'")}" font-size="${l.size}" font-weight="${l.weight}"${l.italic ? ' font-style="italic"' : ""} fill="${l.color}">${esc(l.text)}</text>`);
        });
        out.push(`</g>`);
    });
    out.push(`</svg>`);
    return out.join("");
}

function renderMap() {
    const wrap = document.getElementById("mapWrap");
    if (!wrap || !result) return;
    mapLayout = layoutMap(result);
    wrap.innerHTML = svgFromLayout(mapLayout);
    applyZoom();
    applyFocus();
}

function applyZoom() {
    const svg = document.getElementById("mapSvg");
    const wrap = document.getElementById("mapWrap");
    if (!svg || !wrap || !mapLayout) return;
    const s = currentScale();
    svg.setAttribute("width", Math.round(mapLayout.w * s));
    svg.setAttribute("height", Math.round(mapLayout.h * s));
}

function currentScale() {
    const wrap = document.getElementById("mapWrap");
    if (typeof zoom === "number") return zoom;
    if (!wrap || !mapLayout) return 1;
    const fit = Math.min(1, (wrap.clientWidth - 4) / mapLayout.w);
    if (zoom === "fit") return Math.max(0.2, fit);
    return Math.max(0.62, fit); // auto: readable text, scroll sideways if needed
}
function zoomBy(d) { zoom = Math.max(0.3, Math.min(2.5, Math.round((currentScale() + d) * 100) / 100)); renderLineup(); }
function zoomFit() { zoom = (zoom === "fit") ? null : "fit"; renderLineup(); }

function focusPerson(name) {
    focusName = (focusName === name) ? null : name;
    applyFocus();
}

function applyFocus() {
    const svg = document.getElementById("mapSvg");
    const bar = document.getElementById("focusBar");
    if (!svg || !bar) return;
    if (!focusName) {
        svg.classList.remove("focusing");
        bar.classList.remove("active");
        return;
    }
    svg.classList.add("focusing");
    svg.querySelectorAll(".mm-node").forEach(g => {
        const mine = g.dataset.name === focusName;
        g.classList.toggle("keep", mine || g.classList.contains("root") || g.classList.contains("group"));
        g.classList.toggle("focused", mine);
    });
    const p = result.people.find(x => x.name === focusName);
    const b = result.breaks.find(x => x.name === focusName);
    const tasks = result.tasks.filter(k => k.name === focusName).map(k => `${k.label} ${fmtT(k.start)}-${fmtT(k.end)}`);
    bar.innerHTML = `<span>Showing <b>${esc(focusName)}</b></span>
        ${p ? `<span>Shift ${fmtT(p.start)}-${fmtT(p.end)}</span>` : ""}
        ${b ? `<span>Break ${fmtT(b.start)}-${fmtT(b.end)}</span>` : ""}
        ${tasks.length ? `<span>${esc(tasks.join(" · "))}</span>` : ""}
        <button type="button" onclick="focusPerson(focusName)">Clear</button>`;
    bar.classList.add("active");
}

window.addEventListener("resize", () => { if (view === "lineup" && typeof zoom !== "number") applyZoom(); });
setInterval(() => { if (view === "lineup" && result && showNow && !document.querySelector(".modal-overlay.active")) { renderMap(); } }, 60000);

// =====================================================================
// EXPORTS
// =====================================================================
function fileBase() { return `lineup-${result.date}-${result.daypart}`; }

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function openExport() {
    const has = !!result;
    document.querySelectorAll("#exportModal .needs-result").forEach(b => { b.disabled = !has; });
    const shareBtn = document.getElementById("sharePngBtn");
    shareBtn.style.display = canShareFiles() ? "" : "none";
    const help = [];
    if (!has) help.push("Generate a lineup first to export it.");
    if (!lineupFormReady()) help.push("Saving to Google Sheets isn't set up yet — paste the form and sheet IDs into LINEUP_FORM at the top of the code.");
    help.push("The .mm file opens in mind map apps that import FreeMind maps. The .lineup file keeps everything (roster, tasks, breaks) and reopens here with Import.");
    document.getElementById("exportHelp").innerText = help.join(" ");
    document.getElementById("exportModal").classList.add("active");
}
function closeExport() { document.getElementById("exportModal").classList.remove("active"); }

function canShareFiles() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] })); } catch (e) { return false; }
}

function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

async function exportPNG(share) {
    if (!result) return;
    try { await document.fonts.ready; } catch (e) {}
    const L = layoutMap(result, { now: false });
    const sc = 2;
    const c = document.createElement("canvas");
    c.width = L.w * sc;
    c.height = L.h * sc;
    const ctx = c.getContext("2d");
    ctx.scale(sc, sc);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, L.w, L.h);
    L.edges.forEach(e => {
        ctx.strokeStyle = e.color;
        ctx.lineWidth = e.wd;
        ctx.lineCap = "round";
        ctx.stroke(new Path2D(e.d));
    });
    L.nodes.forEach(n => {
        roundRectPath(ctx, n.x, n.y, n.w, n.h, n.r);
        ctx.fillStyle = n.fill;
        ctx.fill();
        if (n.stroke) {
            ctx.setLineDash(n.dash ? [5, 4] : []);
            ctx.lineWidth = n.sw;
            ctx.strokeStyle = n.stroke;
            ctx.stroke();
            ctx.setLineDash([]);
        }
        n.lines.forEach(l => {
            ctx.font = `${l.italic ? "italic " : ""}${l.weight} ${l.size}px ${MAP_FONT}`;
            ctx.fillStyle = l.color;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(l.text, n.x + n.w / 2, n.y + n.h / 2 + l.dy);
        });
    });
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    if (!blob) { showStatusMessage("Couldn't create the picture.", "error"); return; }
    const name = fileBase() + ".png";
    if (share && canShareFiles()) {
        try {
            await navigator.share({ files: [new File([blob], name, { type: "image/png" })], title: `${result.daypart} Lineup` });
            return;
        } catch (e) {
            if (e && e.name === "AbortError") return;
        }
    }
    downloadBlob(blob, name);
    showStatusMessage("Picture saved.", "success", 2500);
}

function lineupText(res) {
    const W1 = res.window[1];
    const lines = [`LINEUP — ${res.daypart} · ${prettyDate(res.date)} (${MODES[res.mode] ? MODES[res.mode].long : ""})`, ""];
    ["FC", "DT", "Outside"].forEach(g => {
        const rows = POSITIONS.filter(p => p.group === g && (res.positions[p.name] || []).length);
        if (!rows.length) return;
        lines.push(g.toUpperCase());
        rows.forEach(p => lines.push(`  ${p.name}: ${res.positions[p.name].map(s => `${s.name} ${fmtRange(s.from, s.to, W1)}`).join(" → ")}`));
        lines.push("");
    });
    if (res.breaks.length) {
        lines.push("BREAKS");
        res.breaks.slice().sort((a, b) => a.start - b.start).forEach(b => {
            lines.push(`  ${b.name} ${fmtT(b.start)}-${fmtT(b.end)}${b.pos ? ` (${b.pos}: ${b.cover || "closes"})` : ""}`);
        });
        lines.push("");
    }
    if (res.tasks.length) {
        lines.push("TASKS");
        res.tasks.forEach(k => lines.push(`  ${k.label}: ${k.name || "Unassigned"} ${fmtT(k.start)}-${fmtT(k.end)}${k.deadline ? ` (ready by ${fmtT(k.deadline)})` : ""}`));
        lines.push("");
    }
    const fl = Object.entries(res.floaters || {}).filter(([, s]) => s.length);
    if (fl.length) {
        lines.push("FLOATERS");
        fl.forEach(([n, segs]) => lines.push(`  ${n}: ${segs.map(s => fmtRange(s.from, s.to, W1)).join(", ")}`));
    }
    return lines.join("\n").trim() + "\n";
}

async function copyText() {
    if (!result) return;
    const text = lineupText(result);
    try {
        await navigator.clipboard.writeText(text);
    } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (err) {}
        ta.remove();
    }
    showStatusMessage("Lineup text copied.", "success", 2500);
}

function downloadText() {
    if (!result) return;
    downloadBlob(new Blob([lineupText(result)], { type: "text/plain" }), fileBase() + ".txt");
}

function downloadLineupFile() {
    if (!result) return;
    const data = { app: "lineup-generator", v: 1, state, result };
    downloadBlob(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), fileBase() + ".lineup");
}

// FreeMind .mm - each chain is nested so it reads left to right like the on-screen map
function downloadMindMap() {
    if (!result) return;
    const x = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const groups = mapGroups(result);
    let out = `<map version="1.0.1">\n<node TEXT="${x(`Lineup ${result.daypart} ${shortDate(result.date)}`)}">\n`;
    groups.forEach((g, gi) => {
        const G = GROUPS[g.key];
        out += `<node TEXT="${x(G.label)}" POSITION="right" COLOR="${G.color}" BACKGROUND_COLOR="#ffffff">\n<edge COLOR="${G.color}" WIDTH="2"/>\n`;
        g.rows.forEach(r => {
            out += `<node TEXT="${x(r.label)}">\n`;
            r.chain.forEach(c => { out += `<node TEXT="${x(c.text)}">\n`; });
            r.chain.forEach(() => { out += `</node>\n`; });
            out += `</node>\n`;
        });
        out += `</node>\n`;
    });
    out += `</node>\n</map>\n`;
    downloadBlob(new Blob([out], { type: "application/x-freemind" }), fileBase() + ".mm");
}

function importFile(input) {
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        let o;
        try { o = JSON.parse(reader.result); } catch (e) { showStatusMessage("That file isn't a lineup file.", "error"); return; }
        if (!o || !o.state || !Array.isArray(o.state.roster)) { showStatusMessage("That file isn't a lineup file.", "error"); return; }
        applyLoadedLineup(o.state, o.result || null, `Imported ${file.name}`);
        closeExport();
    };
    reader.readAsText(file);
}

// Same day = show exactly what was saved. Different day = reuse the roster for today.
function applyLoadedLineup(loadedState, loadedResult, label, savedId) {
    saveDraftNow();
    const dp = loadedState.daypart === "AM" ? "AM" : "PM";
    const base = newState(dp);
    const sameDay = loadedState.date === todayIso();
    state = { ...base, ...loadedState, date: todayIso(), daypart: dp, savedId: savedId || null };
    state.breakOverrides = sameDay ? (loadedState.breakOverrides || {}) : {};
    state.taskOverrides = sameDay ? (loadedState.taskOverrides || {}) : {};
    daypart = dp;
    document.querySelectorAll(".am-pm-btn").forEach(b => b.classList.toggle("active", b.dataset.dp === dp));
    if (sameDay && loadedResult) { result = loadedResult; dirty = false; }
    else { generate(); }
    saveDraftNow();
    pendingSaved = null;
    focusName = null;
    showStatusMessage(sameDay ? `${label}.` : `${label} from ${shortDate(loadedState.date)} — rebuilt for today.`, "success", 5000);
    updateHero();
    if (isWide()) renderAll(); else setView(result ? "lineup" : "roster");
}
